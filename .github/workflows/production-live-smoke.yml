name: Production Live Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    name: Real Provider + Production Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_DIR: ${{ github.workspace }}/data/production-live-smoke
      AI_ROUTER_CONFIG: ${{ github.workspace }}/config/ai-router.json
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      QWENCLOUD_API_KEY: ${{ secrets.QWENCLOUD_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
      ANYAPI_API_KEY: ${{ secrets.ANYAPI_API_KEY }}
      ARLIAI_API_KEY: ${{ secrets.ARLIAI_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
      CEREBRAS_FREE_ONLY: 'true'
      QWENCLOUD_FREE_ONLY: 'true'
      QWENCLOUD_MODEL: 'qwen3.6-flash'
      GROQ_TEXT_MODEL: 'openai/gpt-oss-120b'
      GEMINI_MODEL: 'gemini-3.6-flash'
      LONG_SLOT_MAX_OUTPUT_TOKENS: '1200'
      ENABLE_TOGETHER_PROVIDER: 'false'
      ENABLE_MISTRAL_PROVIDER: 'true'
      ENABLE_MISTRAL_LONG_STORY_PROVIDER: 'true'
      ENABLE_SAMBANOVA_PROVIDER: 'true'
      ENABLE_HUGGINGFACE_PROVIDER: 'true'
      ENABLE_LLM7_PROVIDER: 'true'
      ENABLE_ANYAPI_PROVIDER: 'true'
      ENABLE_ARLIAI_PROVIDER: 'true'
      ENABLE_OLLAMACLOUD_PROVIDER: 'true'
      ENABLE_MODELSCOPE_PROVIDER: 'true'
      ENABLE_FREELLMAPI_PROVIDER: 'true'
      ENABLE_OLLAMA_PROVIDER: 'true'
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install smoke dependencies
        run: python -m pip install --disable-pip-version-check json-repair
      - name: Install media tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run real production smoke
        run: |
          set -Eeuo pipefail
          python -m py_compile scripts/ai_router.py scripts/compatible_provider_pool.py scripts/production_live_smoke.py
          python scripts/provider_mesh_audit.py
          python scripts/production_live_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: production-live-smoke-${{ github.run_number }}
          path: data/production-live-smoke
          if-no-files-found: ignore
