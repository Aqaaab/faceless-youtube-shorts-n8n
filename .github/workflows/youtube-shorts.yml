name: YouTube Shorts Automation

on:
  workflow_dispatch:

  schedule:
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
    - cron: "0 21 * * *"

permissions:
  contents: read

jobs:
  create-and-upload-short:

    runs-on: ubuntu-latest

    timeout-minutes: 40

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

      GEMINI_MODEL: gemini-3.6-flash

      VOICE: af_bella
      SPEED: "1.0"
      LANG: en-us

      MUSIC_ENABLED: "true"
      MUSIC_VOLUME: "0.10"

      ANIMATION_ENABLED: "true"

      ADS_ENABLED: "false"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system tools
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            jq \
            curl \
            wget \
            unzip \
            espeak-ng \
            libsndfile1

          echo "======================================"
          echo "SYSTEM TOOLS"
          echo "======================================"

          python3 --version
          pip --version
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          jq --version
          curl --version | head -n 1
          espeak-ng --version

      - name: Install Python packages
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pip install \
            --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2 \
            soundfile \
            kokoro-tts

          python -m pip show kokoro-tts || true
          python -m pip show kokoro || true
          python -m pip show soundfile || true

      - name: Prepare Kokoro model
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/.local/bin:$PATH"

          KOKORO_DIR="$GITHUB_WORKSPACE/kokoro-models"

          mkdir -p "$KOKORO_DIR"

          VOICES_FILE="$KOKORO_DIR/voices-v1.0.bin"
          MODEL_FILE="$KOKORO_DIR/kokoro-v1.0.onnx"

          echo "Kokoro directory:"
          echo "$KOKORO_DIR"

          if [[ ! -s "$VOICES_FILE" ]]; then

            echo "Downloading Kokoro voices..."

            curl \
              -fL \
              --retry 5 \
              --retry-delay 3 \
              --connect-timeout 20 \
              --max-time 300 \
              -o "$VOICES_FILE" \
              "https://github.com/nazdridoy/kokoro-tts/releases/download/v1.0.0/voices-v1.0.bin"

          else

            echo "Kokoro voices already exist."

          fi

          if [[ ! -s "$MODEL_FILE" ]]; then

            echo "Downloading Kokoro ONNX model..."

            curl \
              -fL \
              --retry 5 \
              --retry-delay 3 \
              --connect-timeout 20 \
              --max-time 300 \
              -o "$MODEL_FILE" \
              "https://github.com/nazdridoy/kokoro-tts/releases/download/v1.0.0/kokoro-v1.0.onnx"

          else

            echo "Kokoro ONNX model already exists."

          fi

          [[ -s "$VOICES_FILE" ]] || {
            echo "::error::Kokoro voices model was not downloaded."
            exit 1
          }

          [[ -s "$MODEL_FILE" ]] || {
            echo "::error::Kokoro ONNX model was not downloaded."
            exit 1
          }

          echo "KOKORO_PATH=$KOKORO_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "KOKORO MODEL READY"
          echo "======================================"

          ls -lh "$VOICES_FILE"
          ls -lh "$MODEL_FILE"

      - name: Check Kokoro
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/.local/bin:$PATH"
          export KOKORO_PATH="$GITHUB_WORKSPACE/kokoro-models"

          KOKORO_BIN="$(command -v kokoro-tts || true)"

          if [[ -z "$KOKORO_BIN" ]]; then

            echo "::error::kokoro-tts CLI was not found."

            python -m pip show kokoro-tts || true

            exit 1

          fi

          echo "KOKORO_BIN=$KOKORO_BIN" >> "$GITHUB_ENV"

          echo "======================================"
          echo "KOKORO CLI"
          echo "======================================"

          echo "$KOKORO_BIN"

          "$KOKORO_BIN" --help >/dev/null

          echo "Available voices:"

          "$KOKORO_BIN" --help-voices || true

          echo "Testing required voice: $VOICE"

          "$KOKORO_BIN" \
            --help-voices 2>/dev/null |
            grep -E "(^|[[:space:]])${VOICE}([[:space:]]|$)" \
            >/dev/null || {

              echo "::error::Required Kokoro voice '$VOICE' was not found."

              exit 1

            }

      - name: Test Kokoro TTS
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/.local/bin:$PATH"
          export KOKORO_PATH="$GITHUB_WORKSPACE/kokoro-models"

          TEST_DIR="$RUNNER_TEMP/kokoro-test"

          mkdir -p "$TEST_DIR"

          printf '%s\n' \
            "This is a Kokoro text to speech system test." \
            > "$TEST_DIR/test.txt"

          echo "Running Kokoro test..."

          "$KOKORO_BIN" \
            "$TEST_DIR/test.txt" \
            "$TEST_DIR/test.wav" \
            --voice "$VOICE" \
            --speed "$SPEED" \
            --lang "$LANG" \
            --debug

          [[ -s "$TEST_DIR/test.wav" ]] || {
            echo "::error::Kokoro test did not create audio."
            exit 1
          }

          TEST_DURATION="$(
            ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$TEST_DIR/test.wav"
          )"

          echo "Kokoro test duration: ${TEST_DURATION}s"

          echo "Kokoro TTS test passed."

      - name: Check production file
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ -f "scripts/produce.sh" ]] || {

            echo "::error::scripts/produce.sh was not found."

            exit 1

          }

          chmod +x scripts/produce.sh

          echo "Checking shell syntax..."

          bash -n scripts/produce.sh

          echo "produce.sh syntax OK."

      - name: Check required secrets
        shell: bash
        run: |
          set -Eeuo pipefail

          missing=0

          for name in \
            GEMINI_API_KEY \
            PEXELS_API_KEY \
            YOUTUBE_CLIENT_ID \
            YOUTUBE_CLIENT_SECRET \
            YOUTUBE_REFRESH_TOKEN
          do

            if [[ -z "${!name:-}" ]]; then

              echo "::error::$name is missing from GitHub Secrets."

              missing=1

            fi

          done

          if (( missing != 0 )); then
            exit 1
          fi

          echo "All required secrets are available."

      - name: Generate Short job.json
        shell: bash
        run: |
          set -Eeuo pipefail

          RUN_DIR="$RUNNER_TEMP/short-run"

          mkdir -p "$RUN_DIR"

          export RUN_DIR

          python3 <<'PY'

          import json
          import os
          import random
          import re
          import time
          import urllib.error
          import urllib.request

          api_key = os.environ["GEMINI_API_KEY"].strip()

          model = os.environ.get(
              "GEMINI_MODEL",
              "gemini-3.6-flash"
          ).strip()

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/"
              + model
              + ":generateContent"
          )

          prompt = r'''
          You are an expert YouTube Shorts writer.

          Create ONE surprising, accurate and verifiable
          "Did You Know?" YouTube Short.

          Return JSON only and follow the schema exactly.

          SCRIPT:

          - Natural conversational English.
          - 70 to 90 English words.
          - Start immediately with a strong curiosity hook.
          - Short conversational sentences.
          - ONE main fact only.
          - No emojis.
          - No hashtags inside narration.
          - End with a short question or follow-for-more line.

          ARABIC:

          - subtitle_ar must be a complete and accurate Modern Standard Arabic translation of the entire script.
          - Preserve the meaning.
          - Do not add claims.

          TITLE:

          - Maximum 90 characters.
          - English only.
          - Must end with #Shorts.

          DESCRIPTION:

          - 2 or 3 natural English sentences.
          - Then a new line containing exactly 5 relevant hashtags.
          - English only.

          TAGS:

          - 8 to 12 lowercase English keywords.

          QUERY:

          - One or two English words only.
          - Describe the main visual subject for Pexels.
          - No punctuation.

          TOPIC:

          - Short English description of the main fact.

          CATEGORY:

          Choose exactly one:

          science
          space
          animals
          human body
          psychology
          history
          technology
          nature
          geography
          inventions
          ocean
          weather
          transportation
          everyday objects
          mysteries
          unusual facts

          FACT RULES:

          - The fact must be verifiable.
          - Do not invent statistics.
          - Do not invent historical claims.
          - Do not use fake scientific claims.
          - Avoid uncertain or disputed facts.
          - Make the hook immediately interesting.
          - Keep the content suitable for YouTube Shorts.
          - Do not put Arabic text in title, description, tags or query.
          '''

          schema = {

              "type": "object",

              "properties": {

                  "hook": {
                      "type": "string"
                  },

                  "script": {
                      "type": "string"
                  },

                  "subtitle_ar": {
                      "type": "string"
                  },

                  "title": {
                      "type": "string"
                  },

                  "description": {
                      "type": "string"
                  },

                  "tags": {
                      "type": "array",
                      "items": {
                          "type": "string"
                      }
                  },

                  "query": {
                      "type": "string"
                  },

                  "topic": {
                      "type": "string"
                  },

                  "category": {
                      "type": "string"
                  }

              },

              "required": [
                  "hook",
                  "script",
                  "subtitle_ar",
                  "title",
                  "description",
                  "tags",
                  "query",
                  "topic",
                  "category"
              ]
          }

          body = {

              "contents": [

                  {
                      "role": "user",

                      "parts": [

                          {
                              "text": prompt
                          }

                      ]
                  }

              ],

              "generationConfig": {

                  "maxOutputTokens": 4000,

                  "responseMimeType":
                      "application/json",

                  "responseSchema":
                      schema

              }

          }

          def make_request():

              return urllib.request.Request(

                  url,

                  data=json.dumps(
                      body,
                      ensure_ascii=False
                  ).encode("utf-8"),

                  headers={

                      "x-goog-api-key":
                          api_key,

                      "Content-Type":
                          "application/json"

                  },

                  method="POST"

              )

          data = None

          max_attempts = 6

          for attempt in range(
              1,
              max_attempts + 1
          ):

              print(
                  f"Gemini attempt "
                  f"{attempt}/{max_attempts}"
              )

              try:

                  with urllib.request.urlopen(
                      make_request(),
                      timeout=120
                  ) as response:

                      result = json.load(response)

                  content = (
                      result["candidates"][0]
                      ["content"]["parts"][0]["text"]
                  )

                  data = json.loads(content)

                  print(
                      "Gemini generation succeeded."
                  )

                  break

              except urllib.error.HTTPError as error:

                  error_body = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(
                      "Gemini HTTP error:",
                      error.code
                  )

                  print(
                      error_body[:3000]
                  )

                  if error.code in (
                      429,
                      500,
                      502,
                      503,
                      504
                  ):

                      if attempt >= max_attempts:
                          raise

                      delay = min(
                          15 * (2 ** (attempt - 1)),
                          120
                      )

                      delay += random.uniform(
                          1,
                          3
                      )

                      print(
                          f"Retrying in "
                          f"{delay:.1f} seconds..."
                      )

                      time.sleep(delay)

                      continue

                  raise

              except (
                  json.JSONDecodeError,
                  KeyError,
                  IndexError,
                  TypeError
              ) as error:

                  print(
                      "Invalid Gemini response:",
                      repr(error)
                  )

                  if attempt >= max_attempts:
                      raise

                  time.sleep(
                      min(
                          5 * attempt,
                          30
                      )
                  )

          if not isinstance(
              data,
              dict
          ):

              raise RuntimeError(
                  "Gemini did not return a JSON object."
              )

          def clean(name):

              value = data.get(
                  name,
                  ""
              )

              if isinstance(
                  value,
                  str
              ):

                  return value.strip()

              return str(value).strip()

          hook = clean("hook")
          script = clean("script")
          subtitle_ar = clean("subtitle_ar")
          title = clean("title")
          description = clean("description")
          query = clean("query")
          topic = clean("topic")
          category = clean("category")

          tags = data.get(
              "tags",
              []
          )

          if not isinstance(
              tags,
              list
          ):

              tags = []

          tags = [

              str(x).strip().lower()

              for x in tags

              if str(x).strip()

          ]

          if not all([
              hook,
              script,
              subtitle_ar,
              title,
              description,
              query,
              topic,
              category
          ]):

              raise RuntimeError(
                  "Gemini returned one or more "
                  "empty required fields."
              )

          words = len(
              script.split()
          )

          if not 70 <= words <= 90:

              raise RuntimeError(
                  f"Script word count is "
                  f"{words}; expected 70-90."
              )

          if (
              len(title) > 90
              or not title.endswith("#Shorts")
          ):

              raise RuntimeError(
                  "Title must be <=90 characters "
                  "and end with #Shorts."
              )

          if not re.fullmatch(
              r"[A-Za-z]+(?: [A-Za-z]+)?",
              query
          ):

              raise RuntimeError(
                  f"Invalid Pexels query: "
                  f"{query!r}"
              )

          allowed_categories = {

              "science",
              "space",
              "animals",
              "human body",
              "psychology",
              "history",
              "technology",
              "nature",
              "geography",
              "inventions",
              "ocean",
              "weather",
              "transportation",
              "everyday objects",
              "mysteries",
              "unusual facts"

          }

          if category not in allowed_categories:

              raise RuntimeError(
                  f"Invalid category: "
                  f"{category!r}"
              )

          if not 8 <= len(tags) <= 12:

              raise RuntimeError(
                  f"Expected 8-12 tags, "
                  f"got {len(tags)}."
              )

          hashtags = re.findall(
              r"(?<!\w)#[A-Za-z0-9_]+",
              description
          )

          if len(hashtags) != 5:

              raise RuntimeError(
                  "Description must contain "
                  "exactly 5 hashtags."
              )

          job = {

              "voice":
                  os.environ.get(
                      "VOICE",
                      "af_bella"
                  ),

              "speed":
                  float(
                      os.environ.get(
                          "SPEED",
                          "1.0"
                      )
                  ),

              "lang":
                  os.environ.get(
                      "LANG",
                      "en-us"
                  ),

              "music":
                  os.environ.get(
                      "MUSIC_ENABLED",
                      "true"
                  ).lower() == "true",

              "music_volume":
                  float(
                      os.environ.get(
                          "MUSIC_VOLUME",
                          "0.10"
                      )
                  ),

              "animation":
                  os.environ.get(
                      "ANIMATION_ENABLED",
                      "true"
                  ).lower() == "true",

              "ads":
                  False,

              "title":
                  title,

              "description":
                  description,

              "tags":
                  tags,

              "topic":
                  topic,

              "category":
                  category,

       
