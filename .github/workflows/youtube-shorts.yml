name: YouTube Shorts Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: read

jobs:
  create-and-upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install required tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg jq python3-pip

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          for name in \
            GEMINI_API_KEY \
            PEXELS_API_KEY \
            YOUTUBE_CLIENT_ID \
            YOUTUBE_CLIENT_SECRET \
            YOUTUBE_REFRESH_TOKEN
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing from GitHub Secrets."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "All required secrets are available."

      - name: Generate Short script with Gemini
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          import time

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()

          if not api_key:
              raise RuntimeError("GEMINI_API_KEY is empty")

          model = "gemini-3.6-flash"

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/"
              + model +
              ":generateContent"
          )

          schema = {
              "type": "object",
              "properties": {
                  "hook": {
                      "type": "string"
                  },
                  "script": {
                      "type": "string"
                  },
                  "title": {
                      "type": "string"
                  },
                  "description": {
                      "type": "string"
                  },
                  "tags": {
                      "type": "array",
                      "items": {
                          "type": "string"
                      }
                  },
                  "query": {
                      "type": "string"
                  },
                  "voice": {
                      "type": "string"
                  }
              },
              "required": [
                  "hook",
                  "script",
                  "title",
                  "description",
                  "tags",
                  "query",
                  "voice"
              ]
          }

          prompt = """
          You are a viral YouTube Shorts scriptwriter specialising in
          surprising, verifiable "Did you know?" facts.

          Generate ONE fresh YouTube Short.

          Requirements:

          hook:
          One short pattern-interrupt opening sentence.

          script:
          Full narration.
          90-130 words.
          Start with the hook.
          Conversational and punchy.
          Include ONE genuinely surprising and accurate fact.
          End with a short question or follow-for-more line.
          No emojis.
          No hashtags.
          No stage directions.

          title:
          Maximum 90 characters.
          Curiosity-driven.
          Must end with " #Shorts".

          description:
          2-3 sentences.
          Then a new line containing 5 relevant hashtags.

          tags:
          8-12 lowercase keyword strings.

          query:
          1-2 word stock-video search term matching the visual mood.

          voice:
          Must be exactly one of:
          en-US-AriaNeural
          en-US-GuyNeural
          en-GB-SoniaNeural

          Vary topics across:
          science, space, history, biology, psychology,
          technology and nature.

          Pick facts that are accurate and genuinely surprising.

          Return only the requested structured JSON object.
          """

          body = {
              "contents": [
                  {
                      "role": "user",
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.8,
                  "maxOutputTokens": 3000,
                  "responseMimeType": "application/json",
                  "responseSchema": schema
              }
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(body).encode("utf-8"),
              headers={
                  "x-goog-api-key": api_key,
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          last_error = None

          for attempt in range(1, 4):

              try:
                  print(
                      "Gemini request attempt:",
                      attempt
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=90
                  ) as response:

                      result = json.load(response)

                  content = (
                      result["candidates"][0]
                      ["content"]["parts"][0]["text"]
                  )

                  data = json.loads(content)

                  break

              except json.JSONDecodeError as e:

                  last_error = e

                  print(
                      "Gemini returned invalid JSON."
                  )

                  if attempt < 3:
                      time.sleep(2)
                      continue

                  raise RuntimeError(
                      "Gemini returned invalid JSON after 3 attempts."
                  ) from e

              except urllib.error.HTTPError as e:

                  error_body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(
                      "Gemini HTTP status:",
                      e.code
                  )

                  print(
                      "Gemini response:",
                      error_body
                  )

                  raise

              except (
                  KeyError,
                  IndexError,
                  TypeError
              ) as e:

                  last_error = e

                  if attempt < 3:
                      time.sleep(2)
                      continue

                  raise RuntimeError(
                      "Unexpected Gemini response."
                  ) from e

          if not isinstance(data, dict):
              raise RuntimeError(
                  "Gemini response is not a JSON object."
              )

          script = str(
              data.get("script", "")
          ).strip()

          title = str(
              data.get("title", "")
          ).strip()

          description = str(
              data.get("description", "")
          ).strip()

          query = str(
              data.get("query", "abstract")
          ).strip()

          voice = str(
              data.get(
                  "voice",
                  "en-US-AriaNeural"
              )
          ).strip()

          tags = data.get("tags", [])

          if not script:
              raise RuntimeError(
                  "Gemini response is missing script."
              )

          if not title:
              raise RuntimeError(
                  "Gemini response is missing title."
              )

          if not isinstance(tags, list):
              tags = []

          tags = [
              str(tag).lower().strip()
              for tag in tags
              if str(tag).strip()
          ]

          allowed_voices = {
              "en-US-AriaNeural",
              "en-US-GuyNeural",
              "en-GB-SoniaNeural"
          }

          if voice not in allowed_voices:
              voice = "en-US-AriaNeural"

          if not query:
              query = "abstract"

          job = {
              "script": script,
              "query": query,
              "voice": voice,
              "title": title,
              "description": description,
              "tags": tags
          }

          with open(
              "job.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  job,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Generated:",
              title
          )

          print(
              "Script words:",
              len(script.split())
          )
          PY

      - name: Verify generated job
        shell: bash
        run: |
          set -euo pipefail

          test -s job.json

          python3 - <<'PY'
          import json

          with open(
              "job.json",
              "r",
              encoding="utf-8"
          ) as file:
              job = json.load(file)

          required = [
              "script",
              "query",
              "voice",
              "title",
              "description",
              "tags"
          ]

          for key in required:
              if key not in job:
                  raise RuntimeError(
                      f"job.json missing: {key}"
                  )

          if not job["script"].strip():
              raise RuntimeError(
                  "Generated script is empty."
              )

          if not job["title"].strip():
              raise RuntimeError(
                  "Generated title is empty."
              )

          print("job.json verified successfully.")
          PY

      - name: Produce video
        shell: bash
        run: |
          set -euo pipefail

          RUN_DIR="$RUNNER_TEMP/short"

          mkdir -p "$RUN_DIR"

          cp job.json "$RUN_DIR/job.json"

          chmod +x scripts/produce.sh

          scripts/produce.sh "$RUN_DIR"

          test -s "$RUN_DIR/video.mp4"

          cp "$RUN_DIR/video.mp4" short.mp4

          echo "Video created successfully."

      - name: Upload Short to YouTube
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          credentials = Credentials(
              token=None,
              refresh_token=os.environ[
                  "YOUTUBE_REFRESH_TOKEN"
              ],
              token_uri=(
                  "https://oauth2.googleapis.com/token"
              ),
              client_id=os.environ[
                  "YOUTUBE_CLIENT_ID"
              ],
              client_secret=os.environ[
                  "YOUTUBE_CLIENT_SECRET"
              ],
              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ]
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          with open(
              "job.json",
              "r",
              encoding="utf-8"
          ) as file:
              job = json.load(file)

          body = {
              "snippet": {
                  "title": job["title"],
                  "description": job.get(
                      "description",
                      ""
                  ),
                  "tags": job.get(
                      "tags",
                      []
                  ),
                  "categoryId": "27"
              },
              "status": {
                  "privacyStatus": "public",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              "short.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )

          response = None

          while response is None:
              _, response = request.next_chunk()

          video_id = response["id"]

          print(
              "Uploaded:",
              f"https://www.youtube.com/watch?v={video_id}"
          )
          PY

      - name: Save generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-${{ github.run_id }}
          path: |
            short.mp4
            job.json
          if-no-files-found: ignore
          retention-days: 3
