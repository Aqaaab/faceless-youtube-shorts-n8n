name: YouTube Shorts Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: read

jobs:
  create-and-upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install required tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg jq python3-pip

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          for name in \
            GROQ_API_KEY \
            PEXELS_API_KEY \
            YOUTUBE_CLIENT_ID \
            YOUTUBE_CLIENT_SECRET \
            YOUTUBE_REFRESH_TOKEN
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing from GitHub Secrets."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "All required secrets are available."

      - name: Test Groq API
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          api_key = os.environ.get("GROQ_API_KEY", "").strip()

          if not api_key:
              raise RuntimeError("GROQ_API_KEY is empty")

          body = {
              "model": "openai/gpt-oss-120b",
              "messages": [
                  {
                      "role": "user",
                      "content": "Reply with exactly: GROQ_OK"
                  }
              ],
              "max_tokens": 20
          }

          request = urllib.request.Request(
              "https://api.groq.com/openai/v1/chat/completions",
              data=json.dumps(body).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + api_key,
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  result = json.load(response)

                  print("GROQ HTTP STATUS: 200")
                  print("GROQ SUCCESS")

                  content = (
                      result["choices"][0]
                      ["message"]["content"]
                  )

                  print("GROQ RESPONSE:", content)

                  if "GROQ_OK" not in content:
                      raise RuntimeError(
                          "Groq responded, but did not return GROQ_OK"
                      )

          except urllib.error.HTTPError as e:

              error_body = e.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print("GROQ HTTP STATUS:", e.code)
              print("GROQ RESPONSE:", error_body)

              raise

          except urllib.error.URLError as e:

              print("GROQ CONNECTION ERROR:", e)

              raise

      - name: Generate test job
        shell: bash
        run: |
          set -euo pipefail

          cat > job.json <<'JSON'
          {
            "script": "This is a Groq API connection test.",
            "query": "science",
            "voice": "en-US-AriaNeural",
            "title": "Groq API Test #Shorts",
            "description": "Testing the Groq connection from GitHub Actions.\n#Shorts #AI #Groq #YouTube #Automation",
            "tags": [
              "shorts",
              "ai",
              "groq",
              "youtube",
              "automation"
            ]
          }
          JSON

          echo "Test job created."

      - name: Stop after Groq test
        shell: bash
        run: |
          echo "===================================="
          echo "GROQ TEST COMPLETED"
          echo "===================================="
          echo "If you see GROQ SUCCESS above,"
          echo "the GitHub -> Groq connection works."
          echo "===================================="
