name: YouTube Shorts Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
    - cron: "0 21 * * *"

permissions:
  contents: write

concurrency:
  group: youtube-shorts-production
  cancel-in-progress: false

jobs:
  create-and-upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: openrouter/free
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_MODEL: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      CLOUDFLARE_VISION_MODEL: "@cf/meta/llama-4-scout-17b-16e-instruct"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_VISION_MODEL: "qwen/qwen3.6-27b"
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      TOGETHER_VISION_MODEL: "Qwen/Qwen3.5-9B"
      YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
      TREND_REGIONS: "US,GB,CA,AU"
      TREND_MAX_RESULTS: "25"
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      VOICE: af_bella
      SPEED: "0.90"
      KOKORO_LANG: en-us
      MUSIC_ENABLED: "true"
      MUSIC_VOLUME: "0.08"
      ANIMATION_ENABLED: "true"
      ADS_ENABLED: "false"
      YOUTUBE_PRIVACY_STATUS: public
      REQUIRE_VISION_QA: "true"
      ALLOW_DETERMINISTIC_FALLBACK: "true"
      VISION_MAX_REQUESTS_PER_RUN: "32"
      VISION_RETRY_MAX: "2"
      VISION_BACKOFF_BASE: "3"
      VISION_CIRCUIT_BREAKER_SECONDS: "600"
      VISION_MIN_SCORE: "0.88"
      VISION_MIN_SEMANTIC_SCORE: "0.85"
      VISION_CACHE_DIR: ${{ github.workspace }}/data/vision_cache
      RUN_DIR: ${{ github.workspace }}/data/run
      GROWTH_CONTEXT_FILE: ${{ github.workspace }}/learning/context.txt
      LEARNING_DIR: ${{ github.workspace }}/learning

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg jq curl wget espeak-ng libsndfile1 libportaudio2 portaudio19-dev fonts-dejavu-core fonts-noto-core fonts-noto-extra fonts-noto-cjk
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          jq --version

      - name: Install Python packages
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 soundfile sounddevice kokoro-tts json-repair

      - name: Check required secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          for name in PEXELS_API_KEY YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            if [[ -z "${!name:-}" ]]; then echo "::error::$name is missing from GitHub Secrets."; missing=1; fi
          done
          if [[ -z "${OPENROUTER_API_KEY:-}" && -z "${GEMINI_API_KEY:-}" && -z "${GROQ_API_KEY:-}" && -z "${TOGETHER_API_KEY:-}" && ( -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ) ]]; then
            echo "::error::At least one complete AI provider is required."; missing=1
          fi
          if [[ -z "${GROQ_API_KEY:-}" ]]; then echo "::warning::GROQ_API_KEY is not configured; provider 4 will be skipped."; fi
          if [[ -z "${TOGETHER_API_KEY:-}" ]]; then echo "::warning::TOGETHER_API_KEY is not configured; provider 5 will be skipped."; fi
          (( missing == 0 ))

      - name: Prepare Kokoro model
        shell: bash
        run: |
          set -Eeuo pipefail
          KOKORO_DIR="$GITHUB_WORKSPACE/kokoro-models"
          mkdir -p "$KOKORO_DIR"
          curl -fL --retry 5 --retry-delay 3 --connect-timeout 30 --max-time 900 -o "$KOKORO_DIR/kokoro-v1.0.onnx" "https://github.com/nazdridoy/kokoro-tts/releases/download/v1.0.0/kokoro-v1.0.onnx"
          curl -fL --retry 5 --retry-delay 3 --connect-timeout 30 --max-time 900 -o "$KOKORO_DIR/voices-v1.0.bin" "https://github.com/nazdridoy/kokoro-tts/releases/download/v1.0.0/voices-v1.0.bin"
          test -s "$KOKORO_DIR/kokoro-v1.0.onnx"; test -s "$KOKORO_DIR/voices-v1.0.bin"
          echo "KOKORO_PATH=$KOKORO_DIR" >> "$GITHUB_ENV"
          echo "KOKORO_MODEL=$KOKORO_DIR/kokoro-v1.0.onnx" >> "$GITHUB_ENV"
          echo "KOKORO_VOICES=$KOKORO_DIR/voices-v1.0.bin" >> "$GITHUB_ENV"

      - name: Check and test Kokoro
        shell: bash
        run: |
          set -Eeuo pipefail
          KOKORO_BIN="$(command -v kokoro-tts || true)"
          [[ -n "$KOKORO_BIN" && -x "$KOKORO_BIN" ]]
          echo "KOKORO_BIN=$KOKORO_BIN" >> "$GITHUB_ENV"
          python -c "import kokoro_tts,sounddevice,soundfile; from json_repair import repair_json; print('dependencies OK')"
          mkdir -p "$RUNNER_TEMP/kokoro-test"
          printf '%s\n' 'Kokoro production voice test.' > "$RUNNER_TEMP/kokoro-test/test.txt"
          "$KOKORO_BIN" "$RUNNER_TEMP/kokoro-test/test.txt" "$RUNNER_TEMP/kokoro-test/test.wav" --voice "$VOICE" --speed "$SPEED" --lang "$KOKORO_LANG" --model "$KOKORO_MODEL" --voices "$KOKORO_VOICES"
          test -s "$RUNNER_TEMP/kokoro-test/test.wav"

      - name: Validate repository scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/*.sh
          for f in scripts/*.sh; do bash -n "$f"; done
          python -m py_compile scripts/*.py
          python - <<'PY'
          from scripts import vision_agent
          assert vision_agent.CLOUDFLARE_VISION_MODEL == "@cf/meta/llama-4-scout-17b-16e-instruct"
          assert vision_agent.GROQ_VISION_MODEL == "qwen/qwen3.6-27b"
          assert vision_agent.TOGETHER_VISION_MODEL == "Qwen/Qwen3.5-9B"
          print("Vision Agent import PASS")
          print(vision_agent.stats())
          print("Vision fallback order: cloudflare -> gemini -> openrouter -> groq -> together")
          PY

      - name: Vision provider preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/vision_preflight.py

      - name: Test generator contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import importlib.util,re
          spec=importlib.util.spec_from_file_location('generate_job','scripts/generate_job.py'); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          job=m.fallback()
          assert len(job['scenes'])==5
          assert 75 <= m.word_count(job['script']) <= 95
          assert all(13 <= m.word_count(s['text_en']) <= 19 for s in job['scenes'])
          assert all(re.search(r'[\u0600-\u06ff]', s['text_ar']) for s in job['scenes'])
          assert all(not re.search(r'[\u0600-\u06ff]', s['text_en']) for s in job['scenes'])
          assert all(re.fullmatch(r'[a-z0-9_-]+', t) for t in job['tags'])
          print('Generator contract PASS')
          PY

      - name: Update learning state from previous uploads
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$LEARNING_DIR"
          python scripts/performance_learning.py --update --write-context

      - name: Discover YouTube trends
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/trend_discovery.py

      - name: Generate growth-optimized job.json
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUN_DIR"; mkdir -p "$RUN_DIR"
          python scripts/growth_generate.py
          test -s "$RUN_DIR/job.json"
          jq empty "$RUN_DIR/job.json"
          jq '{provider,title,topic,category,hook,scene_count:(.scenes|length),script_words:(.script|split(" ")|length),arabic_overlay:(.subtitle_ar != null)}' "$RUN_DIR/job.json"

      - name: Production content and Pexels preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/preflight_quality.py "$RUN_DIR"

      - name: Produce Short
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/produce.sh "$RUN_DIR"
          test -s "$RUN_DIR/video.mp4"
          test "$(jq -r '.english_spoken' "$RUN_DIR/render_contract.json")" = true
          test "$(jq -r '.english_overlay' "$RUN_DIR/render_contract.json")" = false
          test "$(jq -r '.arabic_overlay' "$RUN_DIR/render_contract.json")" = true

      - name: Visual and Arabic publication gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/visual_qa.py "$RUN_DIR"

      - name: Validate final video
        shell: bash
        run: |
          set -Eeuo pipefail
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$RUN_DIR/video.mp4")"
          width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$RUN_DIR/video.mp4")"
          height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$RUN_DIR/video.mp4")"
          fps="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$RUN_DIR/video.mp4")"
          audio="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$RUN_DIR/video.mp4")"
          awk -v d="$duration" 'BEGIN { exit !(d >= 28 && d <= 45) }'
          [[ "$width" == "1080" && "$height" == "1920" ]]
          [[ "$fps" == "30/1" || "$fps" == "30" ]]
          [[ "$audio" == "aac" ]]

      - name: Upload to YouTube
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/upload_youtube.py 2>&1 | tee "$RUN_DIR/upload.log"

      - name: Record new upload and refresh context
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/performance_learning.py --record-upload --write-context

      - name: Persist learning state safely
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A learning/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update Shorts performance and trend state [skip ci]"
          git fetch origin main --prune
          git rebase --autostash origin/main || exit 0
          if git status --porcelain | grep -q .; then exit 0; fi
          git push origin HEAD:main || true

      - name: Upload production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-${{ github.run_number }}
          path: data/run/**
          if-no-files-found: warn
          retention-days: 7
