name: YouTube Shorts Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
    - cron: "0 21 * * *"

permissions:
  contents: write

concurrency:
  group: youtube-shorts-production
  cancel-in-progress: false

jobs:
  create-and-upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: openrouter/free
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_MODEL: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      VOICE: af_bella
      SPEED: "1.0"
      KOKORO_LANG: en-us
      MUSIC_ENABLED: "true"
      MUSIC_VOLUME: "0.10"
      ANIMATION_ENABLED: "true"
      ADS_ENABLED: "false"
      YOUTUBE_PRIVACY_STATUS: public
      RUN_DIR: ${{ github.workspace }}/data/run
      GROWTH_CONTEXT_FILE: ${{ github.workspace }}/learning/context.txt
      LEARNING_DIR: ${{ github.workspace }}/learning

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg jq curl wget espeak-ng libsndfile1 libportaudio2 portaudio19-dev \
            fonts-dejavu-core fonts-noto-core fonts-noto-extra fonts-noto-cjk
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          jq --version

      - name: Install Python packages
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 \
            soundfile sounddevice kokoro-tts json-repair

      - name: Check required secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          for name in PEXELS_API_KEY YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is missing from GitHub Secrets."
              missing=1
            fi
          done
          if [[ -z "${OPENROUTER_API_KEY:-}" && -z "${GEMINI_API_KEY:-}" && ( -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ) ]]; then
            echo "::error::At least one complete AI provider must be configured: OpenRouter, Gemini, or Cloudflare Workers AI."
            missing=1
          fi
          if (( missing != 0 )); then exit 1; fi

      - name: Prepare Kokoro model
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          KOKORO_DIR="$GITHUB_WORKSPACE/kokoro-models"
          MODEL_FILE="$KOKORO_DIR/kokoro-v1.0.onnx"
          VOICES_FILE="$KOKORO_DIR/voices-v1.0.bin"
          mkdir -p "$KOKORO_DIR"
          curl -fL --retry 5 --retry-delay 3 --connect-timeout 30 --max-time 900 \
            -o "$MODEL_FILE" "https://github.com/nazdridoy/kokoro-tts/releases/download/v1.0.0/kokoro-v1.0.onnx"
          curl -fL --retry 5 --retry-delay 3 --connect-timeout 30 --max-time 900 \
            -o "$VOICES_FILE" "https://github.com/nazdridoy/kokoro-tts/releases/download/v1.0.0/voices-v1.0.bin"
          test -s "$MODEL_FILE"
          test -s "$VOICES_FILE"
          echo "KOKORO_PATH=$KOKORO_DIR" >> "$GITHUB_ENV"
          echo "KOKORO_MODEL=$MODEL_FILE" >> "$GITHUB_ENV"
          echo "KOKORO_VOICES=$VOICES_FILE" >> "$GITHUB_ENV"

      - name: Check Kokoro CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          KOKORO_BIN="$(command -v kokoro-tts || true)"
          [[ -n "$KOKORO_BIN" && -x "$KOKORO_BIN" ]] || { echo "::error::kokoro-tts not found"; exit 1; }
          echo "KOKORO_BIN=$KOKORO_BIN" >> "$GITHUB_ENV"
          python -c "import kokoro_tts; print('kokoro_tts import OK')"
          python -c "import sounddevice; print('sounddevice import OK')"
          python -c "import soundfile; print('soundfile import OK')"

      - name: Test Kokoro TTS
        shell: bash
        run: |
          set -Eeuo pipefail
          TEST_DIR="$RUNNER_TEMP/kokoro-test"
          mkdir -p "$TEST_DIR"
          printf '%s\n' 'This is a real Kokoro text to speech test running on GitHub Actions.' > "$TEST_DIR/test.txt"
          "$KOKORO_BIN" "$TEST_DIR/test.txt" "$TEST_DIR/test.wav" \
            --voice "$VOICE" --speed "$SPEED" --lang "$KOKORO_LANG" \
            --model "$KOKORO_MODEL" --voices "$KOKORO_VOICES"
          test -s "$TEST_DIR/test.wav"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$TEST_DIR/test.wav"

      - name: Validate repository scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/*.sh
          for file in scripts/*.sh; do bash -n "$file"; done
          python -m py_compile scripts/*.py
          node --check build_workflow.js
          node --check build_cleaning_workflow.js

      - name: Update learning state from previous uploads
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$LEARNING_DIR"
          python scripts/performance_learning.py --update --write-context

      - name: Generate growth-optimized job.json
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUN_DIR"
          mkdir -p "$RUN_DIR"
          python scripts/growth_generate.py
          test -s "$RUN_DIR/job.json"
          jq empty "$RUN_DIR/job.json"
          jq '{provider,title,topic,category,scene_count:(.scenes|length),script_words:(.script|split(" ")|length),voice}' "$RUN_DIR/job.json"

      - name: Produce Short
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/produce.sh "$RUN_DIR"
          test -s "$RUN_DIR/video.mp4"

      - name: Validate final video
        shell: bash
        run: |
          set -Eeuo pipefail
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$RUN_DIR/video.mp4")"
          width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$RUN_DIR/video.mp4")"
          height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$RUN_DIR/video.mp4")"
          fps="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$RUN_DIR/video.mp4")"
          audio="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$RUN_DIR/video.mp4")"
          awk -v d="$duration" 'BEGIN { exit !(d >= 30 && d <= 60) }'
          [[ "$width" == "1080" && "$height" == "1920" ]]
          [[ "$audio" == "aac" ]]
          [[ "$fps" == "30/1" || "$fps" == "30" ]]
          echo "Validated: ${duration}s ${width}x${height} fps=${fps} audio=${audio}"

      - name: Upload to YouTube
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/upload_youtube.py 2>&1 | tee "$RUN_DIR/upload.log"

      - name: Record new upload and refresh context
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/performance_learning.py --record-upload --write-context

      - name: Persist learning state
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learning/performance.json learning/context.txt
          if git diff --cached --quiet; then
            echo "No learning-state changes to commit."
            exit 0
          fi
          git commit -m "chore: update Shorts performance learning state [skip ci]"
          git push origin HEAD:main

      - name: Upload production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-${{ github.run_number }}
          path: data/run/**
          if-no-files-found: warn
          retention-days: 7
