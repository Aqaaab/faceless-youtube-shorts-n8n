name: YouTube Shorts Automation

on:
  workflow_dispatch:

  schedule:
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
    - cron: "0 21 * * *"

permissions:
  contents: read

jobs:
  create-and-upload-short:

    runs-on: ubuntu-latest

    timeout-minutes: 40

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

      GEMINI_MODEL: gemini-3.6-flash

      VOICE: af_bella
      SPEED: "1.0"
      KOKORO_LANG: en-us

      MUSIC_ENABLED: "true"
      MUSIC_VOLUME: "0.10"

      ANIMATION_ENABLED: "true"

      ADS_ENABLED: "false"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ============================================================
      # SYSTEM PACKAGES
      # ============================================================

      - name: Install system tools
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            jq \
            curl \
            wget \
            unzip \
            espeak-ng \
            libsndfile1 \
            libportaudio2 \
            portaudio19-dev \
            fonts-noto-core \
            fonts-noto-extra

          echo "======================================"
          echo "SYSTEM TOOLS"
          echo "======================================"

          python3 --version
          pip --version

          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

          jq --version
          curl --version | head -n 1
          espeak-ng --version


      # ============================================================
      # PYTHON PACKAGES
      # ============================================================

      - name: Install Python packages
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pip install \
            --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2 \
            soundfile \
            sounddevice \
            kokoro-tts

          echo "======================================"
          echo "PYTHON PACKAGES"
          echo "======================================"

          python -m pip show kokoro-tts || true
          python -m pip show sounddevice || true
          python -m pip show soundfile || true


      # ============================================================
      # KOKORO MODEL
      # ============================================================

      - name: Prepare Kokoro model
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/.local/bin:$PATH"

          KOKORO_DIR="$GITHUB_WORKSPACE/kokoro-models"

          VOICES_FILE="$KOKORO_DIR/voices-v1.0.bin"
          MODEL_FILE="$KOKORO_DIR/kokoro-v1.0.onnx"

          mkdir -p "$KOKORO_DIR"

          echo "======================================"
          echo "KOKORO MODEL"
          echo "======================================"

          echo "Directory:"
          echo "$KOKORO_DIR"

          # --------------------------------------------------------
          # VOICES
          # --------------------------------------------------------

          if [[ ! -s "$VOICES_FILE" ]]; then

            echo "Downloading Kokoro voices..."

            curl \
              -fL \
              --retry 5 \
              --retry-delay 3 \
              --connect-timeout 20 \
              --max-time 300 \
              -o "$VOICES_FILE" \
              "https://github.com/nazdridoy/kokoro-tts/releases/download/v1.0.0/voices-v1.0.bin"

          else

            echo "Kokoro voices already exist."

          fi

          # --------------------------------------------------------
          # MODEL
          # --------------------------------------------------------

          if [[ ! -s "$MODEL_FILE" ]]; then

            echo "Downloading Kokoro ONNX model..."

            curl \
              -fL \
              --retry 5 \
              --retry-delay 3 \
              --connect-timeout 20 \
              --max-time 300 \
              -o "$MODEL_FILE" \
              "https://github.com/nazdridoy/kokoro-tts/releases/download/v1.0.0/kokoro-v1.0.onnx"

          else

            echo "Kokoro ONNX model already exists."

          fi

          # --------------------------------------------------------
          # VALIDATION
          # --------------------------------------------------------

          if [[ ! -s "$VOICES_FILE" ]]; then

            echo "::error::Missing Kokoro voices file."

            exit 1

          fi

          if [[ ! -s "$MODEL_FILE" ]]; then

            echo "::error::Missing Kokoro ONNX model."

            exit 1

          fi

          echo "KOKORO_PATH=$KOKORO_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "KOKORO MODEL READY"
          echo "======================================"

          ls -lh "$VOICES_FILE"
          ls -lh "$MODEL_FILE"


      # ============================================================
      # KOKORO CLI
      #
      # IMPORTANT:
      # Do NOT call:
      #   kokoro-tts --help
      #   kokoro-tts --help-voices
      #
      # Some versions of kokoro-tts import sounddevice during CLI
      # startup and may return a non-zero code on GitHub runners.
      #
      # We test the actual TTS engine in the next step instead.
      # ============================================================

      - name: Check Kokoro CLI
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/.local/bin:$PATH"
          export KOKORO_PATH="$GITHUB_WORKSPACE/kokoro-models"

          KOKORO_BIN="$(command -v kokoro-tts || true)"

          if [[ -z "$KOKORO_BIN" ]]; then

            echo "::error::kokoro-tts was not found."

            python -m pip show kokoro-tts || true

            exit 1

          fi

          if [[ ! -x "$KOKORO_BIN" ]]; then

            echo "::error::kokoro-tts is not executable."

            exit 1

          fi

          echo "KOKORO_BIN=$KOKORO_BIN" >> "$GITHUB_ENV"

          echo "======================================"
          echo "KOKORO CLI FOUND"
          echo "======================================"

          echo "$KOKORO_BIN"

          python -c "import kokoro_tts; print('kokoro_tts import OK')"

          python -c "import sounddevice; print('sounddevice import OK')"

          python -c "import soundfile; print('soundfile import OK')"

          echo "Kokoro CLI installation check passed."


      # ============================================================
      # REAL KOKORO TTS TEST
      # ============================================================

      - name: Test Kokoro TTS
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/.local/bin:$PATH"
          export KOKORO_PATH="$GITHUB_WORKSPACE/kokoro-models"

          TEST_DIR="$RUNNER_TEMP/kokoro-test"

          mkdir -p "$TEST_DIR"

          TEST_TEXT="$TEST_DIR/test.txt"
          TEST_WAV="$TEST_DIR/test.wav"

          printf '%s\n' \
            "This is a real Kokoro text to speech test running on GitHub Actions." \
            > "$TEST_TEXT"

          echo "======================================"
          echo "KOKORO REAL TTS TEST"
          echo "======================================"

          echo "KOKORO_PATH:"
          echo "$KOKORO_PATH"

          echo "VOICE:"
          echo "$VOICE"

          echo "SPEED:"
          echo "$SPEED"

          echo "LANG:"
          echo "$KOKORO_LANG"

          echo "Generating audio..."

          "$KOKORO_BIN" \
            "$TEST_TEXT" \
            "$TEST_WAV" \
            --voice "$VOICE" \
            --speed "$SPEED" \
            --lang "$KOKORO_LANG"

          if [[ ! -s "$TEST_WAV" ]]; then

            echo "::error::Kokoro did not create the test WAV file."

            exit 1

          fi

          TEST_DURATION="$(
            ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$TEST_WAV"
          )"

          echo "Kokoro test WAV:"
          ls -lh "$TEST_WAV"

          echo "Kokoro test duration:"
          echo "${TEST_DURATION}s"

          echo "Kokoro real TTS test passed."


      # ============================================================
      # CHECK PRODUCTION FILE
      # ============================================================

      - name: Check production file
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f "scripts/produce.sh" ]]; then

            echo "::error::scripts/produce.sh was not found."

            exit 1

          fi

          chmod +x scripts/produce.sh

          echo "======================================"
          echo "PRODUCTION ENGINE"
          echo "======================================"

          echo "Checking Bash syntax..."

          bash -n scripts/produce.sh

          echo "produce.sh syntax OK."


      # ============================================================
      # CHECK MUSIC
      # ============================================================

      - name: Check music directory
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -d "music" ]]; then

            echo "Music directory exists."

            find music \
              -maxdepth 1 \
              -type f \
              \( \
                -iname "*.mp3" \
                -o -iname "*.wav" \
                -o -iname "*.m4a" \
                -o -iname "*.aac" \
              \) \
              -print || true

          else

            echo "Music directory does not exist."

            echo "The production engine will continue without music."

          fi


      # ============================================================
      # CHECK SECRETS
      # ============================================================

      - name: Check required secrets
        shell: bash
        run: |
          set -Eeuo pipefail

          missing=0

          for name in \
            GEMINI_API_KEY \
            PEXELS_API_KEY \
            YOUTUBE_CLIENT_ID \
            YOUTUBE_CLIENT_SECRET \
            YOUTUBE_REFRESH_TOKEN
          do

            if [[ -z "${!name:-}" ]]; then

              echo "::error::$name is missing from GitHub Secrets."

              missing=1

            fi

          done

          if (( missing != 0 )); then

            exit 1

          fi

          echo "All required secrets are available."


      # ============================================================
      # GENERATE JOB.JSON
      # ============================================================

      - name: Generate job.json
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'

          import json
          import os
          import random
          import re
          import time
          import urllib.error
          import urllib.request


          # ========================================================
          # CONFIG
          # ========================================================

          api_key = os.environ["GEMINI_API_KEY"].strip()

          model = os.environ.get(
              "GEMINI_MODEL",
              "gemini-3.6-flash"
          ).strip()

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/"
              + model
              + ":generateContent"
          )


          # ========================================================
          # PROMPT
          # ========================================================

          prompt = """
          Create ONE accurate and surprising YouTube Shorts
          "Did You Know?" story.

          Return JSON only.

          Requirements:

          - English script: 85 to 90 words.
          - One main fact only.
          - Strong curiosity hook in the first sentence.
          - Natural conversational English.
          - Short sentences.
          - End with a short question or follow-for-more line.
          - subtitle_ar: complete and accurate Modern Standard Arabic
            translation of the entire English script.
          - title: English only, maximum 90 characters,
            ending with #Shorts.
          - description: 2 or 3 English sentences,
            followed by exactly 5 hashtags.
          - tags: 8 to 12 lowercase English keywords.
          - query: one or two simple English words for Pexels.
          - topic: short English description.
          - category: choose one of:
            science
            space
            animals
            human body
            psychology
            history
            technology
            nature
            geography
            inventions
            ocean
            weather
            transportation
            everyday objects
            mysteries
            unusual facts

          Rules:

          1. The fact must be verifiable.
          2. Do not invent statistics.
          3. Do not invent dates.
          4. Do not invent historical claims.
          5. Do not invent scientific claims.
          6. Avoid uncertain facts.
          7. No emojis.
          8. No Arabic text in title.
          9. No Arabic text in description.
          10. No Arabic text in tags.
          11. No Arabic text in query.
          12. No Arabic text in topic.
          13. No Arabic text in category.
          14. Return JSON only.
          """


          # ========================================================
          # SCHEMA
          # ========================================================

          schema = {

              "type": "object",

              "properties": {

                  "hook": {
                      "type": "string"
                  },

                  "script": {
                      "type": "string"
                  },

                  "subtitle_ar": {
                      "type": "string"
                  },

                  "title": {
                      "type": "string"
                  },

                  "description": {
                      "type": "string"
                  },

                  "tags": {
                      "type": "array",
                      "items": {
                          "type": "string"
                      }
                  },

                  "query": {
                      "type": "string"
                  },

                  "topic": {
                      "type": "string"
                  },

                  "category": {
                      "type": "string"
                  }

              },

              "required": [
                  "hook",
                  "script",
                  "subtitle_ar",
                  "title",
                  "description",
                  "tags",
                  "query",
                  "topic",
                  "category"
              ]

          }


          # ========================================================
          # REQUEST BODY
          # ========================================================

          body = {

              "contents": [
                  {
                      "role": "user",
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],

              "generationConfig": {

                  "temperature": 0.65,

                  "maxOutputTokens": 2500,

                  "responseMimeType": "application/json",

                  "responseSchema": schema

              }

          }


          # ========================================================
          # REQUEST
          # ========================================================

          def make_request():

              return urllib.request.Request(

                  url,

                  data=json.dumps(
                      body,
                      ensure_ascii=False
                  ).encode("utf-8"),

                  headers={
                      "x-goog-api-key": api_key,
                      "Content-Type": "application/json"
                  },

                  method="POST"

              )


          data = None


          # ========================================================
          # RETRIES
          # ========================================================

          for attempt in range(1, 7):

              print(
                  f"Gemini attempt {attempt}/6"
              )

              try:

                  with urllib.request.urlopen(
                      make_request(),
                      timeout=120
                  ) as response:

                      result = json.load(response)


                  content = (
                      result["candidates"][0]
                      ["content"]["parts"][0]["text"]
                  )


                  data = json.loads(content)

                  print(
                      "Gemini generation succeeded."
                  )

                  break


              except urllib.error.HTTPError as exc:

                  detail = exc.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(
                      f"Gemini HTTP error: {exc.code}"
                  )

                  print(
                      detail[:3000]
                  )


                  if (
                      exc.code not in (
                          429,
                          500,
                          502,
                          503,
                          504
                      )
                      or attempt == 6
                  ):

                      raise


                  delay = min(
                      15 * (2 ** (attempt - 1)),
                      120
                  )

                  delay += random.uniform(
                      1,
                      3
                  )

                  print(
                      f"Retrying in {delay:.1f} seconds..."
                  )

                  time.sleep(delay)


              except (
                  json.JSONDecodeError,
                  KeyError,
                  IndexError,
                  TypeError
              ) as exc:

                  print(
                      "Invalid Gemini response:",
                      repr(exc)
                  )

                  if attempt == 6:

                      raise

                  time.sleep(
                      min(
                          5 * attempt,
                          30
                      )
                  )


          # ========================================================
          # VALIDATE RESPONSE
          # =====================
