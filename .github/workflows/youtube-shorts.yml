name: YouTube Shorts Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
    - cron: "0 21 * * *"

permissions:
  contents: read

jobs:
  create-and-upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

      GEMINI_MODEL: gemini-3.6-flash

      VOICE: af_bella
      SPEED: "1.0"
      LANG: en-us

      MUSIC_ENABLED: "true"
      MUSIC_VOLUME: "0.10"

      ANIMATION_ENABLED: "true"
      ADS_ENABLED: "false"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system tools
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            jq \
            curl \
            unzip \
            python3 \
            python3-pip \
            python3-venv

          echo "System tools installed."

      - name: Install Python packages
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2 \
            kokoro-tts \
            soundfile \
            kokoro-onnx

          echo "Python packages installed."

      - name: Check Kokoro
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/.local/bin:$PATH"

          KOKORO_BIN=""

          if command -v kokoro-tts >/dev/null 2>&1; then
            KOKORO_BIN="$(command -v kokoro-tts)"
          elif command -v kokoro_tts >/dev/null 2>&1; then
            KOKORO_BIN="$(command -v kokoro_tts)"
          fi

          if [[ -z "$KOKORO_BIN" ]]; then
            echo "::error::Kokoro TTS CLI was not found."
            exit 1
          fi

          echo "KOKORO_BIN=$KOKORO_BIN" >> "$GITHUB_ENV"

          echo "Kokoro:"
          echo "$KOKORO_BIN"

      - name: Check production files
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f "scripts/produce.sh" ]]; then
            echo "::error::scripts/produce.sh was not found."
            exit 1
          fi

          chmod +x scripts/produce.sh

          echo "produce.sh found."

          if [[ -d "music" ]]; then
            echo "Music directory found."

            find music -maxdepth 1 -type f \
              \( -iname "*.mp3" \
              -o -iname "*.wav" \
              -o -iname "*.m4a" \
              -o -iname "*.aac" \) \
              -print || true
          else
            echo "Music directory not found."
            echo "Production will continue without music."
          fi

      - name: Check required secrets
        shell: bash
        run: |
          set -Eeuo pipefail

          missing=0

          for name in \
            GEMINI_API_KEY \
            PEXELS_API_KEY \
            YOUTUBE_CLIENT_ID \
            YOUTUBE_CLIENT_SECRET \
            YOUTUBE_REFRESH_TOKEN
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is missing from GitHub Secrets."
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          echo "All required secrets are available."

      - name: Generate Short job.json
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          import json
          import os
          import random
          import time
          import urllib.error
          import urllib.request

          api_key = os.environ["GEMINI_API_KEY"].strip()
          model = os.environ.get(
              "GEMINI_MODEL",
              "gemini-3.6-flash"
          ).strip()

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/"
              + model +
              ":generateContent"
          )

          prompt = """
          You are an expert YouTube Shorts writer.

          Create ONE surprising, accurate and verifiable
          "Did You Know?" YouTube Short.

          The narration must be natural conversational English.

          The Arabic subtitle must be a complete and accurate
          Modern Standard Arabic translation of the narration.

          SCRIPT:
          70 to 90 English words.

          Start immediately with a strong curiosity hook.

          Use short conversational sentences.

          ONE main fact only.

          No emojis.

          No hashtags inside narration.

          End with a short question or follow-for-more line.

          TITLE:
          Maximum 90 characters.
          Must end with #Shorts

          DESCRIPTION:
          2 or 3 natural English sentences.
          Then a new line with exactly 5 relevant hashtags.

          TAGS:
          8 to 12 lowercase English keywords.

          QUERY:
          One or two English words only.
          It must describe the visual subject for Pexels.

          TOPIC:
          Short description of the main fact.

          CATEGORY:
          Choose one:
          science
          space
          animals
          human body
          psychology
          history
          technology
          nature
          geography
          inventions
          ocean
          weather
          transportation
          everyday objects
          mysteries
          unusual facts

          RULES:
          1. The fact must be verifiable.
          2. Do not invent statistics.
          3. Do not invent historical claims.
          4. Do not use fake scientific claims.
          5. Avoid uncertain facts.
          6. Make the hook immediately interesting.
          7. Keep the narration suitable for YouTube Shorts.
          8. Arabic subtitle must preserve the same meaning.
          9. Do not put Arabic text in title, description, tags or query.
          10. Return JSON only.
          """

          schema = {
              "type": "object",
              "properties": {
                  "hook": {"type": "string"},
                  "script": {"type": "string"},
                  "subtitle_ar": {"type": "string"},
                  "title": {"type": "string"},
                  "description": {"type": "string"},
                  "tags": {
                      "type": "array",
                      "items": {"type": "string"}
                  },
                  "query": {"type": "string"},
                  "topic": {"type": "string"},
                  "category": {"type": "string"}
              },
              "required": [
                  "hook",
                  "script",
                  "subtitle_ar",
                  "title",
                  "description",
                  "tags",
                  "query",
                  "topic",
                  "category"
              ]
          }

          body = {
              "contents": [
                  {
                      "role": "user",
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.75,
                  "maxOutputTokens": 4000,
                  "responseMimeType": "application/json",
                  "responseSchema": schema
              }
          }

          def make_request():
              return urllib.request.Request(
                  url,
                  data=json.dumps(
                      body,
                      ensure_ascii=False
                  ).encode("utf-8"),
                  headers={
                      "x-goog-api-key": api_key,
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

          data = None
          max_attempts = 6

          for attempt in range(1, max_attempts + 1):

              print(
                  f"Gemini attempt "
                  f"{attempt}/{max_attempts}"
              )

              try:

                  with urllib.request.urlopen(
                      make_request(),
                      timeout=120
                  ) as response:

                      result = json.load(response)

                  content = (
                      result["candidates"][0]
                      ["content"]["parts"][0]["text"]
                  )

                  data = json.loads(content)

                  print("Gemini generation succeeded.")
                  break

              except urllib.error.HTTPError as error:

                  error_body = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(
                      "Gemini HTTP error:",
                      error.code
                  )

                  print(error_body[:3000])

                  if error.code in (
                      429,
                      500,
                      502,
                      503,
                      504
                  ):

                      if attempt >= max_attempts:
                          raise

                      delay = min(
                          15 * (2 ** (attempt - 1)),
                          120
                      )

                      delay += random.uniform(1, 3)

                      print(
                          f"Retrying in "
                          f"{delay:.1f} seconds..."
                      )

                      time.sleep(delay)
                      continue

                  raise

              except (
                  json.JSONDecodeError,
                  KeyError,
                  IndexError,
                  TypeError
              ) as error:

                  print(
                      "Invalid Gemini response:",
                      repr(error)
                  )

                  if attempt >= max_attempts:
                      raise

                  time.sleep(
                      min(5 * attempt, 30)
                  )

          if not isinstance(data, dict):
              raise RuntimeError(
                  "Gemini did not return a JSON object."
              )

          hook = str(data.get("hook", "")).strip()
          script = str(data.get("script", "")).strip()
          subtitle_ar = str(
              data.get("subtitle_ar", "")
          ).strip()
          title = str(data.get("title", "")).strip()
          description = str(
              data.get("description", "")
          ).strip()
          query = str(data.get("query", "")).strip()
          topic = str(data.get("topic", "")).strip()
          category = str(
              data.get("category", "")
          ).strip()

          tags = data.get("tags", [])

          if not isinstance(tags, list):
              tags = []

          tags = [
              str(x).strip().lower()
              for x in tags
              if str(x).strip()
          ]

          if not hook:
              raise RuntimeError("Missing hook.")

          if not script:
              raise RuntimeError("Missing script.")

          if not subtitle_ar:
              raise RuntimeError(
                  "Missing Arabic subtitle."
              )

          if not title:
              raise RuntimeError("Missing title.")

          if not description:
              raise RuntimeError(
                  "Missing description."
              )

          if not query:
              raise RuntimeError(
                  "Missing Pexels query."
              )

          if not topic:
              raise RuntimeError(
                  "Missing topic."
              )

          word_count = len(script.split())

          if word_count < 70 or word_count > 90:
              raise RuntimeError(
                  f"Script must contain "
                  f"70-90 words. Got {word_count}."
              )

          if not title.lower().endswith("#shorts"):
              title = title.rstrip() + " #Shorts"

          base = title[:-6].rstrip()
          title = base[:82].rstrip() + " #Shorts"

          job = {
              "hook": hook,
              "script": script,
              "subtitle_ar": subtitle_ar,
              "title": title,
              "description": description,
              "tags": tags,
              "topic": topic,
              "category": category,

              "voice": os.environ.get(
                  "VOICE",
                  "af_bella"
              ),

              "speed": float(
                  os.environ.get(
                      "SPEED",
                      "1.0"
                  )
              ),

              "lang": os.environ.get(
                  "LANG",
                  "en-us"
              ),

              "music": (
                  os.environ.get(
                      "MUSIC_ENABLED",
                      "true"
                  ).lower() == "true"
              ),

              "music_volume": float(
                  os.environ.get(
                      "MUSIC_VOLUME",
                      "0.10"
                  )
              ),

              "animation": (
                  os.environ.get(
                      "ANIMATION_ENABLED",
                      "true"
                  ).lower() == "true"
              ),

              "ads": False,

              "query": query,

              "scenes": [
                  {
                      "text_en": script,
                      "text_ar": subtitle_ar,
                      "pexels_query": query
                  }
              ]
          }

          with open(
              "job.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  job,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("======================================")
          print("JOB GENERATED")
          print("======================================")
          print("Title:", title)
          print("Category:", category)
          print("Query:", query)
          print("Words:", word_count)
          print("Voice:", job["voice"])
          print("Music:", job["music"])
          print("Animation:", job["animation"])
          print("Ads:", job["ads"])
          print("======================================")
          PY

      - name: Verify job.json
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s job.json

          python3 - <<'PY'
          import json

          with open(
              "job.json",
              "r",
              encoding="utf-8"
          ) as f:
              job = json.load(f)

          required = [
              "script",
              "subtitle_ar",
              "title",
              "description",
              "tags",
              "voice",
              "query",
              "scenes"
          ]

          for key in required:
              if key not in job:
                  raise RuntimeError(
                      f"job.json missing: {key}"
                  )

          if job.get("ads") is True:
              raise RuntimeError(
                  "Ads must remain disabled."
              )

          if not isinstance(
              job["scenes"],
              list
          ):
              raise RuntimeError(
                  "scenes must be an array."
              )

          if len(job["scenes"]) < 1:
              raise RuntimeError(
                  "At least one scene is required."
              )

          scene = job["scenes"][0]

          for key in (
              "text_en",
              "text_ar",
              "pexels_query"
          ):
              if not str(
                  scene.get(key, "")
              ).strip():
                  raise RuntimeError(
                      f"Scene missing {key}"
                  )

          print("job.json validation passed.")
          PY

      - name: Prepare production directory
        shell: bash
        run: |
          set -Eeuo pipefail

          RUN_ID="short_$(date -u +%Y%m%d_%H%M%S)_${GITHUB_RUN_ID}"

          echo "RUN_DIR=$RUN_ID" >> "$GITHUB_ENV"

          mkdir -p \
            "$RUN_ID/scenes" \
            "$RUN_ID/audio" \
            "$RUN_ID/video" \
            "$RUN_ID/subtitles" \
            "$RUN_ID/downloads" \
            "$RUN_ID/music"

          cp job.json "$RUN_ID/job.json"

          echo "Production directory:"
          echo "$RUN_ID"

      - name: Prepare background music
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${MUSIC_ENABLED}" != "true" ]]; then
            echo "Music disabled."
            exit 0
          fi

          if [[ ! -d "music" ]]; then
            echo "No music directory."
            exit 0
          fi

          found=0

          while IFS= read -r -d '' file; do
            cp "$file" "$RUN_DIR/music/"
            echo "Copied music: $file"
            found=1
            break
          done < <(
            find music -maxdepth 1 -type f \
              \( -iname "*.mp3" \
              -o -iname "*.wav" \
              -o -iname "*.m4a" \
              -o -iname "*.aac" \) \
              -print0
          )

          if [[ "$found" -eq 0 ]]; then
            echo "No compatible music file found."
          fi

      - name: Run produce.sh
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x scripts/produce.sh

          export KOKORO_BIN="${KOKORO_BIN}"
          export MUSIC_DIR="$GITHUB_WORKSPACE/$RUN_DIR/music"

          echo "Starting production..."
          echo "RUN_DIR=$RUN_DIR"
          echo "KOKORO_BIN=$KOKORO_BIN"
          echo "MUSIC_DIR=$MUSIC_DIR"

          scripts/produce.sh "$RUN_DIR"

      - name: Verify final video
        shell: bash
        run: |
          set -Eeuo pipefail

          VIDEO="$RUN_DIR/video.mp4"

          if [[ ! -s "$VIDEO" ]]; then
            echo "::error::Final video was not created."
            exit 1
          fi

          SIZE="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width,height \
              -of csv=p=0:s=x \
              "$VIDEO"
          )"

          DURATION="$(
            ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$VIDEO"
          )"

          VIDEO_CODEC="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              "$VIDEO"
          )"

          AUDIO_CODEC="$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              "$VIDEO"
          )"

          echo "Resolution: $SIZE"
          echo "Duration: ${DURATION}s"
          echo "Video codec: $VIDEO_CODEC"
          echo "Audio codec: $AUDIO_CODEC"

          [[ "$SIZE" == "1080x1920" ]] || {
            echo "::error::Video must be 1080x1920."
            exit 1
          }

          [[ "$VIDEO_CODEC" == "h264" ]] || {
            echo "::error::Video must use H.264."
            exit 1
          }

          [[ "$AUDIO_CODEC" == "aac" ]] || {
            echo "::error::Audio must use AAC."
            
