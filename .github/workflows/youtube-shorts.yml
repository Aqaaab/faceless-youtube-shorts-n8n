name: YouTube Shorts Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
    - cron: "0 21 * * *"

permissions:
  contents: write

concurrency:
  group: youtube-shorts-production
  cancel-in-progress: false

jobs:
  create-and-upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: openrouter/free
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash
      GEMINI_IMAGE_API_KEY: ${{ secrets.GEMINI_IMAGE_API_KEY }}
      GEMINI_IMAGE_MODEL: gemini-3.1-flash-image
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_MODEL: eleven_v3
      ELEVENLABS_VOICE_ID: JBFqnCBsd6RMkjVDRZzb
      ELEVENLABS_STABILITY: "0.30"
      ELEVENLABS_SIMILARITY: "0.75"
      ELEVENLABS_STYLE: "0.65"
      ELEVENLABS_SPEED: "1.0"
      CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
      CARTESIA_MODEL: sonic-3.5
      CARTESIA_VOICE_ID: f786b574-daa5-4673-aa0c-cbe3e8534c02
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_MODEL: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      CLOUDFLARE_VISION_MODEL: "@cf/meta/llama-4-scout-17b-16e-instruct"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_TEXT_MODEL: "qwen/qwen3.6-27b"
      GROQ_VISION_MODEL: "qwen/qwen3.6-27b"
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      TOGETHER_TEXT_MODEL: "Qwen/Qwen3.5-9B"
      TOGETHER_VISION_MODEL: "Qwen/Qwen3.5-9B"
      QWENCLOUD_API_KEY: ${{ secrets.QWENCLOUD_API_KEY }}
      QWENCLOUD_MODEL: qwen3.6-flash
      QWENCLOUD_FREE_ONLY: "true"
      QWENCLOUD_MAX_CALLS_PER_RUN: "3"
      YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
      TREND_REGIONS: "US,GB,CA,AU"
      TREND_MAX_RESULTS: "25"
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      VOICE: af_bella
      SPEED: "0.90"
      KOKORO_LANG: en-us
      MUSIC_ENABLED: "true"
      MUSIC_VOLUME: "0.08"
      ANIMATION_ENABLED: "true"
      ADS_ENABLED: "false"
      YOUTUBE_PRIVACY_STATUS: public
      REQUIRE_VISION_QA: "true"
      ALLOW_DETERMINISTIC_FALLBACK: "false"
      MIN_SCENES: "5"
      MAX_SCENES: "5"
      VISION_MAX_REQUESTS_PER_RUN: "32"
      VISION_RETRY_MAX: "2"
      VISION_BACKOFF_BASE: "3"
      VISION_CIRCUIT_BREAKER_SECONDS: "600"
      VISION_MIN_SCORE: "0.88"
      VISION_MIN_SEMANTIC_SCORE: "0.85"
      VISION_MIN_DIVERSITY: "0.18"
      VISION_CACHE_DIR: ${{ github.workspace }}/data/vision_cache
      RUN_DIR: ${{ github.workspace }}/data/run
      GROWTH_CONTEXT_FILE: ${{ github.workspace }}/learning/context.txt
      LEARNING_DIR: ${{ github.workspace }}/learning

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg jq curl wget espeak-ng libsndfile1 libportaudio2 portaudio19-dev fonts-dejavu-core fonts-noto-core fonts-noto-extra fonts-noto-cjk
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          jq --version

      - name: Install Python packages
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 soundfile sounddevice kokoro-tts json-repair

      - name: Check required secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          for name in PEXELS_API_KEY YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            if [[ -z "${!name:-}" ]]; then echo "::error::$name is missing from GitHub Secrets."; missing=1; fi
          done
          if [[ -z "${OPENROUTER_API_KEY:-}" && -z "${GEMINI_API_KEY:-}" && -z "GROQ_API_KEY:-}" && -z "${TOGETHER_API_KEY:-}" && ( -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ) && -z "${QWENCLOUD_API_KEY:-}" ]]; then
            echo "::error::At least one complete AI text provider is required."; missing=1
          fi
          (( missing == 0 ))

      - name: Prepare Kokoro model
        shell: bash
        run: |
          set -Eeuo pipefail
          KOKORO_DIR="$GITHUB_WORKSPACE/kokoro-models"
          mkdir -p "$KOKORO_DIR"
          curl -fL --retry 5 --retry-delay 3 --connect-timeout 30 --max-time 900 -o "$KOKORO_DIR/kokoro-v1.0.onnx" "https://github.com/nazdridoy/kokoro-tts/releases/download/v1.0.0/kokoro-v1.0.onnx"
          curl -fL --retry 5 --retry-delay 3 --connect-timeout 30 --max-time 900 -o "$KOKORO_DIR/voices-v1.0.bin" "https://github.com/nazdridoy/kokoro-tts/releases/download/v1.0.0/voices-v1.0.bin"
          test -s "$KOKORO_DIR/kokoro-v1.0.onnx"
          test -s "$KOKORO_DIR/voices-v1.0.bin"
          echo "KOKORO_PATH=$KOKORO_DIR" >> "$GITHUB_ENV"
          echo "KOKORO_MODEL=$KOKORO_DIR/kokoro-v1.0.onnx" >> "$GITHUB_ENV"
          echo "KOKORO_VOICES=$KOKORO_DIR/voices-v1.0.bin" >> "$GITHUB_ENV"

      - name: Check and test Kokoro
        shell: bash
        run: |
          set -Eeuo pipefail
          KOKORO_BIN_REAL="$(command -v kokoro-tts || true)"
          [[ -n "$KOKORO_BIN_REAL" && -x "$KOKORO_BIN_REAL" ]]
          echo "KOKORO_REAL_BIN=$KOKORO_BIN_REAL" >> "$GITHUB_ENV"
          python -c "import kokoro_tts,sounddevice,soundfile; from json_repair import repair_json; print('dependencies OK')"
          mkdir -p "$RUNNER_TEMP/kokoro-test"
          printf '%s\n' 'Kokoro production voice test.' > "$RUNNER_TEMP/kokoro-test/test.txt"
          "$KOKORO_BIN_REAL" "$RUNNER_TEMP/kokoro-test/test.txt" "$RUNNER_TEMP/kokoro-test/test.wav" --voice "$VOICE" --speed "$SPEED" --lang "$KOKORO_LANG" --model "$KOKORO_MODEL" --voices "$KOKORO_VOICES"
          test -s "$RUNNER_TEMP/kokoro-test/test.wav"

      - name: Validate repository scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/*.sh
          for f in scripts/*.sh; do bash -n "$f"; done
          python -m py_compile scripts/*.py
          python - <<'PY'
          from scripts import vision_agent
          assert vision_agent.CLOUDFLARE_VISION_MODEL == "@cf/meta/llama-4-scout-17b-16e-instruct"
          assert vision_agent.GROQ_VISION_MODEL == "qwen/qwen3.6-27b"
          assert vision_agent.TOGETHER_VISION_MODEL == "Qwen/Qwen3.5-9B"
          print("Vision provider import/route contract PASS")
          print(vision_agent.stats())
          PY

      - name: Vision provider preflight
        shell: bash
        run: python scripts/vision_preflight.py

      - name: Generator fallback unit contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import importlib.util,re
          spec=importlib.util.spec_from_file_location('generate_job','scripts/generate_job.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          job=m.fallback()
          assert len(job['scenes'])==5
          assert 80 <= m.word_count(job['script']) <= 110
          assert all(8 <= m.word_count(s['text_en']) <= 18 for s in job['scenes'])
          assert all(re.search(r'[\u0600-\u06ff]', s['text_ar']) for s in job['scenes'])
          assert all(not re.search(r'[\u0600-\u06ff]', s['text_en']) for s in job['scenes'])
          assert len(re.findall(r'#[A-Za-z0-9]+', job['description'])) == 5
          assert len(job['title']) <= 85 and job['title'].endswith('#Shorts')
          print('Generator fallback schema + publication metadata PASS')
          PY

      - name: Update learning state from previous uploads
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$LEARNING_DIR"
          python scripts/performance_learning.py --update --write-context

      - name: Discover YouTube trends
        shell: bash
        run: python scripts/trend_discovery.py

      - name: Generate AI job
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUN_DIR"
          mkdir -p "$RUN_DIR"
          python scripts/growth_generate.py
          test -s "$RUN_DIR/job.json"
          jq empty "$RUN_DIR/job.json"
          provider="$(jq -r '.provider' "$RUN_DIR/job.json")"
          [[ -n "$provider" && "$provider" != "null" && "$provider" != "deterministic-fallback" && "$provider" != "baseline-fallback" ]]
          scene_count="$(jq -r '.scenes|length' "$RUN_DIR/job.json")"
          [[ "$scene_count" -eq 5 ]]
          title="$(jq -r '.title' "$RUN_DIR/job.json")"
          description="$(jq -r '.description' "$RUN_DIR/job.json")"
          [[ "${#title}" -le 85 && "$title" == *"#Shorts"* ]]
          [[ "$(grep -oE '#[A-Za-z0-9]+' <<< "$description" | wc -l | tr -d ' ')" == "5" ]]
          echo "AI_PROVIDER=$provider"
          jq '{provider,title,topic,category,scene_count:(.scenes|length),script_words:(.script|split(" ")|length)}' "$RUN_DIR/job.json"

      - name: Conversational Voice Director
        shell: bash
        run: |
          set -Eeuo pipefail
          AI_ROUTER_ONLY=true python scripts/voice_director.py
          jq '{provider,voice_style,scene_count:(.scenes|length),script_words:(.script|split(" ")|length)}' "$RUN_DIR/job.json"

      - name: Production content and Pexels preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/preflight_quality.py "$RUN_DIR"

      - name: Produce Short
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/produce.sh "$RUN_DIR"
          test -s "$RUN_DIR/video.mp4"
          test "$(jq -r '.english_spoken' "$RUN_DIR/render_contract.json")" = true
          test "$(jq -r '.english_overlay' "$RUN_DIR/render_contract.json")" = false
          test "$(jq -r '.arabic_overlay' "$RUN_DIR/render_contract.json")" = true

      - name: Visual and Arabic publication gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/visual_qa.py "$RUN_DIR"

      - name: Validate final video
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/final_validate.py "$RUN_DIR"

      - name: Upload to YouTube
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/upload_youtube.py "$RUN_DIR"

      - name: Record new upload and refresh context
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/performance_learning.py --record-upload "$RUN_DIR" --write-context

      - name: Persist learning state safely
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A learning/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update Shorts performance and trend state [skip ci]"
          git fetch origin main --prune
          git rebase --autostash origin/main || exit 0
          if git status --porcelain | grep -q .; then exit 0; fi
          git push origin HEAD:main || true

      - name: Upload production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-${{ github.run_number }}
          path: data/run/**
          if-no-files-found: warn
          retention-days: 7
