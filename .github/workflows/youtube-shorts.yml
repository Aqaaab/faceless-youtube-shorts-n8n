name: YouTube Shorts Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
    - cron: "0 21 * * *"

permissions:
  contents: read

jobs:
  create-and-upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install required tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg jq python3-pip curl unzip

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          for name in \
            GEMINI_API_KEY \
            PEXELS_API_KEY \
            YOUTUBE_CLIENT_ID \
            YOUTUBE_CLIENT_SECRET \
            YOUTUBE_REFRESH_TOKEN
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing from GitHub Secrets."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "All required secrets are available."

      - name: Generate Arabic Short with Gemini
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()

          if not api_key:
              raise RuntimeError("GEMINI_API_KEY is empty")

          model = "gemini-3.6-flash"

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/"
              + model +
              ":generateContent"
          )

          schema = {
              "type": "object",
              "properties": {
                  "hook": {
                      "type": "string"
                  },
                  "script": {
                      "type": "string"
                  },
                  "title": {
                      "type": "string"
                  },
                  "description": {
                      "type": "string"
                  },
                  "tags": {
                      "type": "array",
                      "items": {
                          "type": "string"
                      }
                  },
                  "query": {
                      "type": "string"
                  },
                  "voice": {
                      "type": "string"
                  }
              },
              "required": [
                  "hook",
                  "script",
                  "title",
                  "description",
                  "tags",
                  "query",
                  "voice"
              ]
          }

          prompt = """
          أنت كاتب محترف لفيديوهات YouTube Shorts باللغة العربية.

          أنشئ فيديو Shorts واحدًا فقط عن حقيقة مدهشة وموثوقة.

          اللغة:
          استخدم العربية فقط في hook وscript وtitle وdescription.
          لا تستخدم الإنجليزية إلا عند الضرورة لاسم علم أو مصطلح علمي.

          hook:
          جملة افتتاحية قصيرة جدًا ومثيرة للفضول.
          يجب أن تشد المشاهد من أول ثانية.

          script:
          نص التعليق الصوتي كاملًا.
          بين 90 و130 كلمة.
          ابدأ بالـhook نفسه.
          أسلوب عربي طبيعي وسهل للتعليق الصوتي.
          جمل قصيرة وواضحة.
          حقيقة واحدة مدهشة ودقيقة.
          لا تكرر أي جملة.
          لا تستخدم رموزًا تعبيرية.
          لا تستخدم هاشتاغات.
          لا تكتب تعليمات للمونتاج.
          اختم بسؤال قصير أو عبارة تشجع على المتابعة.

          title:
          عنوان عربي جذاب.
          أقل من 90 حرفًا.
          يجب أن ينتهي بـ #Shorts

          description:
          وصف عربي من جملتين أو ثلاث.
          ثم سطر جديد يحتوي على 5 هاشتاغات مناسبة.

          tags:
          من 8 إلى 12 كلمة مفتاحية.

          query:
          كلمة أو كلمتان فقط للبحث عن فيديوهات Pexels.
          يجب أن تكون مرتبطة بصريًا بموضوع الفيديو.
          استخدم كلمات إنجليزية بسيطة لأن البحث في Pexels أفضل بها.

          voice:
          اكتب دائمًا:
          ar_JO-kareem-medium

          المواضيع:
          العلوم، الفضاء، التاريخ، الأحياء، الحيوانات،
          الطبيعة، التكنولوجيا، جسم الإنسان، النفس البشرية،
          المحيطات، الأرض والكون.

          لا تعيد نفس الموضوع بشكل واضح.
          اختر حقائق صحيحة وليست خرافات أو معلومات مضللة.

          أعد JSON فقط بدون Markdown وبدون ```.
          """

          body = {
              "contents": [
                  {
                      "role": "user",
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.8,
                  "maxOutputTokens": 3000,
                  "responseMimeType": "application/json",
                  "responseSchema": schema
              }
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(
                  body,
                  ensure_ascii=False
              ).encode("utf-8"),
              headers={
                  "x-goog-api-key": api_key,
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          data = None

          for attempt in range(1, 4):

              try:
                  print(
                      "Gemini request attempt:",
                      attempt
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=90
                  ) as response:
                      result = json.load(response)

                  content = (
                      result["candidates"][0]
                      ["content"]["parts"][0]["text"]
                  )

                  data = json.loads(content)
                  break

              except json.JSONDecodeError as e:

                  print(
                      "Gemini returned invalid JSON."
                  )

                  if attempt < 3:
                      time.sleep(2)
                      continue

                  raise RuntimeError(
                      "Gemini returned invalid JSON after 3 attempts."
                  ) from e

              except urllib.error.HTTPError as e:

                  error_body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(
                      "Gemini HTTP status:",
                      e.code
                  )

                  print(
                      "Gemini response:",
                      error_body
                  )

                  raise

              except (
                  KeyError,
                  IndexError,
                  TypeError
              ) as e:

                  if attempt < 3:
                      time.sleep(2)
                      continue

                  raise RuntimeError(
                      "Unexpected Gemini response."
                  ) from e

          if not isinstance(data, dict):
              raise RuntimeError(
                  "Gemini response is not a JSON object."
              )

          hook = str(
              data.get("hook", "")
          ).strip()

          script = str(
              data.get("script", "")
          ).strip()

          title = str(
              data.get("title", "")
          ).strip()

          description = str(
              data.get("description", "")
          ).strip()

          query = str(
              data.get("query", "")
          ).strip()

          tags = data.get("tags", [])

          if not hook:
              raise RuntimeError(
                  "Gemini response is missing hook."
              )

          if not script:
              raise RuntimeError(
                  "Gemini response is missing script."
              )

          if not title:
              raise RuntimeError(
                  "Gemini response is missing title."
              )

          if not query:
              query = "nature"

          if not isinstance(tags, list):
              tags = []

          tags = [
              str(tag).strip().lower()
              for tag in tags
              if str(tag).strip()
          ]

          job = {
              "hook": hook,
              "script": script,
              "query": query,
              "queries": [
                  query
              ],
              "per": 5,
              "voice": "ar_JO-kareem-medium",
              "title": title,
              "description": description,
              "tags": tags
          }

          with open(
              "job.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  job,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Generated Arabic Short:"
          )

          print(
              "Title:",
              title
          )

          print(
              "Query:",
              query
          )

          print(
              "Voice:",
              "ar_JO-kareem-medium"
          )

          print(
              "Script words:",
              len(script.split())
          )
          PY

      - name: Verify generated job
        shell: bash
        run: |
          set -euo pipefail

          test -s job.json

          python3 - <<'PY'
          import json

          with open(
              "job.json",
              "r",
              encoding="utf-8"
          ) as file:
              job = json.load(file)

          required = [
              "hook",
              "script",
              "query",
              "queries",
              "voice",
              "title",
              "description",
              "tags"
          ]

          for key in required:
              if key not in job:
                  raise RuntimeError(
                      f"job.json missing: {key}"
                  )

          if not job["script"].strip():
              raise RuntimeError(
                  "Generated script is empty."
              )

          if not job["title"].strip():
              raise RuntimeError(
                  "Generated title is empty."
              )

          if job["voice"] != "ar_JO-kareem-medium":
              raise RuntimeError(
                  "Unexpected voice configuration."
              )

          if not isinstance(
              job["queries"],
              list
          ):
              raise RuntimeError(
                  "queries must be a list."
              )

          if not job["queries"]:
              raise RuntimeError(
                  "No Pexels queries generated."
              )

          print(
              "Arabic job.json verified successfully."
          )
          PY

      - name: Produce video
        shell: bash
        run: |
          set -euo pipefail

          RUN_DIR="$RUNNER_TEMP/short"

          mkdir -p "$RUN_DIR"

          cp job.json "$RUN_DIR/job.json"

          chmod +x scripts/produce.sh

          scripts/produce.sh "$RUN_DIR"

          test -s "$RUN_DIR/video.mp4"

          cp "$RUN_DIR/video.mp4" short.mp4

          echo "Video created successfully."

      - name: Upload Short to YouTube
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          credentials = Credentials(
              token=None,
              refresh_token=os.environ[
                  "YOUTUBE_REFRESH_TOKEN"
              ],
              token_uri=(
                  "https://oauth2.googleapis.com/token"
              ),
              client_id=os.environ[
                  "YOUTUBE_CLIENT_ID"
              ],
              client_secret=os.environ[
                  "YOUTUBE_CLIENT_SECRET"
              ],
              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ]
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          with open(
              "job.json",
              "r",
              encoding="utf-8"
          ) as file:
              job = json.load(file)

          body = {
              "snippet": {
                  "title": job["title"],
                  "description": job.get(
                      "description",
                      ""
                  ),
                  "tags": job.get(
                      "tags",
                      []
                  ),
                  "categoryId": "27"
              },
              "status": {
                  "privacyStatus": "public",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              "short.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )

          response = None

          while response is None:
              _, response = request.next_chunk()

          video_id = response["id"]

          print(
              "Uploaded:",
              f"https://www.youtube.com/watch?v={video_id}"
          )
          PY

      - name: Save generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-${{ github.run_id }}
          path: |
            short.mp4
            job.json
          if-no-files-found: ignore
          retention-days: 3
