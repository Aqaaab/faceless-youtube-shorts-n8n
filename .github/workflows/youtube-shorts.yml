name: YouTube Shorts Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
    - cron: "0 21 * * *"

permissions:
  contents: read

jobs:
  create-and-upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install required tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            jq \
            python3-pip \
            curl \
            unzip

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

          echo "Required tools installed."

      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          for name in \
            GEMINI_API_KEY \
            PEXELS_API_KEY \
            YOUTUBE_CLIENT_ID \
            YOUTUBE_CLIENT_SECRET \
            YOUTUBE_REFRESH_TOKEN
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing from GitHub Secrets."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "All required secrets are available."

      # ================================================================
      # GEMINI
      # ================================================================

      - name: Generate Arabic Short with Gemini
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import random
          import time
          import urllib.error
          import urllib.request

          api_key = os.environ.get(
              "GEMINI_API_KEY",
              ""
          ).strip()

          if not api_key:
              raise RuntimeError(
                  "GEMINI_API_KEY is empty"
              )

          model = "gemini-3.6-flash"

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/"
              + model +
              ":generateContent"
          )

          scene_schema = {
              "type": "object",
              "properties": {
                  "text": {
                      "type": "string"
                  },
                  "pexels_query": {
                      "type": "string"
                  }
              },
              "required": [
                  "text",
                  "pexels_query"
              ]
          }

          schema = {
              "type": "object",
              "properties": {
                  "hook": {
                      "type": "string"
                  },
                  "script": {
                      "type": "string"
                  },
                  "title": {
                      "type": "string"
                  },
                  "description": {
                      "type": "string"
                  },
                  "tags": {
                      "type": "array",
                      "items": {
                          "type": "string"
                      }
                  },
                  "scenes": {
                      "type": "array",
                      "items": scene_schema
                  },
                  "voice": {
                      "type": "string"
                  }
              },
              "required": [
                  "hook",
                  "script",
                  "title",
                  "description",
                  "tags",
                  "scenes",
                  "voice"
              ]
          }

          prompt = """
          أنت كاتب محترف لفيديوهات YouTube Shorts العربية.

          أنشئ فيديو واحدًا فقط عن حقيقة مدهشة وصحيحة وقابلة للتحقق.

          الهدف:
          فيديو سريع وممتع يجعل المشاهد يريد إكماله حتى النهاية.

          اللغة:
          عربية طبيعية جدًا.
          لا تكتب بأسلوب مقال أو كتاب.
          استخدم جمل قصيرة تناسب التعليق الصوتي.
          لا تستخدم رموزًا تعبيرية.
          لا تستخدم هاشتاغات داخل السكربت.

          HOOK:
          جملة واحدة فقط.
          قوية ومثيرة للفضول.
          لا تبدأ بـ:
          "هل تعلم أن..."
          "في هذا الفيديو..."
          "اليوم سوف نتحدث..."
          "هل تعلم؟"

          SCRIPT:
          بين 45 و70 كلمة فقط.
          ابدأ بالـhook.
          قدم حقيقة واحدة مدهشة.
          اجعل كل جملة تضيف معلومة جديدة.
          لا تكرر الفكرة نفسها.
          لا تستخدم مقدمة طويلة.
          لا تستخدم حشوًا.
          النهاية تكون سؤالًا قصيرًا أو جملة تشجع على المتابعة.

          SCENES:
          قسّم الفيديو إلى 4 إلى 6 مشاهد.
          كل مشهد يحتوي على جملة أو جملتين من السكربت.
          لكل مشهد أعطِ كلمة أو كلمتين بالإنجليزية فقط للبحث في Pexels.
          يجب أن يكون البحث مرتبطًا بما يظهر في المشهد فعلًا.

          أمثلة:
          space
          astronaut
          deep ocean
          human brain
          volcano
          wild animal
          ancient egypt
          robot technology

          لا تستخدم كلمات عامة مثل:
          abstract
          background
          nature
          random

          TITLE:
          عنوان عربي قصير ومثير للفضول.
          أقل من 90 حرفًا.
          يجب أن ينتهي بـ #Shorts

          DESCRIPTION:
          جملتان عربيتان قصيرتان.
          ثم سطر جديد يحتوي على 5 هاشتاغات عربية أو إنجليزية مناسبة.

          TAGS:
          8 إلى 12 كلمة مفتاحية.
          اجعلها lowercase.

          VOICE:
          يجب أن يكون:
          ar_JO-kareem-medium

          المواضيع:
          العلوم
          الفضاء
          التاريخ
          الحيوانات
          جسم الإنسان
          النفس البشرية
          التكنولوجيا
          الطبيعة
          المحيطات
          الأرض
          الكون

          اختر موضوعًا مختلفًا عن الفيديوهات السابقة قدر الإمكان.

          مهم جدًا:
          لا تختر خرافة.
          لا تختر معلومة غير مؤكدة.
          لا تختر أرقامًا مثيرة للشك.
          إذا كانت المعلومة قابلة للالتباس، اختر حقيقة أخرى.

          أعد JSON فقط.
          """

          body = {
              "contents": [
                  {
                      "role": "user",
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.75,
                  "maxOutputTokens": 4000,
                  "responseMimeType": "application/json",
                  "responseSchema": schema
              }
          }

          def create_request():
              return urllib.request.Request(
                  url,
                  data=json.dumps(
                      body,
                      ensure_ascii=False
                  ).encode("utf-8"),
                  headers={
                      "x-goog-api-key": api_key,
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

          def get_retry_delay(
              error_body,
              attempt
          ):
              delay = None

              try:
                  error_json = json.loads(
                      error_body
                  )

                  details = (
                      error_json
                      .get("error", {})
                      .get("details", [])
                  )

                  for detail in details:

                      if detail.get("@type") == (
                          "type.googleapis.com/"
                          "google.rpc.RetryInfo"
                      ):

                          retry_delay = str(
                              detail.get(
                                  "retryDelay",
                                  ""
                              )
                          ).strip()

                          if retry_delay.endswith(
                              "ms"
                          ):

                              delay = (
                                  float(
                                      retry_delay[:-2]
                                  ) / 1000.0
                              )

                          elif retry_delay.endswith(
                              "s"
                          ):

                              delay = float(
                                  retry_delay[:-1]
                              )

                          break

              except Exception:
                  delay = None

              if delay is None or delay <= 0:

                  delay = min(
                      30 * (2 ** (attempt - 1)),
                      300
                  )

              delay += random.uniform(
                  1.0,
                  3.0
              )

              return delay

          MAX_ATTEMPTS = 6

          data = None

          for attempt in range(
              1,
              MAX_ATTEMPTS + 1
          ):

              print(
                  f"Gemini request attempt: "
                  f"{attempt}/{MAX_ATTEMPTS}"
              )

              try:

                  request = create_request()

                  with urllib.request.urlopen(
                      request,
                      timeout=90
                  ) as response:

                      result = json.load(
                          response
                      )

                  content = (
                      result["candidates"][0]
                      ["content"]["parts"][0]["text"]
                  )

                  data = json.loads(
                      content
                  )

                  print(
                      "Gemini request succeeded."
                  )

                  break

              except urllib.error.HTTPError as error:

                  error_body = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(
                      "Gemini HTTP status:",
                      error.code
                  )

                  print(
                      "Gemini response:",
                      error_body
                  )

                  # ------------------------------------------------
                  # HTTP 429
                  # ------------------------------------------------

                  if error.code == 429:

                      if attempt >= MAX_ATTEMPTS:

                          raise RuntimeError(
                              "Gemini HTTP 429 persisted "
                              f"after {MAX_ATTEMPTS} attempts."
                          ) from error

                      delay = get_retry_delay(
                          error_body,
                          attempt
                      )

                      print(
                          "Gemini 429 detected."
                      )

                      print(
                          f"Waiting {delay:.2f} seconds "
                          "before retry..."
                      )

                      time.sleep(
                          delay
                      )

                      continue

                  # ------------------------------------------------
                  # Temporary server errors
                  # ------------------------------------------------

                  if error.code in (
                      500,
                      502,
                      503,
                      504
                  ):

                      if attempt >= MAX_ATTEMPTS:

                          raise RuntimeError(
                              f"Gemini server error "
                              f"{error.code} persisted."
                          ) from error

                      delay = min(
                          10 * (
                              2 ** (
                                  attempt - 1
                              )
                          ),
                          120
                      )

                      delay += random.uniform(
                          1.0,
                          3.0
                      )

                      print(
                          f"Temporary Gemini error "
                          f"{error.code}."
                      )

                      print(
                          f"Retrying in "
                          f"{delay:.2f} seconds..."
                      )

                      time.sleep(
                          delay
                      )

                      continue

                  raise

              except json.JSONDecodeError as error:

                  print(
                      "Gemini returned invalid JSON."
                  )

                  if attempt >= MAX_ATTEMPTS:

                      raise RuntimeError(
                          "Gemini returned invalid JSON "
                          f"after {MAX_ATTEMPTS} attempts."
                      ) from error

                  delay = min(
                      5 * attempt,
                      30
                  )

                  print(
                      f"Retrying in {delay} seconds..."
                  )

                  time.sleep(
                      delay
                  )

              except (
                  KeyError,
                  IndexError,
                  TypeError
              ) as error:

                  print(
                      "Unexpected Gemini response."
                  )

                  if attempt >= MAX_ATTEMPTS:

                      raise RuntimeError(
                          "Unexpected Gemini response "
                          f"after {MAX_ATTEMPTS} attempts."
                      ) from error

                  delay = min(
                      5 * attempt,
                      30
                  )

                  print(
                      f"Retrying in {delay} seconds..."
                  )

                  time.sleep(
                      delay
                  )

          if not isinstance(
              data,
              dict
          ):

              raise RuntimeError(
                  "Gemini response is not a JSON object."
              )

          hook = str(
              data.get(
                  "hook",
                  ""
              )
          ).strip()

          script = str(
              data.get(
                  "script",
                  ""
              )).strip()

          title = str(
              data.get(
                  "title",
                  ""
              )
          ).strip()

          description = str(
              data.get(
                  "description",
                  ""
              )
          ).strip()

          tags = data.get(
              "tags",
              []
          )

          scenes = data.get(
              "scenes",
              []
          )

          if not hook:
              raise RuntimeError(
                  "Missing hook."
              )

          if not script:
              raise RuntimeError(
                  "Missing script."
              )

          if not title:
              raise RuntimeError(
                  "Missing title."
              )

          if not isinstance(
              scenes,
              list
          ):

              raise RuntimeError(
                  "Scenes must be a list."
              )

          if len(scenes) < 4:

              raise RuntimeError(
                  "Gemini generated fewer than 4 scenes."
              )

          words = len(
              script.split()
          )

          if words < 45 or words > 70:

              raise RuntimeError(
                  f"Script must contain "
                  f"45-70 words, got {words}."
              )

          clean_scenes = []

          for scene in scenes:

              if not isinstance(
                  scene,
                  dict
              ):
                  continue

              text = str(
                  scene.get(
                      "text",
                      ""
                  )
              ).strip()

              pexels_query = str(
                  scene.get(
                      "pexels_query",
                      ""
                  )
              ).strip()

              if text and pexels_query:

                  clean_scenes.append(
                      {
                          "text": text,
                          "pexels_query": pexels_query
                      }
                  )

          if len(clean_scenes) < 4:

              raise RuntimeError(
                  "Not enough valid scenes."
              )

          if not isinstance(
              tags,
              list
          ):

              tags = []

          tags = [
              str(tag).strip().lower()
              for tag in tags
              if str(tag).strip()
          ]

          job = {
              "hook": hook,
              "script": script,
              "title": title,
              "description": description,
              "tags": tags,
              "voice": "ar_JO-kareem-medium",
              "scenes": clean_scenes,
              "queries": [
                  scene["pexels_query"]
                  for scene in clean_scenes
              ],
              "query": clean_scenes[0][
                  "pexels_query"
              ],
              "per": 5
          }

          with open(
              "job.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  job,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Arabic Short generated successfully."
          )

          print(
              "Title:",
              title
          )

          print(
              "Script words:",
              words
          )

          print(
              "Scenes:",
              len(clean_scenes)
          )

          for index, scene in enumerate(
              clean_scenes,
              1
          ):

              print(
                  f"Scene {index}: "
                  f"{scene['pexels_query']}"
              )

          PY

      # ================================================================
      # VERIFY JOB
      # ================================================================

      - name: Verify generated job
        shell: bash
        run: |
          set -euo pipefail

          test -s job.json

          python3 - <<'PY'
          import json

          with open(
              "job.json",
              "r",
              encoding="utf-8"
          ) as file:

              job = json.load(file)

          required = [
              "hook",
              "script",
              "title",
              "description",
              "tags",
              "voice",
              "scenes",
              "queries"
          ]

          for key in required:

              if key not in job:

                  raise RuntimeError(
                      f"job.json missing: {key}"
                  )

          words = len(
              job["script"].split()
          )

     
