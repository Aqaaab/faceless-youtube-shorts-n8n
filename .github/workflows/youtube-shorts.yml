name: YouTube Shorts Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
    - cron: "0 21 * * *"

permissions:
  contents: read

jobs:
  create-and-upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

      GEMINI_MODEL: gemini-3.6-flash
      VOICE: af_bella
      SPEED: "1.0"
      KOKORO_LANG: en-us
      MUSIC_ENABLED: "true"
      MUSIC_VOLUME: "0.10"
      ANIMATION_ENABLED: "true"
      ADS_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system tools
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            jq \
            curl \
            wget \
            unzip \
            espeak-ng \
            libsndfile1 \
            libportaudio2 \
            portaudio19-dev \
            fonts-noto-core \
            fonts-noto-extra

          python3 --version
          pip --version
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          jq --version
          espeak-ng --version

      - name: Install Python packages
        shell: bash
        run: |
          set -Eeuo pipefail

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2 \
            soundfile \
            sounddevice \
            kokoro-tts

          python -m pip show kokoro-tts
          python -m pip show sounddevice

      - name: Prepare Kokoro model
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/.local/bin:$PATH"

          KOKORO_DIR="$GITHUB_WORKSPACE/kokoro-models"
          VOICES_FILE="$KOKORO_DIR/voices-v1.0.bin"
          MODEL_FILE="$KOKORO_DIR/kokoro-v1.0.onnx"

          mkdir -p "$KOKORO_DIR"

          if [[ ! -s "$VOICES_FILE" ]]; then
            curl -fL --retry 5 --retry-delay 3 \
              --connect-timeout 20 --max-time 300 \
              -o "$VOICES_FILE" \
              "https://github.com/nazdridoy/kokoro-tts/releases/download/v1.0.0/voices-v1.0.bin"
          fi

          if [[ ! -s "$MODEL_FILE" ]]; then
            curl -fL --retry 5 --retry-delay 3 \
              --connect-timeout 20 --max-time 300 \
              -o "$MODEL_FILE" \
              "https://github.com/nazdridoy/kokoro-tts/releases/download/v1.0.0/kokoro-v1.0.onnx"
          fi

          [[ -s "$VOICES_FILE" ]] || {
            echo "::error::Missing voices-v1.0.bin"
            exit 1
          }

          [[ -s "$MODEL_FILE" ]] || {
            echo "::error::Missing kokoro-v1.0.onnx"
            exit 1
          }

          echo "KOKORO_PATH=$KOKORO_DIR" >> "$GITHUB_ENV"

          ls -lh "$VOICES_FILE" "$MODEL_FILE"

      - name: Check Kokoro
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/.local/bin:$PATH"
          export KOKORO_PATH="$GITHUB_WORKSPACE/kokoro-models"

          KOKORO_BIN="$(command -v kokoro-tts || true)"

          [[ -n "$KOKORO_BIN" ]] || {
            echo "::error::kokoro-tts not found"
            exit 1
          }

          echo "KOKORO_BIN=$KOKORO_BIN" >> "$GITHUB_ENV"

          "$KOKORO_BIN" --help >/dev/null
          "$KOKORO_BIN" --help-voices >/dev/null

          echo "Kokoro CLI OK: $KOKORO_BIN"

      - name: Test Kokoro TTS
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/.local/bin:$PATH"
          export KOKORO_PATH="$GITHUB_WORKSPACE/kokoro-models"

          TEST_DIR="$RUNNER_TEMP/kokoro-test"

          mkdir -p "$TEST_DIR"

          printf '%s\n' \
            "This is a Kokoro text to speech system test." \
            > "$TEST_DIR/test.txt"

          (
            cd "$KOKORO_PATH"

            "$KOKORO_BIN" \
              "$TEST_DIR/test.txt" \
              "$TEST_DIR/test.wav" \
              --voice "$VOICE" \
              --speed "$SPEED" \
              --lang "$KOKORO_LANG"
          )

          [[ -s "$TEST_DIR/test.wav" ]] || {
            echo "::error::Kokoro test failed"
            exit 1
          }

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$TEST_DIR/test.wav"

      - name: Check production file
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ -f scripts/produce.sh ]] || {
            echo "::error::scripts/produce.sh not found"
            exit 1
          }

          chmod +x scripts/produce.sh

          bash -n scripts/produce.sh

          echo "produce.sh syntax OK"

      - name: Check required secrets
        shell: bash
        run: |
          set -Eeuo pipefail

          missing=0

          for name in \
            GEMINI_API_KEY \
            PEXELS_API_KEY \
            YOUTUBE_CLIENT_ID \
            YOUTUBE_CLIENT_SECRET \
            YOUTUBE_REFRESH_TOKEN
          do

            if [[ -z "${!name:-}" ]]; then

              echo "::error::$name is missing from GitHub Secrets"

              missing=1

            fi

          done

          (( missing == 0 )) || exit 1

      - name: Generate job.json
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'

          import json
          import os
          import random
          import re
          import time
          import urllib.error
          import urllib.request


          api_key = os.environ["GEMINI_API_KEY"].strip()

          model = os.environ.get(
              "GEMINI_MODEL",
              "gemini-3.6-flash"
          ).strip()


          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/"
              + model
              + ":generateContent"
          )


          prompt = """
          Create ONE accurate and surprising YouTube Shorts
          'Did You Know?' story.

          Return JSON only.

          Requirements:

          - English script: 85 to 90 words.
          - One main fact only.
          - Strong curiosity hook in the first sentence.
          - Natural conversational English.
          - Short sentences.
          - End with a short question or follow-for-more line.
          - subtitle_ar: complete, accurate Modern Standard Arabic translation of the script.
          - title: English only, maximum 90 characters, ending with #Shorts.
          - description: 2 or 3 English sentences, then exactly 5 hashtags.
          - tags: 8 to 12 lowercase English keywords.
          - query: one or two simple English words for a Pexels visual search.
          - topic: short English description.
          - category: one of science, space, animals, human body, psychology, history,
            technology, nature, geography, inventions, ocean, weather, transportation,
            everyday objects, mysteries, unusual facts.
          - The fact must be verifiable.
          - Do not invent statistics, dates, historical claims, or scientific claims.
          - No emojis.
          - No Arabic in title, description, tags, query, topic, or category.
          """


          schema = {

              "type": "object",

              "properties": {

                  "hook": {
                      "type": "string"
                  },

                  "script": {
                      "type": "string"
                  },

                  "subtitle_ar": {
                      "type": "string"
                  },

                  "title": {
                      "type": "string"
                  },

                  "description": {
                      "type": "string"
                  },

                  "tags": {
                      "type": "array",
                      "items": {
                          "type": "string"
                      }
                  },

                  "query": {
                      "type": "string"
                  },

                  "topic": {
                      "type": "string"
                  },

                  "category": {
                      "type": "string"
                  }

              },

              "required": [
                  "hook",
                  "script",
                  "subtitle_ar",
                  "title",
                  "description",
                  "tags",
                  "query",
                  "topic",
                  "category"
              ]

          }


          body = {

              "contents": [
                  {
                      "role": "user",
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],

              "generationConfig": {

                  "temperature": 0.65,

                  "maxOutputTokens": 2500,

                  "responseMimeType": "application/json",

                  "responseSchema": schema

              }

          }


          def make_request():

              return urllib.request.Request(

                  url,

                  data=json.dumps(
                      body,
                      ensure_ascii=False
                  ).encode("utf-8"),

                  headers={
                      "x-goog-api-key": api_key,
                      "Content-Type": "application/json"
                  },

                  method="POST"

              )


          data = None


          for attempt in range(1, 7):

              try:

                  print(
                      f"Gemini attempt {attempt}/6"
                  )

                  with urllib.request.urlopen(
                      make_request(),
                      timeout=120
                  ) as response:

                      result = json.load(response)


                  content = (
                      result["candidates"][0]
                      ["content"]["parts"][0]["text"]
                  )


                  data = json.loads(content)

                  break


              except urllib.error.HTTPError as exc:

                  detail = exc.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(
                      f"Gemini HTTP {exc.code}"
                  )

                  print(
                      detail[:3000]
                  )


                  if (
                      exc.code
                      not in (
                          429,
                          500,
                          502,
                          503,
                          504
                      )
                      or attempt == 6
                  ):

                      raise


                  time.sleep(
                      min(
                          15 * (2 ** (attempt - 1)),
                          120
                      )
                      + random.uniform(1, 3)
                  )


              except (
                  json.JSONDecodeError,
                  KeyError,
                  IndexError,
                  TypeError
              ):

                  if attempt == 6:

                      raise

                  time.sleep(
                      min(
                          5 * attempt,
                          30
                      )
                  )


          if not isinstance(
              data,
              dict
          ):

              raise RuntimeError(
                  "Gemini did not return an object"
              )


          def s(key):

              value = data.get(
                  key,
                  ""
              )

              return str(value).strip()


          hook = s("hook")
          script = s("script")
          subtitle_ar = s("subtitle_ar")
          title = s("title")
          description = s("description")
          query = s("query")
          topic = s("topic")
          category = s("category")


          tags = data.get(
              "tags",
              []
          )


          if not isinstance(
              tags,
              list
          ):

              tags = []


          tags = [

              str(x).strip().lower()

              for x in tags

              if str(x).strip()

          ]


          if not all([
              hook,
              script,
              subtitle_ar,
              title,
              description,
              query,
              topic,
              category
          ]):

              raise RuntimeError(
                  "Gemini returned incomplete content"
              )


          words = len(
              script.split()
          )


          if not 85 <= words <= 90:

              raise RuntimeError(
                  f"Script must be 85-90 words; got {words}"
              )


          if not title.lower().endswith(
              "#shorts"
          ):

              title = (
                  title.rstrip()
                  + " #Shorts"
              )


          title = title[:90]


          if not 8 <= len(tags) <= 12:

              raise RuntimeError(
                  f"Expected 8-12 tags; got {len(tags)}"
              )


          if len(
              re.findall(
                  r"#[A-Za-z0-9_]+",
                  description
              )
          ) != 5:

              raise RuntimeError(
                  "Description must contain exactly 5 hashtags"
              )


          if len(
              query.split()
          ) not in (1, 2):

              raise RuntimeError(
                  "Pexels query must be 1-2 words"
              )


          job = {

              "voice": os.environ.get(
                  "VOICE",
                  "af_bella"
              ),

              "speed": float(
                  os.environ.get(
                      "SPEED",
                      "1.0"
                  )
              ),

              "lang": os.environ.get(
                  "KOKORO_LANG",
                  "en-us"
              ),

              "music": (
                  os.environ.get(
                      "MUSIC_ENABLED",
                      "true"
                  ).lower()
                  == "true"
              ),

              "music_volume": float(
                  os.environ.get(
                      "MUSIC_VOLUME",
                      "0.10"
                  )
              ),

              "animation": (
                  os.environ.get(
                      "ANIMATION_ENABLED",
                      "true"
                  ).lower()
                  == "true"
              ),

              "ads": False,

              "hook": hook,

              "script": script,

              "subtitle_ar": subtitle_ar,

              "title": title,

              "description": description,

              "tags": tags,

              "topic": topic,

              "category": category,

              "scenes": [

                  {

                      "text_en": script,

                      "text_ar": subtitle_ar,

                      "pexels_query": query

                  }

              ]

          }


          with open(
              "job.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  job,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              json.dumps(
                  job,
                  ensure_ascii=False,
                  indent=2
              )
          )

          PY

      - name: Validate job.json
        shell: bash
        run: |
          set -Eeuo pipefail

          jq empty job.json

          jq -e '.scenes | length == 1' job.json >/dev/null

          jq -e '.scenes[0].text_en | length > 0' job.json >/dev/null

          jq -e '.scenes[0].text_ar | length > 0' job.json >/dev/null

          jq -e '.scenes[0].pexels_query | length > 0' job.json >/dev/null

          jq -e '.ads == false' job.json >/dev/null

          echo "job.json validation passed"

      - name: Prepare production directory
        shell: bash
        run: |
          set -Eeuo pipefail

          RUN_DIR="$RUNNER_TEMP/short-run"

          mkdir -p "$RUN_DIR"

          cp job.json "$RUN_DIR/job.json"

          if [[ -d music ]]; then

            cp -a music/. "$RUN_DIR/music/" 2>/dev/null || true

          fi

          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"

      - name: Run production engine
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$HOME/.local/bin:$PATH"

          export KOKORO_PATH="$GITHUB_WORKSPACE/kokoro-models"

          export KOKORO_BIN="$KOKORO_BIN"

          export PEXELS_API_KEY="$PEXELS_API_KEY"

          export MUSIC_DIR="$RUN_DIR/music"

          chmod +x scripts/produce.sh

          scripts/produce.sh "$RUN_DIR"

      - name: Verify final video
        shell: bash
        run: |
          set -Eeuo pipefail

          VIDEO="$RUN_DIR/video.mp4"

          [[ -s "$VIDEO" ]] || {
            echo "::error::video.mp4 missing"
            exit 1
          }


          SIZE="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width,height \
              -of csv=p=0:s=x \
              "$VIDEO"
          )"


          DURATION="$(
            ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$VIDEO"
          )"


          VIDEO_CODEC="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              "$VIDEO"
          )"


          AUDIO_CODEC="$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              "$VIDEO"
          )"


          echo "Resolution: $SIZE"

          echo "Duration: ${DURATION}s"

          echo "Video codec: $VIDEO_CODEC"

          echo "Audio codec: $AUDIO_CODEC"


          [[ "$SIZE" == "1080x1920" ]] || {
            echo "::error::Expected 1080x1920"
            exit 1
          }


          [[ "$VIDEO_CODEC" == "h264" ]] || {
            echo "::error::Expected H.264"
            exit 1
          }


          [[ "$AUDIO_CODEC" == "aac" ]] || {
            echo "::error::Expected AAC"
            exit 1
          }


          awk \
            -v d="$DURATION" \
            'BEGIN {
                exit !(d >= 30 && d <= 60)
            }' || {

            echo "::error::Duration must be 30-60s"

            exit 1

          }

      - name: Upload Short to YouTube
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'

          import json
          import os

          from google.auth.transport.requests import Request

          from google.oauth2.credentials import Credentials

          from googleapiclient.discovery import build

          from googleapiclient.http import MediaFileUpload


          run_dir = os.env
