name: AI Router Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ai-router-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Router + Contracts + Repository Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_DIR: ${{ github.workspace }}/data/ai-router-validation
      AI_ROUTER_CONFIG: ${{ github.workspace }}/config/ai-router.json
      LONG_SLOT_MAX_OUTPUT_TOKENS: '1200'
      ODYSSEUS_GATEWAY_ENABLED: 'false'
      RESET_LONG_STORY_COOLDOWNS: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --no-input pytest json-repair pyyaml
      - name: Validate workflow YAML files
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          files = sorted(Path('.github/workflows').glob('*.y*ml'))
          if not files:
              raise SystemExit('No workflow files found')
          for path in files:
              data = yaml.safe_load(path.read_text(encoding='utf-8'))
              if not isinstance(data, dict):
                  raise SystemExit(f'Invalid workflow document: {path}')
              if 'jobs' not in data or not isinstance(data['jobs'], dict) or not data['jobs']:
                  raise SystemExit(f'Workflow has no jobs: {path}')
              print(f'WORKFLOW_YAML=PASS {path}')
          PY
      - name: Python syntax gate
        run: |
          set -Eeuo pipefail
          python -m compileall -q scripts tests
          echo 'PYTHON_SYNTAX=PASS'
      - name: Unit tests
        run: |
          set -Eeuo pipefail
          pytest -q tests/test_ai_router.py tests/test_long_story_slots.py tests/test_long_story_routing.py
      - name: Repository audit
        run: python scripts/repository_audit.py
      - name: Provider registry audit
        run: python scripts/provider_registry_audit.py
      - name: Provider mesh audit
        run: python scripts/provider_mesh_audit.py
      - name: Production contract audit
        run: python scripts/production_contract_audit.py
      - name: Cross-file production contract
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          c = json.loads((root/'config/production-contract.json').read_text(encoding='utf-8'))
          o = json.loads((root/'config/odysseus-gateway.json').read_text(encoding='utf-8'))
          r = json.loads((root/'config/ai-router.json').read_text(encoding='utf-8'))
          assert c['canonical_workflow'] == '.github/workflows/daily-production.yml'
          assert c['validation_workflow'] == '.github/workflows/ai-router-validation.yml'
          assert c['intelligence']['primary'] == 'Odysseus'
          assert c['intelligence']['fallback'] == 'Aqaaab AI Router'
          assert c['intelligence']['provider_keys_hidden_from_primary'] is True
          assert c['production']['long_video_count'] == 1
          assert c['production']['long_duration_seconds'] == {'min': 420, 'max': 900}
          assert c['production']['short_count'] == 4
          assert c['routing']['free_only'] is True and c['routing']['fail_closed'] is True
          assert c['routing']['fallbacks_per_task'] == 3
          assert c['routing']['slot_ranges'] == [[1,5],[6,10],[11,15],[16,20],[21,25]]
          assert o['openai_compatible'] is True and o['free_only'] is True
          assert o['never_expose_provider_keys'] is True
          assert o['fallback'] == 'scripts/ai_router.py'
          assert r['integration']['daily_pipeline'] == c['canonical_workflow']
          print('CROSS_FILE_CONTRACT=PASS')
          PY
      - name: Fixed-slot integrity
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          r = json.loads((root/'config/ai-router.json').read_text(encoding='utf-8'))
          s = json.loads((root/'config/long-story-slots.json').read_text(encoding='utf-8'))
          p = json.loads((root/'config/provider-activation-plan.json').read_text(encoding='utf-8'))
          patent = (root/'scripts/patent_story_engine.py').read_text(encoding='utf-8')
          orch = (root/'scripts/daily_content_orchestrator.py').read_text(encoding='utf-8')
          assert r['free_only'] is True and r['fail_closed'] is True
          task = r['tasks']['long_story']
          assert task['mode'] == 'fixed_slots'
          assert task['slot_count'] == 5 and task['slot_scene_count'] == 5
          assert task['max_output_tokens'] == 1200
          assert s['rules']['fixed_scene_ranges'] is True
          assert s['rules']['fallback_stays_in_same_slot'] is True
          assert s['rules']['never_skip_failed_slot'] is True
          assert [[x['start_scene'],x['end_scene']] for x in s['slots']] == [[1,5],[6,10],[11,15],[16,20],[21,25]]
          assert 'LONG_STORY_SLOT_ABORT' in patent
          assert 'LONG_STORY_SLOT_PROVIDER_QUARANTINE' in patent
          assert '_validate_story_slots' in orch
          assert len(p['providers']) <= 100
          print(f'FIXED_SLOT_CONTRACT=PASS providers={len(p["providers"])}')
          PY
      - name: Router construction smoke
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import os
          # Construction smoke is intentionally offline. Seed inert credentials so
          # provider adapters are instantiated without making any network request.
          os.environ.setdefault('QWENCLOUD_API_KEY', 'validation-dummy')
          os.environ.setdefault('GROQ_API_KEY', 'validation-dummy')
          os.environ.setdefault('GEMINI_API_KEY', 'validation-dummy')
          from scripts.ai_router import build_long_story_router, OUTPUT_TOKENS
          router = build_long_story_router()
          assert OUTPUT_TOKENS == 1200
          assert router.task == 'long_story'
          assert len(router.providers) >= 3
          assert all(p.free_only for p in router.providers)
          print(f'AI_ROUTER_SMOKE=PASS providers={len(router.providers)}')
          PY
      - name: Odysseus offline smoke
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.odysseus_gateway import TASK_BY_MODEL
          cfg = json.loads(Path('config/odysseus-gateway.json').read_text(encoding='utf-8'))
          assert cfg['enabled'] is False
          assert cfg['openai_compatible'] is True
          assert cfg['never_expose_provider_keys'] is True
          assert TASK_BY_MODEL['aqaaab/story'] == 'long_story'
          print('ODYSSEUS_GATEWAY_SMOKE=PASS')
          PY
