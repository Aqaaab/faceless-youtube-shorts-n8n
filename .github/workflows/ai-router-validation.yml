name: AI Router Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ai_router.py'
      - 'scripts/generate_job.py'
      - 'scripts/patent_provider_router.py'
      - 'scripts/patent_story_engine.py'
      - 'scripts/patent_story_engine_router.py'
      - 'scripts/compatible_provider_pool.py'
      - 'scripts/provider_registry_audit.py'
      - 'scripts/provider_mesh_audit.py'
      - 'scripts/daily_content_orchestrator.py'
      - 'scripts/production_live_smoke.py'
      - 'config/ai-router.json'
      - 'config/long-story-slots.json'
      - 'config/provider-activation-plan.json'
      - 'config/provider-mesh.json'
      - 'tests/test_ai_router.py'
      - 'tests/test_long_story_slots.py'
      - '.github/workflows/ai-router-validation.yml'
      - '.github/workflows/daily-production.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Router + Fixed Slots + Production Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_DIR: ${{ github.workspace }}/data/ai-router-validation
      AI_ROUTER_CONFIG: ${{ github.workspace }}/config/ai-router.json
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      QWENCLOUD_API_KEY: ${{ secrets.QWENCLOUD_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
      ANYAPI_API_KEY: ${{ secrets.ANYAPI_API_KEY }}
      ARLIAI_API_KEY: ${{ secrets.ARLIAI_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
      CEREBRAS_FREE_ONLY: 'true'
      QWENCLOUD_FREE_ONLY: 'true'
      QWENCLOUD_MODEL: 'qwen3.6-flash'
      QWENCLOUD_MODEL_CANDIDATES: 'qwen3.6-flash,qwen3.5-flash,qwen3.6-plus,qwen3.5-plus,qwen3.7-flash,qwen3.7-plus'
      LONG_SLOT_MAX_OUTPUT_TOKENS: '1200'
      ENABLE_TOGETHER_PROVIDER: 'false'
      ENABLE_MISTRAL_PROVIDER: 'true'
      ENABLE_MISTRAL_LONG_STORY_PROVIDER: 'true'
      ENABLE_SAMBANOVA_PROVIDER: 'true'
      ENABLE_HUGGINGFACE_PROVIDER: 'true'
      ENABLE_LLM7_PROVIDER: 'true'
      ENABLE_ANYAPI_PROVIDER: 'true'
      ENABLE_ARLIAI_PROVIDER: 'true'
      ENABLE_OLLAMACLOUD_PROVIDER: 'true'
      ENABLE_MODELSCOPE_PROVIDER: 'true'
      ENABLE_FREELLMAPI_PROVIDER: 'true'
      ENABLE_OLLAMA_PROVIDER: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest json-repair pyyaml
      - name: Syntax gate
        run: |
          set -Eeuo pipefail
          python -m py_compile \
            scripts/ai_router.py \
            scripts/generate_job.py \
            scripts/patent_provider_router.py \
            scripts/patent_story_engine.py \
            scripts/patent_story_engine_router.py \
            scripts/cerebras_provider.py \
            scripts/compatible_provider_pool.py \
            scripts/provider_registry_audit.py \
            scripts/provider_mesh_audit.py \
            scripts/production_live_smoke.py \
            scripts/daily_content_orchestrator.py
          echo 'AI_ROUTER_SYNTAX=PASS'
      - name: Unit tests
        run: pytest -q tests/test_ai_router.py tests/test_long_story_slots.py
      - name: Registry audit
        run: python scripts/provider_registry_audit.py
      - name: Provider mesh audit
        run: python scripts/provider_mesh_audit.py
      - name: Fixed-slot integration contract
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          c=json.loads((root/'config/ai-router.json').read_text())
          slots=json.loads((root/'config/long-story-slots.json').read_text())
          plan=json.loads((root/'config/provider-activation-plan.json').read_text())
          daily=(root/'.github/workflows/daily-production.yml').read_text()
          patent=(root/'scripts/patent_story_engine.py').read_text()
          orch=(root/'scripts/daily_content_orchestrator.py').read_text()
          assert c['free_only'] is True and c['fail_closed'] is True
          assert c['tasks']['long_story']['mode']=='fixed_slots'
          assert c['tasks']['long_story']['slot_count']==5
          assert c['tasks']['long_story']['slot_scene_count']==5
          assert c['tasks']['long_story']['max_output_tokens']==1200
          assert slots['rules']['fixed_scene_ranges'] is True
          assert slots['rules']['fallback_stays_in_same_slot'] is True
          assert slots['rules']['never_skip_failed_slot'] is True
          assert [x['start_scene'] for x in slots['slots']]==[1,6,11,16,21]
          assert [x['end_scene'] for x in slots['slots']]==[5,10,15,20,25]
          assert 'LONG_STORY_SLOT_ABORT' in patent
          assert 'LONG_STORY_SLOT_PROVIDER_QUARANTINE' in patent
          assert '_validate_story_slots' in orch
          assert len(plan['providers']) >= 14
          assert 'len(p[\'providers\']) == 11' not in daily
          assert 'daily-production-v2.yml' not in daily
          assert 'ZAI' not in c['additional_providers']
          assert 'GitHubModels' not in c['additional_providers']
          print('FIXED_STORY_SLOT_CONTRACT=PASS')
          print('CANONICAL_DAILY_WORKFLOW=PASS')
          print('PROVIDER_PLAN_DYNAMIC=PASS count=%d' % len(plan['providers']))
          PY
      - name: Router construction smoke
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from scripts.ai_router import build_long_story_router, OUTPUT_TOKENS
          r=build_long_story_router()
          assert OUTPUT_TOKENS == 1200
          assert r.task == 'long_story'
          assert all(p.free_only for p in r.providers)
          print('AI_ROUTER_PROVIDER_COUNT='+str(len(r.providers)))
          print('AI_ROUTER_PROVIDER_CONTRACT=PASS')
          PY
