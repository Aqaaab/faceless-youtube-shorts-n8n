name: AI Router Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ai_router.py'
      - 'scripts/generate_job.py'
      - 'scripts/patent_provider_router.py'
      - 'scripts/patent_story_engine.py'
      - 'scripts/patent_story_engine_router.py'
      - 'scripts/compatible_provider_pool.py'
      - 'scripts/provider_registry_audit.py'
      - 'config/ai-router.json'
      - 'config/provider-activation-plan.json'
      - 'tests/test_ai_router.py'
      - '.github/workflows/ai-router-validation.yml'
      - '.github/workflows/daily-production-v2.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Aqaaab AI Router
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_DIR: ${{ github.workspace }}/data/ai-router-validation
      AI_ROUTER_CONFIG: ${{ github.workspace }}/config/ai-router.json
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      QWENCLOUD_API_KEY: ${{ secrets.QWENCLOUD_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
      ANYAPI_API_KEY: ${{ secrets.ANYAPI_API_KEY }}
      ARLIAI_API_KEY: ${{ secrets.ARLIAI_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      CEREBRAS_FREE_ONLY: 'true'
      QWENCLOUD_FREE_ONLY: 'true'
      QWENCLOUD_MODEL: 'qwen3.6-flash'
      QWENCLOUD_MODEL_CANDIDATES: 'qwen3.6-flash,qwen3.5-flash,qwen3.6-plus,qwen3.5-plus,qwen3.7-flash,qwen3.7-plus'
      ENABLE_TOGETHER_PROVIDER: 'false'
      ENABLE_MISTRAL_PROVIDER: 'true'
      ENABLE_SAMBANOVA_PROVIDER: 'true'
      ENABLE_HUGGINGFACE_PROVIDER: 'true'
      ENABLE_LLM7_PROVIDER: 'true'
      ENABLE_ANYAPI_PROVIDER: 'true'
      ENABLE_ARLIAI_PROVIDER: 'true'
      ENABLE_OLLAMACLOUD_PROVIDER: 'true'
      ENABLE_MODELSCOPE_PROVIDER: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest json-repair
      - name: Syntax gate
        run: |
          set -Eeuo pipefail
          python -m py_compile scripts/ai_router.py scripts/generate_job.py scripts/patent_story_engine.py scripts/patent_story_engine_router.py scripts/patent_provider_router.py scripts/cerebras_provider.py scripts/compatible_provider_pool.py scripts/provider_registry_audit.py
          echo 'AI_ROUTER_SYNTAX=PASS'
      - name: Unit tests
        run: pytest -q tests/test_ai_router.py
      - name: Registry and integration audit
        run: python scripts/provider_registry_audit.py
      - name: Free-only and integration contract
        run: |
          python - <<'PY'
          import json
          c=json.load(open('config/ai-router.json',encoding='utf-8'))
          assert c['free_only'] is True
          assert c['fail_closed'] is True
          assert c['integration']['long_story_engine'] == 'scripts/patent_story_engine.py'
          assert c['integration']['daily_pipeline'] == '.github/workflows/daily-production-v2.yml'
          assert 'GitHubModels' not in c['tasks']['long_story']['providers']
          assert 'GitHubModels' not in c['additional_providers']
          assert 'ZAI' not in c['additional_providers']
          assert c['qwencloud']['free_only'] is True
          assert c['qwencloud']['model_discovery'] is True
          assert c['qwencloud']['never_use_unlisted_model'] is True
          patent=open('scripts/patent_story_engine.py',encoding='utf-8').read()
          assert 'from ai_router import build_long_story_router' in patent
          assert "d['router']='Aqaaab AI Router'" in patent
          assert "d['router_task']='long_story'" in patent
          pool=json.load(open('config/provider-activation-plan.json',encoding='utf-8'))
          active=[p['name'] for p in pool['providers']]
          assert len(active)==9 and 'GitHubModels' not in active and 'ZAI' not in active
          print('AI_ROUTER_FREE_ONLY=PASS')
          print('AI_ROUTER_FAIL_CLOSED=PASS')
          print('PATENT_ENGINE_INTEGRATION=PASS')
          print('PROVIDER_REGISTRY_CONTRACT=PASS')
          print('QWENCLOUD_FREE_ONLY_CONTRACT=PASS')
      - name: Provider inventory
        run: |
          python - <<'PY'
          import os
          keys=['MISTRAL_API_KEY','SAMBANOVA_API_KEY','HF_TOKEN','LLM7_API_KEY','ANYAPI_API_KEY','ARLIAI_API_KEY','OLLAMA_API_KEY','MODELSCOPE_API_KEY','TOGETHER_API_KEY','COHERE_API_KEY']
          for k in keys:
              print(k, 'PRESENT' if os.getenv(k) else 'MISSING')
          PY
      - name: Smoke-test router construction without provider inference
        run: |
          python - <<'PY'
          from scripts.ai_router import build_long_story_router
          r=build_long_story_router()
          print('AI_ROUTER_PROVIDER_COUNT='+str(len(r.providers)))
          print('AI_ROUTER_PROVIDER_ORDER='+','.join(p.name for p in r.providers))
          assert all(p.free_only for p in r.providers)
          assert r.task == 'long_story'
          print('AI_ROUTER_PROVIDER_CONTRACT=PASS')
      - name: Static JSON-output contract
        run: |
          python - <<'PY'
          src=open('scripts/generate_job.py',encoding='utf-8').read()
          assert "'response_format':{'type':'json_object'}" in src
          assert 'Some OpenAI-compatible models reject response_format' in src
          print('COMPAT_JSON_CONTRACT=PASS')
      - uses: actions/upload-artifact@v4
        with:
          name: ai-router-validation-${{ github.run_number }}
          path: data/ai-router-validation
          if-no-files-found: ignore
