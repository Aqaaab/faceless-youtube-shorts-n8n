name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🚨 ZERO COST GATE (runs first, always)
        shell: bash
        run: |
          set -euo pipefail
          needle="open""router"
          echo "Checking for paid services..."
          count=$(git grep -n -I -i "$needle" -- '*.py' '*.yml' '*.yaml' '*.json' || true)
          if [ -n "$count" ]; then
            echo "❌ CRITICAL: forbidden paid provider reference found"
            printf '%s\n' "$count"
            exit 1
          fi
          if git grep -n -I -E 'ODYSSEUS_MAX_ATTEMPTS[[:space:]]*[:=][[:space:]]*["'"'']1["'"'']|MAX_ATTEMPTS[[:space:]]*=[[:space:]]*1' -- '*.py' '*.yml' '*.yaml' '*.json'; then
            echo "❌ CRITICAL: retry limit below required minimum found"
            exit 1
          fi
          echo "✅ Zero cost gate passed — no paid provider path"

      - name: Install runtime tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
          fi
          fc-match 'Noto Sans Arabic' || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all Python modules
        run: python -m compileall -q app tests

      - name: Verify renderer and Python runtime
        run: |
          set -euo pipefail
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python - <<'PY'
          import PIL
          import edge_tts
          import requests
          print('Pillow:', PIL.__version__)
          print('edge-tts:', edge_tts.__version__)
          print('requests:', requests.__version__)
          PY
          python -m app.pipeline --help

      - name: Reject removed stock/legacy references
        shell: bash
        run: |
          set -euo pipefail
          p1='pex' ; p1="${p1}els"
          p2='render_' ; p2="${p2}manifest.json"
          p3='generated_' ; p3="${p3}still_first"
          p4='stock-' ; p4="${p4}video"
          pattern="${p1}|${p2}|${p3}|${p4}"
          if git grep -n -I -E "$pattern" -- ':!/.github/workflows/ci.yml'; then
            echo 'Forbidden legacy/stock-media reference detected.'
            exit 1
          fi

      - name: Run full contract suite
        run: python -m pytest -q
