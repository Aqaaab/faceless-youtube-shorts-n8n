name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 🚨 ZERO COST GATE
        shell: bash
        run: |
          set -euo pipefail
          paid_matches="$(git grep -n -I -i -E ':paid|paid-model' -- 'app/**' 'tests/**' 'scripts/**' '*.json' || true)"
          if [ -n "$paid_matches" ]; then echo "$paid_matches"; exit 1; fi
          retry_matches="$(git grep -n -I -E 'ODYSSEUS_MAX_ATTEMPTS[[:space:]]*=[[:space:]]*1|MAX_ATTEMPTS[[:space:]]*=[[:space:]]*1' -- 'app/**' 'tests/**' 'scripts/**' '*.json' || true)"
          if [ -n "$retry_matches" ]; then echo "$retry_matches"; exit 1; fi
          echo "✅ Zero cost gate passed"
      - name: Install runtime tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra; fi
          fc-match 'Noto Sans Arabic' | grep -qi 'Noto Sans Arabic'
          ffmpeg -filters 2>/dev/null | grep -q subtitles
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q app tests scripts
      - name: Verify renderer and Python runtime
        run: |
          set -euo pipefail
          ffmpeg -version | head -n 1; ffprobe -version | head -n 1
          python - <<'PY'
          import PIL,edge_tts,requests
          print('Pillow:',PIL.__version__); print('edge-tts:',edge_tts.__version__); print('requests:',requests.__version__)
          PY
          python -m app.pipeline --help
      - name: Reject removed stock/legacy references
        shell: bash
        run: |
          set -euo pipefail
          p1='pex'; p1="${p1}els"; p2='render_'; p2="${p2}manifest.json"; p3='generated_'; p3="${p3}still_first"; p4='stock-'; p4="${p4}video"; pattern="${p1}|${p2}|${p3}|${p4}"
          if git grep -n -I -E "$pattern" -- ':!/.github/workflows/ci.yml'; then exit 1; fi
      - name: Run full contract suite
        shell: bash
        run: |
          set -o pipefail; mkdir -p work; python -m pytest -q 2>&1 | tee work/pytest.log
      - name: Upload pytest diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: work/pytest.log
          if-no-files-found: ignore
          retention-days: 7

  artifact_gate:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install runtime tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra; fi
          fc-match 'Noto Sans Arabic' | grep -qi 'Noto Sans Arabic'; ffmpeg -filters 2>/dev/null | grep -q subtitles
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build deterministic visual artifact gate
        run: python scripts/ci_artifact_gate.py
      - name: Assert zero-cost and v4 artifact report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('work/qa_report.json').read_text(encoding='utf-8'))
          assert report['gate_pass'] is True,report
          assert report['cost_usd']==0.0 and report['paid_services_used']==[],report
          assert report['scenes_total']==25 and report['scenes_car_primary']>=25,report
          assert Path('work/visual_product_gate_v4.json').is_file()
          PY
      - name: Upload visual gate artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-product-gate
          path: |
            work/qa_report.json
            work/visual_product_gate_v4.json
            work/test_master.mp4
            work/test_short_1.mp4
          retention-days: 7

  production_render:
    needs: artifact_gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install runtime tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra; fi
          fc-match 'Noto Sans Arabic' | grep -qi 'Noto Sans Arabic'; ffmpeg -filters 2>/dev/null | grep -q subtitles
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Rebuild deterministic artifact prerequisite in this runner
        run: python scripts/ci_artifact_gate.py
      - name: Render deterministic production fixture
        run: python scripts/ci_artifact_gate.py --production
      - name: Assert production visual fixture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('work/qa_report.json').read_text(encoding='utf-8'))
          assert report['gate_pass'] is True,report
          assert report['failed_shorts']==[],report
          assert report['cost_usd']==0.0 and report['paid_services_used']==[],report
          assert len(report['production_shorts'])==4,report
          PY
      - name: Upload production visual artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visual-product-gate-production
          path: |
            work/qa_report.json
            work/visual_product_gate_v4.json
            production_artifacts/*.mp4
          retention-days: 7
