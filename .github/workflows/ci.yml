name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: .
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install runtime tools
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1 || ! fc-match 'Noto Sans Arabic' >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
          fi
          command -v ffmpeg >/dev/null
          command -v ffprobe >/dev/null
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q app tests scripts
      - name: Verify renderer and Python runtime
        run: |
          set -euo pipefail
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python - <<'PY'
          import PIL
          import edge_tts
          import requests
          print('Pillow:', PIL.__version__)
          print('edge-tts:', edge_tts.__version__)
          print('requests:', requests.__version__)
          PY
          python -m app.pipeline --help
      - name: Reject removed stock/legacy references
        shell: bash
        run: |
          set -euo pipefail
          p1='pex' ; p1="${p1}els"
          p2='render_' ; p2="${p2}manifest.json"
          p3='generated_' ; p3="${p3}still_first"
          p4='stock-' ; p4="${p4}video"
          pattern="${p1}|${p2}|${p3}|${p4}"
          if git grep -n -I -E "$pattern" -- ':!/.github/workflows/ci.yml'; then
            echo 'Forbidden legacy/stock-media reference detected.'
            exit 1
          fi
      - name: Run full contract suite
        run: python -m pytest -q
      - name: artifact_gate
        run: |
          set -euo pipefail
          python scripts/ci_artifact_gate.py
          test -s work/qa_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('work/qa_report.json').read_text(encoding='utf-8'))
          assert report['gate_pass'] is True
          assert report['car_first_ratio'] >= 0.70
          assert report['scenes_total'] == 25
          assert report['scenes_car_primary'] >= 18
          assert Path('work/test_master.mp4').stat().st_size > 0
          assert Path('work/test_short_1.mp4').stat().st_size > 0
          print('artifact_gate PASS', report)
          PY
      - name: production_render
        run: |
          set -euo pipefail
          python scripts/ci_artifact_gate.py --production
          test -s work/qa_report.json
          test "$(find production_artifacts -maxdepth 1 -name '*.mp4' -type f | wc -l)" -ge 5
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('work/qa_report.json').read_text(encoding='utf-8'))
          assert r.get('failed_shorts', []) == [], r.get('failed_shorts')
          assert len(r.get('production_shorts', [])) == 4
          assert Path(r['production_master']).is_file()
          print('production_render PASS')
          PY
      - name: Upload visual artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: visual-product-gate
          path: |
            work/qa_report.json
            work/visual_product_gate_v3.json
            work/test_master.mp4
            work/test_short_1.mp4
            production_artifacts/*.mp4
          retention-days: 7
