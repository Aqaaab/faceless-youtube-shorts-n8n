name: Automotive Engine CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automotive-engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install phase 1 dependencies
        run: python -m pip install --upgrade pip pydantic
      - name: Compile engine
        run: python -m compileall -q engine tests_engine
      - name: Run engine tests
        run: python -m unittest discover -s tests_engine -v
      - name: Validate blueprint schema JSON
        run: python -m json.tool schemas/episode-blueprint.schema.json >/dev/null
      - name: CLI smoke test
        run: python -m engine.produce --topic 'Toyota Supra MK4' --dry-run
