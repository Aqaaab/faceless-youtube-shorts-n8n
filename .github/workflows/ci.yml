name: CI

on:
  push:
    branches:
      - main
      - 'production-rebuild-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automotive-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🚨 ZERO COST GATE (runs first, always)
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking source for paid services..."
          paid_matches="$(git grep -n -I -i -E ':paid|paid-model' -- 'app/**' 'tests/**' 'scripts/**' '*.json' || true)"
          if [ -n "$paid_matches" ]; then
            echo "$paid_matches"
            echo "❌ CRITICAL: forbidden paid provider/model reference found in source"
            exit 1
          fi
          retry_matches="$(git grep -n -I -E 'ODYSSEUS_MAX_ATTEMPTS[[:space:]]*=[[:space:]]*1|MAX_ATTEMPTS[[:space:]]*=[[:space:]]*1' -- 'app/**' 'tests/**' 'scripts/**' '*.json' || true)"
          if [ -n "$retry_matches" ]; then
            echo "$retry_matches"
            echo "❌ CRITICAL: retry limit below required minimum found"
            exit 1
          fi
          echo "Checking workflow retry configuration..."
          if grep -nE 'ODYSSEUS_MAX_ATTEMPTS:[[:space:]]*["'"'']1["'"'']|ODYSSEUS_MAX_ATTEMPTS=[[:space:]]*1' .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null; then
            echo "❌ CRITICAL: workflow retry limit below required minimum found"
            exit 1
          fi
          echo "✅ Zero cost gate passed — paid paths rejected, verified free fallback allowed"

      - name: Install runtime tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1 || ! command -v blender >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg fonts-noto-core blender libegl1
          fi
          fc-match 'Noto Sans Arabic' || true
          blender --version | head -n 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all Python modules
        run: python -m compileall -q app tests scripts

      - name: Verify renderer and Python runtime
        run: |
          set -euo pipefail
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python - <<'PY'
          import PIL
          import edge_tts
          import requests
          print('Pillow:', PIL.__version__)
          print('edge-tts:', edge_tts.__version__)
          print('requests:', requests.__version__)
          PY
          python -m app.pipeline --help

      - name: Reject removed stock/legacy references
        shell: bash
        run: |
          set -euo pipefail
          p1='pex' ; p1="${p1}els"
          p2='render_' ; p2="${p2}manifest.json"
          p3='generated_' ; p3="${p3}still_first"
          p4='stock-' ; p4="${p4}video"
          pattern="${p1}|${p2}|${p3}|${p4}"
          if git grep -n -I -E "$pattern" -- ':!/.github/workflows/ci.yml'; then
            echo 'Forbidden legacy/stock-media reference detected.'
            exit 1
          fi

      - name: Compile production Python surface
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app scripts tests

      - name: Run full contract suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work
          python -m pytest -q 2>&1 | tee work/pytest.log

      - name: 🚀 First real production run (launch marker only)
        if: ${{ contains(github.event.head_commit.message, '[launch-production]') }}
        timeout-minutes: 180
        env:
          AUTOMOTIVE_RENDER_MOTION: "1"
          AUTOMOTIVE_MOTION_FPS: "15"
          AUTOMOTIVE_PROFILE: "premium_coupe"
          BLENDER_RENDER_SCALE: "0.85"
          BLENDER_RENDER_SCALE_PORTRAIT: "0.90"
          BLENDER_RENDER_SAMPLES: "12"
          ACE_RESUME: "1"
          ODYSSEUS_GATEWAY_BASE_URL: ${{ secrets.ODYSSEUS_GATEWAY_BASE_URL }}
          ODYSSEUS_GATEWAY_API_KEY: ${{ secrets.ODYSSEUS_GATEWAY_API_KEY }}
          ODYSSEUS_REQUEST_TIMEOUT: "60"
          ODYSSEUS_MAX_ATTEMPTS: "3"
          CAR_TOPIC: "Porsche 911 Turbo S"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ODYSSEUS_GATEWAY_BASE_URL"
          test -n "$ODYSSEUS_GATEWAY_API_KEY"
          python -m app.pipeline --topic "$CAR_TOPIC"
          test -s work/master_final.mp4
          test -s work/production_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("work/production_manifest.json").read_text(encoding="utf-8"))
          assert manifest.get("publish") == "APPROVED", manifest
          assert manifest.get("commit"), manifest
          assert manifest.get("story_hash"), manifest
          assert manifest.get("long_video", {}).get("sha256"), manifest
          assert len(manifest.get("shorts", [])) == 4, manifest
          print("FIRST_REAL_PRODUCTION_PASS")
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload first real production artifacts
        if: ${{ always() && contains(github.event.head_commit.message, '[launch-production]') }}
        uses: actions/upload-artifact@v4
        with:
          name: first-real-production
          path: work/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload pytest diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: work/pytest.log
          if-no-files-found: ignore
          retention-days: 7

  artifact_gate:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AUTOMOTIVE_RENDER_MOTION: "1"
      AUTOMOTIVE_MOTION_FPS: "8"
      BLENDER_RENDER_SCALE: "0.50"
      BLENDER_RENDER_SCALE_PORTRAIT: "0.75"
      # CI runners are CPU/headless; keep EEVEE sampling deterministic and bounded.
      # The visual gates remain unchanged; this removes the 64-sample default bottleneck.
      BLENDER_RENDER_SAMPLES: "8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore free local asset cache
        uses: actions/cache@v4
        with:
          path: |
            .ace_cache/assets
            .ace_cache/tts
            .ace_cache/scene-render
          key: ace-${{ runner.os }}-ci-${{ hashFiles('config/automotive_profiles.json', 'requirements.txt', 'app/tts.py', 'app/production_contract.py', 'app/blender_automotive.py', 'app/story_visuals.py', 'app/vertical_visuals.py', 'scripts/automotive_model.py', 'scripts/automotive_shots.py', 'scripts/automotive_world.py', 'scripts/vehicle_rig.py', 'scripts/blender_automotive_scene.py', 'scripts/build_persistent_asset.py', 'scripts/temporal_smoke.py', 'scripts/ci_artifact_gate.py') }}

      - name: Install runtime tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1 || ! command -v blender >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg fonts-noto-core blender libegl1
          fi
          blender --version | head -n 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build deterministic visual artifact gate
        run: python scripts/ci_artifact_gate.py
      - name: Assert zero-cost artifact report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('work/qa_report.json').read_text(encoding='utf-8'))
          assert report['gate_pass'] is True, report
          assert report['cost_usd'] == 0.0, report
          assert report['paid_services_used'] == [], report
          assert report['scenes_total'] == 25, report
          assert report['scenes_car_primary'] >= 18, report
          PY
      - name: Upload visual gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visual-product-gate
          path: |
            work/qa_report.json
            work/visual_product_gate_v3.json
            work/test_master.mp4
            work/test_short_1.mp4
            work/test_short_2.mp4
            work/test_short_3.mp4
            work/test_short_4.mp4
          retention-days: 7

  production_render:
    needs: artifact_gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUTOMOTIVE_RENDER_MOTION: "1"
      AUTOMOTIVE_MOTION_FPS: "15"
      # Production fixture must consume the same scene-render cache geometry
      # produced by artifact_gate; the delivery encode still targets 1080p/1080x1920.
      BLENDER_RENDER_SCALE: "0.50"
      BLENDER_RENDER_SCALE_PORTRAIT: "0.75"
      # Production fixture keeps higher sampling than smoke while remaining CPU-safe.
      BLENDER_RENDER_SAMPLES: "16"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore free local render cache
        uses: actions/cache@v4
        with:
          path: |
            .ace_cache/assets
            .ace_cache/tts
            .ace_cache/scene-render
          key: ace-${{ runner.os }}-ci-${{ hashFiles('config/automotive_profiles.json', 'requirements.txt', 'app/tts.py', 'app/production_contract.py', 'app/blender_automotive.py', 'app/story_visuals.py', 'app/vertical_visuals.py', 'scripts/automotive_model.py', 'scripts/automotive_shots.py', 'scripts/automotive_world.py', 'scripts/vehicle_rig.py', 'scripts/blender_automotive_scene.py', 'scripts/build_persistent_asset.py', 'scripts/temporal_smoke.py', 'scripts/ci_artifact_gate.py') }}
      - name: Install runtime tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1 || ! command -v blender >/dev/null 2>&1; then sudo apt-get update -y; sudo apt-get install -y ffmpeg fonts-noto-core blender libegl1; fi
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Render deterministic production fixture
        timeout-minutes: 35
        run: python scripts/ci_artifact_gate.py --production
      - name: Assert production visual fixture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('work/qa_report.json').read_text(encoding='utf-8'))
          assert report['gate_pass'] is True, report
          assert report['failed_shorts'] == [], report
          assert report['production_gate_pass'] is True, report
          assert report['visual_product_gate_pass'] is True, report
          assert report['mp4_visual_gate_pass'] is True, report
          assert report['cost_usd'] == 0.0, report
          assert report['paid_services_used'] == [], report
          assert len(report['production_shorts']) == 4, report
          PY
      - name: Upload production visual artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-product-gate-production
          path: |
            work/qa_report.json
            work/visual_product_gate_v3.json
            work/visual_product_gate_production.json
            work/mp4_visual_product_gate_production.json
            production_artifacts/*.mp4
          if-no-files-found: ignore
          retention-days: 7

# Production visual source revision: f0fcc59c — force CI validation after raster compositor repair.

# Production visual source revision: 5524d647 — force CI validation after silhouette containment repair.
  temporal_smoke:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTOMOTIVE_RENDER_MOTION: "1"
      AUTOMOTIVE_MOTION_FPS: "12"
      BLENDER_RENDER_SCALE: "0.25"
      BLENDER_RENDER_SAMPLES: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install runtime tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra blender libegl1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run temporal Blender + Arabic font smoke
        run: python scripts/temporal_smoke.py
      - name: Upload temporal smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: temporal-smoke
          path: work/temporal-smoke/
          if-no-files-found: ignore
          retention-days: 7
