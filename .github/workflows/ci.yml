name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q app tests
      - name: Reject removed stock/legacy pipeline references
        shell: bash
        run: |
          set -euo pipefail
          p1='pex' ; p1="${p1}els"
          p2='render_' ; p2="${p2}manifest.json"
          p3='generated_' ; p3="${p3}still_first"
          p4='stock-' ; p4="${p4}video"
          pattern="${p1}|${p2}|${p3}|${p4}"
          if git grep -n -I -E "$pattern" -- ':!/.github/workflows/ci.yml'; then
            echo 'Forbidden legacy/stock-media reference detected.'
            exit 1
          fi
      - name: Run contract tests
        run: pytest -q
