name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🚨 ZERO COST GATE (runs first, always)
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking for paid services..."
          # Reject concrete paid-service/model integrations. The gateway's
          # provider name and explicit free-only contract are intentionally allowed.
          paid_pattern='openrouter.ai/[^[:space:]"'"'`]*[^:]\|models/[^[:space:]"'"'`]*-paid\|:paid\|paid-model'
          matches="$(git grep -n -I -i -E "$paid_pattern" -- '*.py' '*.yml' '*.yaml' '*.json' || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "❌ CRITICAL: forbidden paid provider/model reference found"
            exit 1
          fi
          retry_matches="$(git grep -n -I -E 'ODYSSEUS_MAX_ATTEMPTS[[:space:]]*[:=][[:space:]]*["'"'']1["'"'']|MAX_ATTEMPTS[[:space:]]*=[[:space:]]*1' -- '*.py' '*.yml' '*.yaml' '*.json' || true)"
          if [ -n "$retry_matches" ]; then
            echo "$retry_matches"
            echo "❌ CRITICAL: retry limit below required minimum found"
            exit 1
          fi
          echo "✅ Zero cost gate passed — paid paths rejected, verified free fallback allowed"

      - name: Install runtime tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get install -y ffmpeg fonts-noto-core
          fi
          fc-match 'Noto Sans Arabic' || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all Python modules
        run: python -m compileall -q app tests scripts

      - name: Verify renderer and Python runtime
        run: |
          set -euo pipefail
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python - <<'PY'
          import PIL
          import edge_tts
          import requests
          print('Pillow:', PIL.__version__)
          print('edge-tts:', edge_tts.__version__)
          print('requests:', requests.__version__)
          PY
          python -m app.pipeline --help

      - name: Reject removed stock/legacy references
        shell: bash
        run: |
          set -euo pipefail
          p1='pex' ; p1="${p1}els"
          p2='render_' ; p2="${p2}manifest.json"
          p3='generated_' ; p3="${p3}still_first"
          p4='stock-' ; p4="${p4}video"
          pattern="${p1}|${p2}|${p3}|${p4}"
          if git grep -n -I -E "$pattern" -- ':!/.github/workflows/ci.yml'; then
            echo 'Forbidden legacy/stock-media reference detected.'
            exit 1
          fi

      - name: Run full contract suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work
          python -m pytest -q 2>&1 | tee work/pytest.log

      - name: Upload pytest diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: work/pytest.log
          if-no-files-found: ignore
          retention-days: 7

  artifact_gate:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install runtime tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get install -y ffmpeg fonts-noto-core; fi
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build deterministic visual artifact gate
        run: python scripts/ci_artifact_gate.py
      - name: Assert zero-cost artifact report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('work/qa_report.json').read_text(encoding='utf-8'))
          assert report['gate_pass'] is True, report
          assert report['cost_usd'] == 0.0, report
          assert report['paid_services_used'] == [], report
          assert report['scenes_total'] == 25, report
          assert report['scenes_car_primary'] >= 18, report
          PY
      - name: Upload visual gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visual-product-gate
          path: |
            work/qa_report.json
            work/visual_product_gate_v3.json
            work/test_master.mp4
            work/test_short_1.mp4
          retention-days: 7

  production_render:
    needs: artifact_gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install runtime tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get install -y ffmpeg fonts-noto-core; fi
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Render deterministic production fixture
        run: python scripts/ci_artifact_gate.py --production
      - name: Assert production visual fixture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('work/qa_report.json').read_text(encoding='utf-8'))
          assert report['gate_pass'] is True, report
          assert report['failed_shorts'] == [], report
          assert report['cost_usd'] == 0.0, report
          assert report['paid_services_used'] == [], report
          assert len(report['production_shorts']) == 4, report
          PY
      - name: Upload production visual artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visual-product-gate-production
          path: |
            work/qa_report.json
            work/visual_product_gate_v3.json
            production_artifacts/*.mp4
          retention-days: 7
