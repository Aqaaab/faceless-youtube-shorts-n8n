name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install runtime tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q app tests scripts
      - name: Repository consistency gate
        run: python scripts/repo_consistency_gate.py
      - name: Full contract suite
        run: |
          mkdir -p work
          python -m pytest -q 2>&1 | tee work/pytest.log
      - name: Upload test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: work/pytest.log
          if-no-files-found: ignore
          retention-days: 7

  wangp_smoke:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WANGP_MCP_URL: ${{ secrets.WANGP_MCP_URL }}
      WANGP_MCP_TOKEN: ${{ secrets.WANGP_MCP_TOKEN }}
      WANGP_VIDEO_MODEL_TYPE: ${{ secrets.WANGP_VIDEO_MODEL_TYPE }}
      WANGP_REFERENCE_MODEL_TYPE: ${{ secrets.WANGP_REFERENCE_MODEL_TYPE }}
      WANGP_REFERENCE_MEDIA_ID: ${{ secrets.WANGP_REFERENCE_MEDIA_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install runtime tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify WanGP configuration
        run: test -n "$WANGP_MCP_URL"
      - name: Run real WanGP MCP smoke
        run: python scripts/ci_wangp_smoke.py
      - name: Upload real WanGP smoke artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wangp-smoke
          path: |
            work/ci_wangp_smoke.json
            work/ci-wangp-smoke/
          if-no-files-found: ignore
          retention-days: 7
