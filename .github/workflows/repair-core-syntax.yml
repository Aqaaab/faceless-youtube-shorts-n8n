name: Repair core syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair only known escaped separators corruption
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/core.py')
          s = p.read_text(encoding='utf-8')
          bad = 'separators=(\\",\\",\\\":\\\")'
          good = 'separators=(",", ":")'
          if bad not in s:
              print('No known corruption found; nothing to commit.')
              raise SystemExit(0)
          p.write_text(s.replace(bad, good), encoding='utf-8')
          PY
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- app/core.py; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/core.py
          git commit -m 'fix: repair escaped JSON separators syntax'
          git push
