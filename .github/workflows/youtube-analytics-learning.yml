name: YouTube Analytics Learning

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *"

permissions:
  contents: read

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_DIR: ${{ github.workspace }}/data/analytics-learning
      LEARNING_DIR: ${{ github.workspace }}/learning
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install analytics dependencies
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-httplib2
      - name: Collect real YouTube Analytics
        run: |
          set -Eeuo pipefail
          python scripts/youtube_analytics_learning.py
      - name: Build learning summary
        run: |
          set -Eeuo pipefail
          python scripts/analytics_learning.py
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-analytics-learning-${{ github.run_number }}
          path: |
            data/analytics-learning
            learning/production_learning.json
