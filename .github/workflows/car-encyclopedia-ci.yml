name: Car Encyclopedia CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: car-encyclopedia-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate production contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip json-repair

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Run system gate
        run: python scripts/system_gate.py

      - name: Run test suite
        run: python -m unittest discover -s tests -v
