name: Install Expressive Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: contains(github.event.head_commit.message, '[install-expressive]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install expressive pipeline
        run: |
          python3 scripts/install_expressive_pipeline.py

      - name: Validate patched files
        run: |
          python3 -m py_compile scripts/voice_router.py scripts/voice_director.py scripts/visual_candidate_select.py scripts/install_expressive_pipeline.py
          bash -n scripts/voice_router.sh
          python3 - <<'PY'
          import yaml
          with open('.github/workflows/youtube-shorts.yml','r',encoding='utf-8') as f:
              yaml.safe_load(f)
          print('workflow yaml PASS')
          PY

      - name: Commit installed pipeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/youtube-shorts.yml scripts/visual_candidate_select.py scripts/voice_router.py scripts/voice_router.sh scripts/voice_director.py scripts/install_expressive_pipeline.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: enable expressive voice and AI visual fallback"
          git push origin HEAD:main
