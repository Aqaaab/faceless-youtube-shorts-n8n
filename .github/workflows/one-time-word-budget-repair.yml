name: One-time word budget repair

on:
  push:
    paths:
      - .github/workflows/one-time-word-budget-repair.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply bounded word repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/story_pipeline.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _local_scene_fallback(scene: dict, index: int, topic: str) -> dict:\n    fallback = dict(scene) if isinstance(scene, dict) else {}\n'''
          new = '''def _append_missing_words(text: str) -> str:\n    """Add only the missing English words, capped at ten."""\n    missing = max(0, MIN_WORDS - words(text))\n    if not missing:\n        return text\n    if missing > 10:\n        return text\n    additions = {\n        1: "Generally.",\n        2: "Generally, this matters.",\n        3: "Generally, this detail matters.",\n        4: "Generally, this detail matters greatly.",\n        5: "Generally, this detail affects performance.",\n        6: "Generally, this detail affects vehicle performance.",\n        7: "Generally, this detail affects overall vehicle performance.",\n        8: "Generally, this detail affects overall vehicle performance directly.",\n        9: "Generally, this detail can affect overall vehicle performance directly.",\n        10: "Generally, this detail can strongly affect overall vehicle performance directly.",\n    }\n    return f"{text.rstrip().rstrip('.')} {additions[missing]}"\n\n\ndef _local_scene_fallback(scene: dict, index: int, topic: str) -> dict:\n    fallback = dict(scene) if isinstance(scene, dict) else {}\n'''
          if old not in text:
              raise SystemExit("story_pipeline anchor not found")
          text = text.replace(old, new, 1)

          old = '''    if words(text) < MIN_WORDS or re.search(r"[\\u0600-\\u06ff]", text):\n        text = default_text\n    tokenized = re.findall(r"\\b[A-Za-z][A-Za-z0-9'\\-]*\\b", text)\n'''
          new = '''    if words(text) < MIN_WORDS or re.search(r"[\\u0600-\\u06ff]", text):\n        text = default_text\n    text = _append_missing_words(text)\n    tokenized = re.findall(r"\\b[A-Za-z][A-Za-z0-9'\\-]*\\b", text)\n'''
          if old not in text:
              raise SystemExit("word-count anchor not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify automotive tests
        run: |
          python -m pip install --disable-pip-version-check --no-input json-repair
          CAR_MODE=1 CAR_VEHICLE='BMW M5 F90' python -m unittest discover -s tests -p 'test_car_mode.py' -v

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/story_pipeline.py
          git rm .github/workflows/one-time-word-budget-repair.yml
          git commit -m 'fix: bound local scene word repair to ten words'
          git push

# trigger