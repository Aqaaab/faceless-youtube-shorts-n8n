name: Idea Generation Council Validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/idea_generation_council.py'
      - 'config/idea-council.json'
      - 'scripts/youtube_trend_scanner.py'
      - 'scripts/story_pattern_analyzer.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Validate council syntax and contract
        run: |
          set -Eeuo pipefail
          python -m py_compile scripts/idea_generation_council.py
          python - <<'PY'
          import json
          c=json.load(open('config/idea-council.json'))
          assert c['target_candidates'] >= 20
          assert c['top_k'] == 5
          assert len(c['roles']) == 5
          assert c['allow_source_copy'] is False
          print('IDEA_COUNCIL_CONFIG=PASS')
          PY
      - name: Execute council against available trend state
        run: |
          set -Eeuo pipefail
          mkdir -p data/daily-production
          python scripts/idea_generation_council.py
          python - <<'PY'
          import json
          p=json.load(open('data/daily-production/idea_council.json'))
          assert p['winner']['status']=='winner'
          assert len(p['top_5']) == min(5,p['deduplicated_count'])
          assert p['originality_policy']
          print('IDEA_COUNCIL_EXECUTION=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: idea-council-${{ github.run_number }}
          path: data/daily-production/idea_council.json
