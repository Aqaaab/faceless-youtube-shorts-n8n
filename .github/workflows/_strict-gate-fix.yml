name: Temporary Strict Gate Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[strict-gate-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply targeted strict gate fix
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/strict_story_gate.py')
          text = path.read_text(encoding='utf-8')

          old_explicit = '''    for token in re.findall(r"(?<![A-Za-z0-9])\\d+(?:[.,]\\d+)?(?![A-Za-z0-9])", _normalize(text)):\n'''
          new_explicit = '''    # A numeric literal is a fact only when it is not embedded in an alphanumeric\n    # identifier. Treat both Latin and Arabic-script letters as identifier context.\n    for token in re.findall(r"(?<![A-Za-z\\u0600-\\u06ff0-9])\\d+(?:[.,]\\d+)?(?![A-Za-z\\u0600-\\u06ff0-9])", _normalize(text)):\n'''
          if old_explicit not in text:
              raise SystemExit('expected explicit-number pattern not found')
          text = text.replace(old_explicit, new_explicit, 1)

          old_words = '''    words = re.findall(r"[a-z]+", normalized.replace("-", " "))\n'''
          new_words = '''    # Keep only standalone alphabetic tokens. This prevents digits from\n    # identifiers such as R35/V6 from becoming partial or synthetic facts.\n    raw_tokens = re.findall(r"[a-z0-9]+", normalized.replace("-", " "))\n    words = [token for token in raw_tokens if token.isalpha()]\n'''
          if old_words not in text:
              raise SystemExit('expected English number tokenizer not found')
          text = text.replace(old_words, new_words, 1)

          old_local = '''    source_ar = str(current.get("text_ar", "")).strip() or _fallback_arabic_translation()\n    # Build Arabic deterministically from a known-safe source, then enforce the exact English numeric Counter.\n    current["text_ar"] = _canonicalize_numeric_facts(english, source_ar)\n    if not _same_numeric_facts(english, current["text_ar"]):\n        # Final fail-closed fallback: start from the numeric-free Arabic sentence and append only exact ASCII values.\n        current["text_ar"] = _canonicalize_numeric_facts(english, _fallback_arabic_translation())\n    if not _same_numeric_facts(english, current["text_ar"]):\n        raise RuntimeError(f"STRICT_STORY_GATE: scene {index} could not deterministically align numeric facts")\n    current["text_ar"] = _normalize(current["text_ar"])\n    if _numbers(current["text_en"], "en") != _numbers(current["text_ar"], "ar"):\n        raise RuntimeError(f"STRICT_STORY_GATE: scene {index} numeric normalization mismatch after local repair")\n'''
          new_local = '''    source_ar = str(current.get("text_ar", "")).strip() or _fallback_arabic_translation()\n    # Numeric alignment is conditional: when English has no numeric facts, strip\n    # accidental Arabic numeric claims rather than manufacturing a numeric sentence.\n    # When English does contain facts, preserve exactly that Counter.\n    current["text_ar"] = _canonicalize_numeric_facts(english, source_ar)\n    if not _same_numeric_facts(english, current["text_ar"]):\n        current["text_ar"] = _canonicalize_numeric_facts(english, _fallback_arabic_translation())\n    expected_numbers = _numbers(current["text_en"], "en")\n    actual_numbers = _numbers(current["text_ar"], "ar")\n    if expected_numbers != actual_numbers:\n        raise RuntimeError(f"STRICT_STORY_GATE: scene {index} numeric normalization mismatch after local repair")\n    current["text_ar"] = _normalize(current["text_ar"])\n'''
          if old_local not in text:
              raise SystemExit('expected local-repair numeric block not found')
          text = text.replace(old_local, new_local, 1)

          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile scripts/strict_story_gate.py tests/test_strict_story_gate.py
          git add scripts/strict_story_gate.py .github/workflows/_strict-gate-fix.yml
          git commit -m "fix: strict gate numeric identifiers [strict-gate-autofix]"
          git push origin HEAD:main

      - name: Remove temporary fixer
        if: ${{ success() }}
        run: |
          rm -f .github/workflows/_strict-gate-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/_strict-gate-fix.yml
          git commit -m "chore: remove temporary strict gate fixer [strict-gate-autofix]" || true
          git push origin HEAD:main || true
