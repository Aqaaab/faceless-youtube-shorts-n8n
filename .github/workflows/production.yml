name: Automotive Production

on:
  workflow_dispatch:
    inputs:
      car_topic:
        description: 'Car/topic to produce'
        required: true
        type: string
      publish:
        description: 'Upload only after a complete passing product gate'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ODYSSEUS_GATEWAY_BASE_URL: ${{ secrets.ODYSSEUS_GATEWAY_BASE_URL }}
      ODYSSEUS_GATEWAY_API_KEY: ${{ secrets.ODYSSEUS_GATEWAY_API_KEY }}
      ODYSSEUS_REQUEST_TIMEOUT: "60"
      ODYSSEUS_MAX_ATTEMPTS: "3"
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
      CAR_TOPIC: ${{ inputs.car_topic }}
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4

      - name: 🚨 ZERO COST GATE (runs first, always)
        shell: bash
        run: |
          set -euo pipefail
          for needle in 'anthropic' 'cohere' 'openai_api_key' 'groq_api_key' 'mistral_api_key'; do
            if grep -Rni "$needle" app scripts --include='*.py' --include='*.yml' --include='*.yaml' --include='*.json' >/dev/null 2>&1; then
              echo "❌ CRITICAL: forbidden paid-provider reference found in source: $needle"
              exit 1
            fi
          done
          if grep -RniE 'ODYSSEUS_MAX_ATTEMPTS[[:space:]]*[:=][[:space:]]*["'"'']1["'"'']|MAX_ATTEMPTS[[:space:]]*=[[:space:]]*1' app scripts --include='*.py' --include='*.yml' --include='*.yaml' --include='*.json'; then
            echo "❌ CRITICAL: retry limit below required minimum found"
            exit 1
          fi
          if grep -nE 'ODYSSEUS_MAX_ATTEMPTS:[[:space:]]*["'"'']1["'"'']|ODYSSEUS_MAX_ATTEMPTS=[[:space:]]*1' .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null; then
            echo "❌ CRITICAL: workflow retry limit below required minimum found"
            exit 1
          fi
          echo "✅ Zero cost gate passed"

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ODYSSEUS_GATEWAY_BASE_URL"
          test -n "$ODYSSEUS_GATEWAY_API_KEY"
          test "$ODYSSEUS_MAX_ATTEMPTS" -ge 3
          test "$ODYSSEUS_REQUEST_TIMEOUT" -le 60
          if [ "${{ inputs.publish }}" = "true" ]; then
            test -n "$YOUTUBE_CLIENT_ID"
            test -n "$YOUTUBE_CLIENT_SECRET"
            test -n "$YOUTUBE_REFRESH_TOKEN"
            test -n "$YOUTUBE_PRIVACY_STATUS"
          fi

      - name: Preflight Odysseus zero-cost contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          base=os.environ['ODYSSEUS_GATEWAY_BASE_URL'].rstrip('/'); key=os.environ['ODYSSEUS_GATEWAY_API_KEY']; last_error=None
          for attempt in range(1,6):
              try:
                  request=urllib.request.Request(f'{base}/api/health',headers={'Authorization':f'Bearer {key}','Accept':'application/json'})
                  with urllib.request.urlopen(request,timeout=30) as response: body=json.load(response)
                  assert body.get('ok') is True, body
                  cfg=body.get('configuration',{})
                  assert cfg.get('upstream_configured') is True, cfg
                  assert int(cfg.get('upstream_attempts',0)) >= 3, cfg
                  assert float(cfg.get('timeout_seconds',0)) <= 60.0, cfg
                  assert float(cfg.get('cost_usd',0)) == 0.0, cfg
                  assert cfg.get('paid_services_used',[]) == [], cfg
                  print(json.dumps({'version':body.get('version'),'upstream_attempts':cfg.get('upstream_attempts'),'timeout_seconds':cfg.get('timeout_seconds'),'cost_usd':cfg.get('cost_usd'),'paid_services_used':cfg.get('paid_services_used')},ensure_ascii=False)); break
              except (urllib.error.URLError,TimeoutError,AssertionError,ValueError) as exc:
                  last_error=exc
                  if attempt==5: raise
                  time.sleep(min(8,2**(attempt-1)))
          else: raise RuntimeError(f'Odysseus preflight failed: {last_error}')
          PY

      - name: Install system renderer
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra; fi
          fc-match 'Noto Sans Arabic' | grep -qi 'Noto Sans Arabic'
          ffmpeg -filters 2>/dev/null | grep -q subtitles

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Re-run full source and contract suite before production
        run: |
          set -euo pipefail
          python -m compileall -q app tests
          python -m pytest -q

      - name: Generate Story and complete production artifact
        run: python -m app.pipeline --topic "$CAR_TOPIC"

      - name: Final artifact product gate
        shell: bash
        run: |
          set -euo pipefail
          test -s work/master_final.mp4
          test -s work/qa_report.json
          test -s work/arabic.srt
          test -s work/subtitle_burn.json
          test -s work/short_subtitles_burn.json
          test -s work/visual_product_gate_v4.json
          for i in 1 2 3 4; do test -s "work/shorts/short_${i}.mp4"; done
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('work/qa_report.json').read_text(encoding='utf-8'))
          visual=report.get('visual_product_gate',{})
          metrics=visual.get('metrics',{})
          assert report.get('passed') is True, report.get('errors')
          assert report.get('product_pass') is True, visual.get('errors')
          assert visual.get('passed') is True, visual.get('errors')
          assert float(report.get('weighted_score_10',0)) >= 9.0
          assert int(metrics.get('unique_families',0)) >= 8
          assert int(metrics.get('unique_cameras',0)) >= 8
          assert int(metrics.get('unique_intents',0)) >= 20
          assert int(metrics.get('car_identity_signatures',0)) == 1
          assert float(metrics.get('composition_score',0)) >= 75
          assert float(metrics.get('visual_realism_score',0)) >= 70
          assert float(metrics.get('subject_visibility_score',0)) >= 85
          subtitle_reports=metrics.get('subtitle_reports',[])
          assert len(subtitle_reports) == 5
          for item in subtitle_reports:
              probe=item.get('master') or item.get('probe')
              assert probe and probe.get('passed') is True, item
              margins=probe.get('margins',{})
              assert margins.get('left',0) >= 72 and margins.get('right',0) >= 72 and margins.get('bottom',0) >= 180 and margins.get('top',0) >= 120
          report['cost_usd']=0.0; report['paid_services_used']=[]
          Path('work/qa_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          assert report['cost_usd']==0.0 and report['paid_services_used']==[]
          PY

      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: automotive-production
          path: work/
          retention-days: 7

      - name: YouTube upload
        if: ${{ inputs.publish }}
        run: python -m app.upload
