name: Automotive Production

on:
  workflow_dispatch:
    inputs:
      car_topic:
        description: 'Car/topic to produce'
        required: true
        type: string
      publish:
        description: 'Upload only after a complete passing product gate'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ODYSSEUS_GATEWAY_BASE_URL: ${{ secrets.ODYSSEUS_GATEWAY_BASE_URL }}
      ODYSSEUS_GATEWAY_API_KEY: ${{ secrets.ODYSSEUS_GATEWAY_API_KEY }}
      ODYSSEUS_REQUEST_TIMEOUT: "60"
      ODYSSEUS_MAX_ATTEMPTS: "3"
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
      CAR_TOPIC: ${{ inputs.car_topic }}
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4

      - name: 🚨 ZERO COST GATE (runs first, always)
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking source for forbidden paid-provider routes..."
          # Scan executable application/fixture code only. Tests intentionally contain
          # split-string negative assertions and must not self-trigger this gate.
          for needle in 'anthropic' 'cohere' 'openai_api_key' 'groq_api_key' 'mistral_api_key'; do
            if grep -Rni "$needle" app scripts --include='*.py' --include='*.yml' --include='*.yaml' --include='*.json' >/dev/null 2>&1; then
              echo "❌ CRITICAL: forbidden paid-provider reference found in source: $needle"
              grep -Rni "$needle" app scripts --include='*.py' --include='*.yml' --include='*.yaml' --include='*.json' || true
              exit 1
            fi
          done
          if grep -RniE 'ODYSSEUS_MAX_ATTEMPTS[[:space:]]*[:=][[:space:]]*["'"'']1["'"'']|MAX_ATTEMPTS[[:space:]]*=[[:space:]]*1' app scripts --include='*.py' --include='*.yml' --include='*.yaml' --include='*.json'; then
            echo "❌ CRITICAL: retry limit below required minimum found"
            exit 1
          fi
          echo "Checking workflow retry configuration..."
          if grep -nE 'ODYSSEUS_MAX_ATTEMPTS:[[:space:]]*["'"'']1["'"'']|ODYSSEUS_MAX_ATTEMPTS=[[:space:]]*1' .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null; then
            echo "❌ CRITICAL: workflow retry limit below required minimum found"
            exit 1
          fi
          echo "✅ Zero cost gate passed — only free model routes are permitted"

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ODYSSEUS_GATEWAY_BASE_URL"
          test -n "$ODYSSEUS_GATEWAY_API_KEY"
          test "$ODYSSEUS_MAX_ATTEMPTS" -ge 3
          test "$ODYSSEUS_REQUEST_TIMEOUT" -le 60
          command -v blender >/dev/null
          blender --version | head -n 1
          if [ "${{ inputs.publish }}" = "true" ]; then
            test -n "$YOUTUBE_CLIENT_ID"
            test -n "$YOUTUBE_CLIENT_SECRET"
            test -n "$YOUTUBE_REFRESH_TOKEN"
            test -n "$YOUTUBE_PRIVACY_STATUS"
          fi

      - name: Preflight Odysseus zero-cost contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ['ODYSSEUS_GATEWAY_BASE_URL'].rstrip('/')
          key = os.environ['ODYSSEUS_GATEWAY_API_KEY']
          last_error = None

          for attempt in range(1, 6):
              try:
                  request = urllib.request.Request(f'{base}/api/health', headers={'Authorization': f'Bearer {key}', 'Accept': 'application/json'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = json.load(response)
                  assert body.get('ok') is True, body
                  cfg = body.get('configuration', {})
                  assert cfg.get('upstream_configured') is True, cfg
                  assert int(cfg.get('upstream_attempts', 0)) >= 3, cfg
                  assert float(cfg.get('timeout_seconds', 0)) <= 60.0, cfg
                  assert float(cfg.get('cost_usd', 0.0)) == 0.0, cfg
                  assert cfg.get('paid_services_used', []) == [], cfg
                  print(json.dumps({'version': body.get('version'), 'upstream_configured': cfg.get('upstream_configured'), 'upstream_attempts': cfg.get('upstream_attempts'), 'timeout_seconds': cfg.get('timeout_seconds'), 'cost_usd': cfg.get('cost_usd'), 'paid_services_used': cfg.get('paid_services_used')}, ensure_ascii=False))
                  break
              except (urllib.error.URLError, TimeoutError, AssertionError, ValueError) as exc:
                  last_error = exc
                  if attempt == 5:
                      raise
                  time.sleep(min(8, 2 ** (attempt - 1)))
          else:
              raise RuntimeError(f'Odysseus preflight failed: {last_error}')
          PY

      - name: Install system renderer
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-noto-core blender libegl1 libgl1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Re-run full source and contract suite before production
        run: |
          set -euo pipefail
          python -m compileall -q app tests
          python -m pytest -q

      - name: Generate Story and complete production artifact
        run: python -m app.pipeline --topic "$CAR_TOPIC"

      - name: Final artifact product gate
        shell: bash
        run: |
          set -euo pipefail
          test -s work/master_final.mp4
          test -s work/qa_report.json
          test -s work/arabic.srt
          test -s work/subtitle_burn.json
          test -s work/short_subtitles_burn.json
          test -s work/visual_product_gate_v3.json
          test -s work/mp4_visual_product_gate.json
          for i in 1 2 3 4; do test -s "work/shorts/short_${i}.mp4"; done
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('work/qa_report.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          report['cost_usd'] = 0.0
          report['paid_services_used'] = []
          path.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          assert report.get('passed') is True, report.get('errors')
          assert float(report.get('weighted_score_10', 0)) >= 9.0
          visual = report.get('visual_product_gate', {})
          assert float(visual.get('average_score', 0)) >= 85.0
          assert int(visual.get('car_first_scenes', 0)) >= 20
          assert int(visual.get('motion_scenes', 0)) == 25
          assert int(visual.get('unique_camera_angles', 0)) >= 4
          assert int(visual.get('unique_modes', 0)) >= 4
          assert report['cost_usd'] == 0.0
          assert report['paid_services_used'] == []
          v3 = json.loads(Path('work/visual_product_gate_v3.json').read_text(encoding='utf-8'))
          assert v3.get('passed') is True, v3.get('errors')
          assert v3.get('car_first_ratio', 0) >= 0.70, v3
          assert v3.get('metrics', {}).get('unique_cameras', 0) >= 8, v3
          assert v3.get('metrics', {}).get('unique_families', 0) >= 8, v3
          mp4 = json.loads(Path('work/mp4_visual_product_gate.json').read_text(encoding='utf-8'))
          assert mp4.get('passed') is True, mp4.get('errors')
          PY

      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: automotive-production
          path: work/
          retention-days: 7

      - name: YouTube upload
        if: ${{ inputs.publish }}
        run: python -m app.upload
