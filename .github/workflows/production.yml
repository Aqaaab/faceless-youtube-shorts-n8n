name: Automotive Production

on:
  workflow_dispatch:
    inputs:
      car_topic:
        description: 'Car/topic to produce'
        required: true
        type: string
      publish:
        description: 'Upload only after a complete passing product gate'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ODYSSEUS_GATEWAY_BASE_URL: ${{ secrets.ODYSSEUS_GATEWAY_BASE_URL }}
      ODYSSEUS_GATEWAY_API_KEY: ${{ secrets.ODYSSEUS_GATEWAY_API_KEY }}
      ODYSSEUS_REQUEST_TIMEOUT: "60"
      ODYSSEUS_MAX_ATTEMPTS: "3"
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
      CAR_TOPIC: ${{ inputs.car_topic }}
    steps:
      - name: Checkout + 🚨 ZERO COST GATE (runs first, always)
        uses: actions/checkout@v4

      - name: 🚨 ZERO COST GATE ASSERTION
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking for paid providers..."
          count=$(grep -RniE 'openrouter|OPENROUTER' . --include='*.py' --include='*.yml' --include='*.yaml' --include='*.json' --exclude-dir=.git 2>/dev/null | wc -l || true)
          if [ "$count" -gt 0 ]; then
            echo "❌ CRITICAL: OpenRouter found in codebase"
            grep -RniE 'openrouter|OPENROUTER' . --include='*.py' --include='*.yml' --include='*.yaml' --include='*.json' --exclude-dir=.git
            exit 1
          fi
          if grep -RniE 'ODYSSEUS_MAX_ATTEMPTS[[:space:]]*[:=][[:space:]]*["'"'']1["'"'']|MAX_ATTEMPTS[[:space:]]*=[[:space:]]*1' . --include='*.py' --include='*.yml' --include='*.yaml' --include='*.json' --exclude-dir=.git; then
            echo "❌ CRITICAL: ODYSSEUS_MAX_ATTEMPTS=1 found"
            exit 1
          fi
          echo "✅ Zero cost gate passed — no OpenRouter / paid fallback path"

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ODYSSEUS_GATEWAY_BASE_URL"
          test -n "$ODYSSEUS_GATEWAY_API_KEY"
          test "$ODYSSEUS_MAX_ATTEMPTS" -ge 3
          test "$ODYSSEUS_REQUEST_TIMEOUT" -le 60
          if [ "${{ inputs.publish }}" = "true" ]; then
            test -n "$YOUTUBE_CLIENT_ID"
            test -n "$YOUTUBE_CLIENT_SECRET"
            test -n "$YOUTUBE_REFRESH_TOKEN"
            test -n "$YOUTUBE_PRIVACY_STATUS"
          fi

      - name: Preflight Odysseus zero-cost contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ['ODYSSEUS_GATEWAY_BASE_URL'].rstrip('/')
          key = os.environ['ODYSSEUS_GATEWAY_API_KEY']
          last_error = None

          for attempt in range(1, 6):
              try:
                  request = urllib.request.Request(
                      f'{base}/api/health',
                      headers={'Authorization': f'Bearer {key}', 'Accept': 'application/json'},
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = json.load(response)
                  assert body.get('ok') is True, body
                  cfg = body.get('configuration', {})
                  assert cfg.get('upstream_configured') is True, cfg
                  assert int(cfg.get('fallback_count', 0)) == 0, cfg
                  assert cfg.get('fallbacks', []) == [], cfg
                  assert cfg.get('openrouter_configured') is False, cfg
                  assert int(cfg.get('upstream_attempts', 0)) >= 3, cfg
                  assert float(cfg.get('timeout_seconds', 0)) <= 60.0, cfg
                  assert float(cfg.get('cost_usd', 0.0)) == 0.0, cfg
                  assert cfg.get('paid_services_used', []) == [], cfg
                  print(json.dumps({
                      'version': body.get('version'),
                      'upstream_configured': cfg.get('upstream_configured'),
                      'fallback_count': cfg.get('fallback_count'),
                      'fallbacks': cfg.get('fallbacks', []),
                      'openrouter_configured': cfg.get('openrouter_configured'),
                      'timeout_seconds': cfg.get('timeout_seconds'),
                      'upstream_attempts': cfg.get('upstream_attempts'),
                      'cost_usd': cfg.get('cost_usd'),
                      'paid_services_used': cfg.get('paid_services_used'),
                  }, ensure_ascii=False))
                  break
              except (urllib.error.URLError, TimeoutError, AssertionError, ValueError) as exc:
                  last_error = exc
                  if attempt == 5:
                      raise
                  time.sleep(min(8, 2 ** (attempt - 1)))
          else:
              raise RuntimeError(f'Odysseus preflight failed: {last_error}')
          PY

      - name: Install system renderer
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Re-run full source and contract suite before production
        run: |
          set -euo pipefail
          python -m compileall -q app tests
          python -m pytest -q

      - name: Generate Story and complete production artifact
        run: python -m app.pipeline --topic "$CAR_TOPIC"

      - name: Final artifact product gate
        shell: bash
        run: |
          set -euo pipefail
          test -s work/master_final.mp4
          test -s work/qa_report.json
          test -s work/arabic.srt
          test -s work/subtitle_burn.json
          test -s work/short_subtitles_burn.json
          for i in 1 2 3 4; do test -s "work/shorts/short_${i}.mp4"; done
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('work/qa_report.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          report['cost_usd'] = 0.0
          report['paid_services_used'] = []
          path.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          assert report.get('passed') is True, report.get('errors')
          assert float(report.get('weighted_score_10', 0)) >= 9.0
          visual = report.get('visual_product_gate', {})
          assert float(visual.get('average_score', 0)) >= 85.0
          assert int(visual.get('car_first_scenes', 0)) >= 20
          assert int(visual.get('motion_scenes', 0)) == 25
          assert int(visual.get('unique_camera_angles', 0)) >= 4
          assert int(visual.get('unique_modes', 0)) >= 4
          assert report['cost_usd'] == 0.0
          assert report['paid_services_used'] == []
          PY

      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: automotive-production
          path: work/
          retention-days: 7

      - name: YouTube upload
        if: ${{ inputs.publish }}
        run: python -m app.upload
