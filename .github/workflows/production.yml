name: Automotive Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      car_topic:
        description: "Car/topic to produce"
        required: true
        type: string
      publish:
        description: "Publish only after all product gates pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  production:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[production]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: .
      AUTOMOTIVE_PROFILE: "premium_coupe"
      ACE_RESUME: "1"
      CAR_TOPIC: ${{ github.event_name == 'workflow_dispatch' && inputs.car_topic || vars.CAR_TOPIC || 'تحليل سيارة حديثة' }}
      ODYSSEUS_GATEWAY_BASE_URL: ${{ secrets.ODYSSEUS_GATEWAY_BASE_URL }}
      ODYSSEUS_GATEWAY_API_KEY: ${{ secrets.ODYSSEUS_GATEWAY_API_KEY }}
      ODYSSEUS_REQUEST_TIMEOUT: "60"
      ODYSSEUS_MAX_ATTEMPTS: "3"
      WANGP_MCP_URL: ${{ secrets.WANGP_MCP_URL }}
      WANGP_MCP_TOKEN: ${{ secrets.WANGP_MCP_TOKEN }}
      WANGP_VIDEO_MODEL_TYPE: ${{ secrets.WANGP_VIDEO_MODEL_TYPE }}
      WANGP_REFERENCE_MODEL_TYPE: ${{ secrets.WANGP_REFERENCE_MODEL_TYPE }}
      WANGP_REFERENCE_MEDIA_ID: ${{ secrets.WANGP_REFERENCE_MEDIA_ID }}
      WANGP_FPS: "15"
      WANGP_READ_TIMEOUT: "900"
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
      - name: Install runtime tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and repository consistency gate
        run: |
          python -m compileall -q app tests scripts
          python scripts/repo_consistency_gate.py
      - name: Full contract suite
        run: python -m pytest -q
      - name: Verify zero-cost Story Gateway
        run: |
          test -n "$ODYSSEUS_GATEWAY_BASE_URL"
          test -n "$ODYSSEUS_GATEWAY_API_KEY"
          test "$ODYSSEUS_MAX_ATTEMPTS" -ge 3
          test "$ODYSSEUS_REQUEST_TIMEOUT" -le 60
          python - <<'PY'
          import json, os, urllib.request
          req=urllib.request.Request(os.environ["ODYSSEUS_GATEWAY_BASE_URL"].rstrip("/")+"/api/health",headers={"Authorization":"Bearer "+os.environ["ODYSSEUS_GATEWAY_API_KEY"],"Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as response: body=json.load(response)
          cfg=body.get("configuration",{})
          assert body.get("ok") is True, body
          assert cfg.get("upstream_configured") is True, cfg
          assert int(cfg.get("upstream_attempts",0)) >= 3, cfg
          assert float(cfg.get("timeout_seconds",0)) <= 60.0, cfg
          assert float(cfg.get("cost_usd",0.0)) == 0.0, cfg
          assert cfg.get("paid_services_used",[]) == [], cfg
          print(json.dumps(body,ensure_ascii=False))
          PY
      - name: Verify WanGP MCP contract
        run: |
          test -n "$WANGP_MCP_URL"
          python -m app.wangp
      - name: Restore free TTS and WanGP cache
        uses: actions/cache@v4
        with:
          path: |
            .ace_cache/tts
            .ace_cache/wangp
          key: ${{ runner.os }}-wangp-${{ hashFiles('app/wangp.py', 'app/production_contract.py', 'app/cache.py', 'app/tts.py', 'config/automotive_profiles.json') }}
      - name: Generate complete production artifact
        run: python -m app.pipeline --topic "$CAR_TOPIC"
      - name: Final artifact product gate
        run: |
          set -euo pipefail
          test -s work/master_final.mp4
          test -s work/qa_report.json
          test -s work/arabic.srt
          test -s work/subtitle_burn.json
          test -s work/short_subtitles_burn.json
          test -s work/visual_product_gate.json
          test -s work/mp4_visual_product_gate.json
          test -s work/arabic_font_gate.json
          test -s work/short_candidates.json
          test -s work/thumbnail.jpg
          for i in 1 2 3 4; do test -s "work/shorts/short_$i.mp4"; done
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("work/qa_report.json").read_text(encoding="utf-8"))
          assert r.get("renderer")=="wangp", r
          assert r.get("renderer_contract")=="wangp-v1", r
          assert r.get("passed") is True, r
          assert float(r.get("weighted_score_10",0)) >= 9.0, r
          assert r.get("cost_usd")==0.0, r
          assert r.get("paid_services_used")==[], r
          assert r.get("visual_product_gate",{}).get("passed") is True, r
          assert r.get("mp4_visual_product_gate",{}).get("passed") is True, r
          v=r["visual_product_gate"]
          assert float(v.get("car_first_ratio",0)) >= 0.70, v
          assert int(v.get("metrics",{}).get("unique_cameras",0)) >= 8, v
          assert int(v.get("metrics",{}).get("unique_families",0)) >= 8, v
          s=json.loads(Path("work/short_candidates.json").read_text(encoding="utf-8"))
          assert int(s.get("pool_size",0))>=30 and len(s.get("selected",[]))==4, s
          PY
      - name: Upload complete production artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: automotive-production-wangp
          path: work/
          if-no-files-found: ignore
          retention-days: 7
      - name: YouTube upload
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
        run: python -m app.upload
