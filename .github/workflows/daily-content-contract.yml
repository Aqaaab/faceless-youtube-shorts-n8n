name: Daily Content System Contract

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

concurrency:
  group: daily-content-contract
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: openrouter/free
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_MODEL: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_TEXT_MODEL: "qwen/qwen3.6-27b"
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      TOGETHER_TEXT_MODEL: "Qwen/Qwen3.5-9B"
      RUN_DIR: ${{ github.workspace }}/data/daily
      ALLOW_DETERMINISTIC_FALLBACK: "false"
      LONG_MIN_WORDS: "1050"
      LONG_MAX_WORDS: "2100"
      LONG_MIN_SCENES: "18"
      LONG_MAX_SCENES: "30"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check json-repair yt-dlp
      - name: Compile complete daily content system
        run: |
          set -Eeuo pipefail
          python -m py_compile \
            scripts/youtube_trend_scanner.py \
            scripts/story_pattern_analyzer.py \
            scripts/github_assistant_registry.py \
            scripts/daily_content_planner.py \
            scripts/patent_story_engine.py \
            scripts/viral_engine.py \
            scripts/daily_content_orchestrator.py
      - name: Run daily content contract
        run: |
          set -Eeuo pipefail
          python scripts/daily_content_orchestrator.py
          for f in daily_plan.json trend_candidates.json story_pattern.json long_story.json viral_plan.json github_assistants.json daily_manifest.json; do
            test -s "$RUN_DIR/$f"
          done
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=Path(os.environ['RUN_DIR'])
          p=json.loads((r/'daily_plan.json').read_text())
          s=json.loads((r/'long_story.json').read_text())
          v=json.loads((r/'viral_plan.json').read_text())
          m=json.loads((r/'daily_manifest.json').read_text())
          a=json.loads((r/'github_assistants.json').read_text())
          assert p['daily_long_video']['count']==1
          assert p['daily_shorts']['count']==4
          assert p['daily_long_video']['format']=='patent'
          assert p['trend_research']['enabled'] is True
          assert s['format']=='patent' and 1050<=s['script_words']<=2100
          assert len(v['shorts'])==4
          assert all(0 <= float(x['score']) <= 100 for x in v['shorts'])
          assert a['assistants'] and m['research_first'] is True
          print('DAILY_CONTENT_SYSTEM=PASS')
          print('TREND_RESEARCH=PASS')
          print('GITHUB_ASSISTANTS=PASS')
          print('LONG_VIDEO=1 SHORTS=4')
          PY
      - name: Upload daily contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-content-contract
          path: ${{ env.RUN_DIR }}
