name: Production System Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-system-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: End-to-End Architecture Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check --no-input pyyaml json-repair pytest

      - name: Python syntax gate
        run: python -m compileall -q scripts tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Repository audit
        run: python scripts/repository_audit.py

      - name: Provider registry audit
        run: python scripts/provider_registry_audit.py

      - name: Provider mesh audit
        run: python scripts/provider_mesh_audit.py

      - name: Production contract audit
        run: python scripts/production_contract_audit.py

      - name: Reliability gate
        run: python scripts/production_reliability_gate.py

      - name: End-to-end system contract
        run: python scripts/production_system_gate.py

      - name: Odysseus client import smoke
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from scripts.odysseus_gateway import chat_url, extract_response, health_url
          from scripts.odysseus_primary_story import _chat_url, _extract_response, MODEL
          assert MODEL == 'aqaaab/story'
          assert extract_response({'response':'{"ok":true}'}) == {'ok': True}
          assert _extract_response({'response':'{"ok":true}'}) == {'ok': True}
          print('ODYSSEUS_CLIENT_IMPORT=PASS')
          PY

      - name: Production artifact contract
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('config/production-contract.json').read_text())
          p=c['production']
          assert p['long_video_count']==1
          assert p['long_duration_seconds']=={'min':420,'max':900}
          assert p['short_count']==4
          assert p['short_resolution']==[1080,1920]
          assert p['short_video_codec']=='h264'
          assert p['short_fps']==30
          print('PRODUCTION_ARTIFACT_CONTRACT=PASS')
          PY
