name: Provider Fallback CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-fallback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Compile
        run: python -m compileall -q scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Long-story fallback regression
        run: python -m unittest discover -s tests -p '*story*' -v
