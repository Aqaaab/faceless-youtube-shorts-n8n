name: Clean CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input json-repair
      - run: python -m compileall -q scripts tests
      - run: python scripts/provider_registry.py
      - run: python scripts/system_gate.py
      - run: python -m unittest discover -s tests -v
