name: Odysseus Ephemeral Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  odysseus:
    name: Build + Start Odysseus Ephemeral
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Checkout Odysseus
        uses: actions/checkout@v5
        with:
          repository: odysseus-dev/odysseus
          ref: dev
          path: .odysseus
          fetch-depth: 1

      - name: Prepare ephemeral Odysseus environment
        working-directory: .odysseus
        run: |
          set -Eeuo pipefail
          cat > .env <<'EOF'
          APP_BIND=127.0.0.1
          APP_PORT=7000
          AUTH_ENABLED=true
          LOCALHOST_BYPASS=false
          ODYSSEUS_ADMIN_USER=admin
          ODYSSEUS_ADMIN_PASSWORD=${{ secrets.ODYSSEUS_ADMIN_PASSWORD }}
          PUID=1000
          PGID=1000
          EOF

      - name: Build Odysseus image
        working-directory: .odysseus
        run: docker compose build odysseus

      - name: Start Odysseus dependencies
        working-directory: .odysseus
        run: docker compose up -d chromadb searxng

      - name: Start Odysseus
        working-directory: .odysseus
        run: docker compose up -d odysseus

      - name: Wait for Odysseus health
        working-directory: .odysseus
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:7000/ >/dev/null; then
              echo 'ODYSSEUS_HTTP=PASS'
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200 odysseus
          exit 1

      - name: Verify API surface
        working-directory: .odysseus
        run: |
          set -Eeuo pipefail
          curl -fsS --max-time 10 http://127.0.0.1:7000/ >/dev/null
          if curl -fsS --max-time 10 http://127.0.0.1:7000/openapi.json | grep -q '/api/v1/chat'; then
            echo 'ODYSSEUS_API_V1_CHAT=PASS'
          else
            echo 'ODYSSEUS_API_V1_CHAT=FAIL'
            docker compose logs --tail=200 odysseus
            exit 1
          fi

      - name: Cleanup
        if: always()
        working-directory: .odysseus
        run: docker compose down -v --remove-orphans
