name: One-time Router Sync
on:
  push:
    paths:
      - sync.marker
permissions:
  contents: write
jobs:
  sync:
    if: ${{ hashFiles('sync.marker') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch daily render environment
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/daily-production-v2.yml')
          s=p.read_text()
          old='''      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}\n      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}'''
          new='''      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}\n      HF_TOKEN: ${{ secrets.HF_TOKEN }}\n      BLOCKRUN_VISION_MODEL: nvidia/nemotron-nano-12b-v2-vl\n      HF_VISION_MODEL: Qwen/Qwen2.5-VL-3B-Instruct\n      AI_ROUTER_ONLY: "true"\n      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}'''
          if old not in s: raise SystemExit('render env anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm -f sync.marker
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/daily-production-v2.yml sync.marker
          git commit -m "Wire HF vision fallback into daily render"
          git push
