name: Daily Production Pipeline

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Prepare the complete production package and optionally publish"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: daily-production
  cancel-in-progress: false

env:
  RUN_DIR: ${{ github.workspace }}/data/daily-production
  LEARNING_DIR: ${{ github.workspace }}/learning
  OPENROUTER_MODEL: openrouter/free
  GEMINI_MODEL: gemini-3.6-flash
  GROQ_TEXT_MODEL: openai/gpt-oss-120b
  QWENCLOUD_BASE_URL: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
  QWENCLOUD_MODEL: qwen3.6-flash
  QWENCLOUD_MODEL_CANDIDATES: qwen3.6-flash,qwen3.5-flash,qwen3.6-plus,qwen3.5-plus,qwen3.7-flash,qwen3.7-plus
  QWENCLOUD_FREE_ONLY: "true"
  QWENCLOUD_MAX_CALLS_PER_RUN: "3"
  CEREBRAS_BASE_URL: https://api.cerebras.ai/v1
  CEREBRAS_MODEL: gpt-oss-120b
  CEREBRAS_FREE_ONLY: "true"
  CEREBRAS_MAX_CALLS_PER_RUN: "5"
  ALLOW_DETERMINISTIC_FALLBACK: "false"
  LONG_MIN_WORDS: "1050"
  LONG_MAX_WORDS: "2100"
  LONG_MIN_SCENES: "18"
  LONG_MAX_SCENES: "30"
  LONG_MIN_SECONDS: "420"
  LONG_MAX_SECONDS: "900"

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Preflight / Contracts / Registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
      ANYAPI_API_KEY: ${{ secrets.ANYAPI_API_KEY }}
      ARLIAI_API_KEY: ${{ secrets.ARLIAI_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
      FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml json-repair yt-dlp
      - name: Syntax gate
        run: |
          set -Eeuo pipefail
          python -m py_compile \
            scripts/production_reliability_gate.py \
            scripts/provider_registry_audit.py \
            scripts/provider_mesh_audit.py \
            scripts/ai_router.py \
            scripts/generate_job.py \
            scripts/patent_provider_router.py \
            scripts/patent_story_engine.py \
            scripts/patent_story_engine_router.py \
            scripts/compatible_provider_pool.py \
            scripts/daily_content_orchestrator.py \
            scripts/youtube_trend_scanner.py \
            scripts/story_pattern_analyzer.py \
            scripts/idea_generation_council.py \
            scripts/idea_council_judge.py \
            scripts/council_learning_bridge.py \
            scripts/content_intelligence_upgrade.py \
            scripts/hook_optimizer.py \
            scripts/retention_planner.py \
            scripts/scene_intelligence.py \
            scripts/short_factory.py \
            scripts/visual_qa.py \
            scripts/final_feature_qa.py \
            scripts/packaging_optimizer.py \
            scripts/create_thumbnail.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Production contract audit
        run: |
          set -Eeuo pipefail
          python scripts/production_reliability_gate.py
          python scripts/provider_registry_audit.py
          python scripts/provider_mesh_audit.py
      - name: Canonical contract checks
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          r=json.loads((root/'config/ai-router.json').read_text())
          p=json.loads((root/'config/provider-activation-plan.json').read_text())
          m=json.loads((root/'config/provider-mesh.json').read_text())
          s=json.loads((root/'config/long-story-slots.json').read_text())
          daily=root/'.github/workflows/daily-production.yml'
          assert daily.is_file()
          w=daily.read_text()
          assert r['free_only'] and r['fail_closed']
          assert r['tasks']['long_story']['mode']=='fixed_slots'
          assert r['tasks']['long_story']['slot_count']==5 and r['tasks']['long_story']['slot_scene_count']==5
          assert [x['start_scene'] for x in s['slots']]==[1,6,11,16,21]
          assert [x['end_scene'] for x in s['slots']]==[5,10,15,20,25]
          assert s['rules']['fallback_stays_in_same_slot'] is True
          assert s['rules']['never_skip_failed_slot'] is True
          assert len(p['providers']) >= 14
          assert all(k in m['tasks'][t] for t in m['tasks'] for k in ('primary','backup_1','backup_2'))
          assert 'len(p[\'providers\']) == 11' not in w
          assert 'daily-production-v2.yml' not in w
          assert 'ENABLE_MISTRAL_LONG_STORY_PROVIDER' not in w or 'MISTRAL_API_KEY' in w
          print('CANONICAL_PRODUCTION_CONTRACT=PASS')
          print('PROVIDER_PLAN_DYNAMIC=PASS count=%d' % len(p['providers']))
          print('FIXED_SLOTS=PASS')
          print('NO_LEGACY_WORKFLOW_REFERENCE=PASS')
          PY

  plan:
    name: Trend + Council + Intelligence + Story
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      QWENCLOUD_API_KEY: ${{ secrets.QWENCLOUD_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
      ANYAPI_API_KEY: ${{ secrets.ANYAPI_API_KEY }}
      ARLIAI_API_KEY: ${{ secrets.ARLIAI_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
      FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
      ENABLE_MISTRAL_PROVIDER: "true"
      ENABLE_MISTRAL_LONG_STORY_PROVIDER: "true"
      ENABLE_SAMBANOVA_PROVIDER: "true"
      ENABLE_HUGGINGFACE_PROVIDER: "true"
      ENABLE_LLM7_PROVIDER: "true"
      ENABLE_ANYAPI_PROVIDER: "true"
      ENABLE_ARLIAI_PROVIDER: "true"
      ENABLE_OLLAMACLOUD_PROVIDER: "true"
      ENABLE_MODELSCOPE_PROVIDER: "true"
      ENABLE_TOGETHER_PROVIDER: "false"
      ENABLE_FREELLMAPI_PROVIDER: "true"
      ENABLE_OLLAMA_PROVIDER: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install planning dependencies
        run: python -m pip install --disable-pip-version-check json-repair yt-dlp
      - name: Build production plan
        run: |
          set -Eeuo pipefail
          rm -rf "$RUN_DIR"
          mkdir -p "$RUN_DIR"
          python scripts/daily_content_orchestrator.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=Path(os.environ['RUN_DIR'])
          plan=json.loads((r/'daily_plan.json').read_text())
          trend=json.loads((r/'trend_candidates.json').read_text())
          council=json.loads((r/'idea_council.json').read_text())
          judged=json.loads((r/'idea_judged.json').read_text())
          story=json.loads((r/'long_story.json').read_text())
          viral=json.loads((r/'viral_plan.json').read_text())
          assert plan['daily_long_video']['count']==1
          assert plan['daily_long_video']['duration_min']==7 and plan['daily_long_video']['duration_max']==15
          assert plan['daily_shorts']['count']==4
          assert int(trend.get('candidate_count',0))>0
          assert council.get('winner',{}).get('status')=='winner'
          assert judged.get('winner',{}).get('idea_id')
          assert story.get('router')=='Aqaaab AI Router' and story.get('provider')
          assert 18 <= len(story.get('scenes',[])) <= 30
          assert 1050 <= int(story.get('script_words',0)) <= 2100
          assert len(viral.get('shorts',[]))==4
          assert len({int(x['scene_start']) for x in viral['shorts']})==4
          print('TREND_TO_COUNCIL=PASS')
          print('COUNCIL_TO_STORY=PASS')
          print('LONG_STORY=PASS scenes=%d words=%d provider=%s' % (len(story['scenes']),story['script_words'],story['provider']))
          print('FOUR_SHORT_PLAN=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: daily-production-plan-${{ github.run_number }}
          path: ${{ env.RUN_DIR }}

  render-long:
    name: Render Long Video 7-15m
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      BLOCKRUN_VISION_MODEL: nvidia/nemotron-nano-12b-v2-vl
      HF_VISION_MODEL: Qwen/Qwen2.5-VL-3B-Instruct
      AI_ROUTER_ONLY: "true"
      VOICE: af_bella
      SPEED: "0.90"
      KOKORO_LANG: en-us
      MUSIC_ENABLED: "true"
      MUSIC_VOLUME: "0.08"
      ANIMATION_ENABLED: "true"
      REQUIRE_VISION_QA: "true"
      VISION_MIN_SCORE: "0.88"
      VISION_MIN_SEMANTIC_SCORE: "0.85"
      VISION_MIN_DIVERSITY: "0.18"
      VISION_MAX_REQUESTS_PER_RUN: "32"
      VISION_RETRY_MAX: "2"
      VISION_BACKOFF_BASE: "3"
      VISION_CIRCUIT_BREAKER_SECONDS: "600"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: daily-production-plan-${{ github.run_number }}
          path: ${{ env.RUN_DIR }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install render dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg jq curl wget espeak-ng libsndfile1 fonts-dejavu-core fonts-noto-core fonts-noto-extra fonts-noto-cjk
          python -m pip install --disable-pip-version-check google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 soundfile sounddevice kokoro-tts json-repair
      - name: Prepare Kokoro
        run: |
          set -Eeuo pipefail
          mkdir -p kokoro-models
          curl -fL --retry 5 --retry-delay 3 --connect-timeout 30 --max-time 900 -o kokoro-models/kokoro-v1.0.onnx https://github.com/nazdridoy/kokoro-tts/releases/download/v1.0.0/kokoro-v1.0.onnx
          curl -fL --retry 5 --retry-delay 3 --connect-timeout 30 --max-time 900 -o kokoro-models/voices-v1.0.bin https://github.com/nazdridoy/kokoro-tts/releases/download/v1.0.0/voices-v1.0.bin
          echo "KOKORO_MODEL=$GITHUB_WORKSPACE/kokoro-models/kokoro-v1.0.onnx" >> "$GITHUB_ENV"
          echo "KOKORO_VOICES=$GITHUB_WORKSPACE/kokoro-models/voices-v1.0.bin" >> "$GITHUB_ENV"
      - name: Render long form
        run: |
          set -Eeuo pipefail
          python scripts/voice_director.py
          python scripts/preflight_quality.py "$RUN_DIR"
          bash scripts/produce.sh "$RUN_DIR"
          test -s "$RUN_DIR/video.mp4"
          python scripts/final_feature_qa.py "$RUN_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: daily-production-long-${{ github.run_number }}
          path: ${{ env.RUN_DIR }}

  qa-and-package:
    name: QA + Four Shorts + Packaging
    needs: render-long
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MIN_SCENES: "18"
      MAX_SCENES: "30"
      SHORT_MIN_SECONDS: "28"
      SHORT_MAX_SECONDS: "59"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: daily-production-long-${{ github.run_number }}
          path: ${{ env.RUN_DIR }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install QA tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg jq
          python -m pip install --disable-pip-version-check json-repair yt-dlp
      - name: Long form QA
        run: |
          set -Eeuo pipefail
          python scripts/visual_qa.py "$RUN_DIR"
          python scripts/final_feature_qa.py "$RUN_DIR"
          test -s "$RUN_DIR/video.mp4"
      - name: Refresh Shorts intelligence
        run: |
          set -Eeuo pipefail
          CONTENT_INTELLIGENCE_PHASE=post python scripts/content_intelligence_upgrade.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=Path(os.environ['RUN_DIR'])
          d=json.loads((r/'viral_plan.json').read_text())
          assert len(d.get('shorts',[]))==4
          assert len({int(x['scene_start']) for x in d['shorts']})==4
          assert d.get('shorts_intelligence_applied') is True
          PY
      - name: Render four Shorts
        run: |
          set -Eeuo pipefail
          python scripts/short_factory.py
          test "$(find "$RUN_DIR/shorts" -maxdepth 1 -type f -name 'short-*.mp4' | wc -l | tr -d ' ')" -eq 4
      - name: Optimize packaging
        run: |
          set -Eeuo pipefail
          python scripts/packaging_optimizer.py
          python scripts/create_thumbnail.py
          test -s "$RUN_DIR/packaging_candidates.json"
          test -s "$RUN_DIR/thumbnail_candidates.json"
          test -s "$RUN_DIR/thumbnail.jpg"
      - name: Build final production contract
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=Path(os.environ['RUN_DIR'])
          manifest=json.loads((r/'daily_manifest.json').read_text()) if (r/'daily_manifest.json').is_file() else {}
          shorts=json.loads((r/'short_factory_manifest.json').read_text())
          contract={**manifest,'production':{
            'long_video_rendered':True,
            'long_video_qa':True,
            'long_video_duration_target_minutes':[7,15],
            'short_count':4,
            'short_rendered':shorts.get('count')==4,
            'short_qa':shorts.get('count')==4,
            'packaging_ready':(r/'packaging_candidates.json').is_file(),
            'thumbnail_ready':(r/'thumbnail.jpg').is_file(),
            'published':False,
            'learning_recorded':False
          }}
          assert contract['production']['short_rendered'] and contract['production']['short_qa']
          assert contract['production']['packaging_ready'] and contract['production']['thumbnail_ready']
          (r/'production_contract.json').write_text(json.dumps(contract,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PRODUCTION_CONTRACT=PASS')
          PY
          test -s "$RUN_DIR/production_contract.json"
          test -s "$RUN_DIR/video.mp4"
          test "$(find "$RUN_DIR/shorts" -maxdepth 1 -type f -name 'short-*.mp4' | wc -l | tr -d ' ')" -eq 4
          jq -e '.production.long_video_rendered == true and .production.long_video_qa == true and .production.short_count == 4 and .production.short_rendered == true and .production.short_qa == true and .production.packaging_ready == true and .production.thumbnail_ready == true' "$RUN_DIR/production_contract.json" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: daily-production-final-${{ github.run_number }}
          path: ${{ env.RUN_DIR }}
