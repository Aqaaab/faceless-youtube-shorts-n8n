name: Daily Production
# Production is intentionally fail-closed until ENABLE_DAILY_PRODUCTION is explicitly enabled.
# This prevents CI/main changes from publishing while the product audit is still in progress.

on:
  workflow_run:
    workflows: [Car Encyclopedia CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  ENABLE_DAILY_PRODUCTION: ${{ secrets.ENABLE_DAILY_PRODUCTION || '0' }}

jobs:
  production:
    if: ${{ (github.event_name == 'workflow_dispatch' && env.ENABLE_DAILY_PRODUCTION == '1') || (github.event_name == 'workflow_run' && env.ENABLE_DAILY_PRODUCTION == '1' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - name: Production execution disabled unless explicitly enabled
        run: test "$ENABLE_DAILY_PRODUCTION" = "1"
