name: GitHub Toolchain Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/github_toolchain.json'
      - 'scripts/github_toolchain.py'
      - '.github/workflows/github-toolchain-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_DIR: ${{ github.workspace }}/data/toolchain-audit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install research tool
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Validate catalog and adapter
        run: |
          set -Eeuo pipefail
          python -m py_compile scripts/github_toolchain.py
          python -m json.tool config/github_toolchain.json >/dev/null
          python scripts/github_toolchain.py
          test -s "$RUN_DIR/github_toolchain_health.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUN_DIR']) / 'github_toolchain_health.json'
          d = json.loads(p.read_text())
          assert d['catalog_tools']
          assert d['binary_checks']['python'] is True
          print('GITHUB_TOOLCHAIN_AUDIT=PASS')
          PY
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-toolchain-audit
          path: ${{ env.RUN_DIR }}/github_toolchain_health.json
