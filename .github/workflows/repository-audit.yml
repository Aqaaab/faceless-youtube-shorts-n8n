name: Repository Audit

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Static repository audit
        run: python scripts/repository_audit.py
      - name: Compile critical scripts
        run: |
          set -Eeuo pipefail
          python -m py_compile scripts/*.py
      - name: Validate JSON workflows
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('.').glob('workflows/*.json'):
              json.loads(p.read_text(encoding='utf-8'))
              print('JSON_OK', p)
          PY
