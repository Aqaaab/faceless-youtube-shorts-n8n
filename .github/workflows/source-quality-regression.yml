name: Source Quality Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test runtime
        run: python -m pip install --disable-pip-version-check --no-input json-repair
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Source enrichment tests
        run: python -m unittest discover -s tests -p 'test_source_enrichment.py' -v
      - name: Episode format tests
        run: python -m unittest discover -s tests -p 'test_episode_format.py' -v
      - name: Strict story gate tests
        run: python -m unittest discover -s tests -p 'test_strict_story_gate.py' -v
      - name: Contract tests
        run: python -m unittest discover -s tests -p 'test_contracts.py' -v
