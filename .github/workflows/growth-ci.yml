name: Growth Engine CI

on:
  pull_request:
    paths:
      - "scripts/growth_generate.py"
      - "scripts/performance_learning.py"
      - ".github/workflows/youtube-shorts.yml"
      - ".github/workflows/growth-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - name: Validate Python
        run: python -m py_compile scripts/*.py
      - name: Validate Bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/*.sh
          for file in scripts/*.sh; do bash -n "$file"; done
      - name: Validate Node
        run: |
          node --check build_workflow.js
          node --check build_cleaning_workflow.js
