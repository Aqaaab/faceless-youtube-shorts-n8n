name: Strict Gate Fix Runner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[strict-gate-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Repair numeric fact extraction
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/strict_story_gate.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('def _numbers(')
          end = s.index('\n\ndef _same_numeric_facts', start)
          new_block = '''def _mask_identifier_digits(text: str) -> str:\n    """Remove digits that belong to alphanumeric identifiers such as R35, V6, or 911GT3."""\n    value = _normalize(text)\n    return re.sub(r"(?<=[A-Za-z\\u0600-\\u06ff])\\d+|\\d+(?=[A-Za-z\\u0600-\\u06ff])", "", value)\n\n\ndef _numbers(text: str, language: str) -> Counter[str]:\n    value = _mask_identifier_digits(text)\n    explicit = [str(number) for number in _explicit_numbers(value)]\n    words = _english_numbers(value) if language == "en" else _arabic_numbers(value)\n    return Counter(explicit + [str(number) for number in words])\n'''
          s = s[:start] + new_block + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile scripts/strict_story_gate.py
          python -m unittest discover -s tests -p 'test_strict_story_gate.py' -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/strict_story_gate.py
          git commit -m 'fix: numeric facts ignore vehicle identifiers [strict-gate-autofix]'
          git push origin HEAD:main
      - name: Remove fixer
        if: ${{ success() }}
        run: |
          rm -f .github/workflows/strict-gate-fix.yml
          git add -u .github/workflows/strict-gate-fix.yml
          git commit -m 'chore: remove strict gate fixer [strict-gate-autofix]' || true
          git push origin HEAD:main || true
